
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Financeiro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        h1 {
            margin-bottom: 25px;
            color: #222;
        }

        .topo {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .cardResumo {
            background: white;
            border-radius: 10px;
            padding: 20px;
            min-width: 220px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .cardResumo h3 {
            font-size: 15px;
            margin-bottom: 10px;
            color: #666;
        }

        .cardResumo .valor {
            font-size: 28px;
            font-weight: bold;
            color: #111;
        }

        .filtros {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;

            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        input,
        select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            min-width: 180px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #1d4ed8;
            color: white;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        .tabela {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #1e293b;
            color: white;
            padding: 14px;
            text-align: left;
            font-size: 14px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        tr:hover {
            background: #f8fafc;
        }

        .receber {
            color: #15803d;
            font-weight: bold;
        }

        .pagar {
            color: #dc2626;
            font-weight: bold;
        }

        .pendente {
            color: #ca8a04;
            font-weight: bold;
        }

        .pago {
            color: #15803d;
            font-weight: bold;
        }

        .acoes {
            display: flex;
            gap: 8px;
        }

        .btnPago {
            background: #15803d;
        }

        .btnExcluir {
            background: #dc2626;
        }
    </style>
</head>

<body>

    <h1>Financeiro</h1>


    <div class="topo">

        <div class="cardResumo">
            <h3>Total a Receber</h3>
            <div class="valor" id="totalReceber">R$ 0,00</div>
        </div>

        <div class="cardResumo">
            <h3>Total a Pagar</h3>
            <div class="valor" id="totalPagar">R$ 0,00</div>
        </div>

        <div class="cardResumo">
            <h3>Total Pago</h3>
            <div class="valor" id="totalPago">R$ 0,00</div>
        </div>

        <div class="cardResumo">
            <h3>Saldo</h3>
            <div class="valor" id="saldoFinal">R$ 0,00</div>
        </div>

    </div>


    <div class="filtros">

        <select id="filtroTipo">
            <option value="">Todos Tipos</option>
            <option value="RECEBER">Receber</option>
            <option value="PAGAR">Pagar</option>
        </select>

        <select id="filtroStatus">
            <option value="">Todos Status</option>
            <option value="PENDENTE">Pendente</option>
            <option value="PAGO">Pago</option>
        </select>

        <input type="text" id="filtroParceiro" placeholder="Parceiro">

        <button onclick="carregarFinanceiro()">Atualizar</button>

    </div>


    <div class="tabela">

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tipo</th>
                    <th>Parceiro</th>
                    <th>Banco</th>
                    <th>Semana</th>
                    <th>Produto/Serviço</th>
                    <th>Valor</th>
                    <th>Vencimento</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="tbodyFinanceiro"></tbody>

        </table>

    </div>


    <script>

        const API = "https://api-production-6670.up.railway.app"


        async function carregarFinanceiro() {

            try {

                const response = await fetch(`${API}/financeiro`)

                const dados = await response.json()

                const tbody = document.getElementById("tbodyFinanceiro")

                tbody.innerHTML = ""


                let totalReceber = 0
                let totalPagar = 0
                let totalPago = 0


                const tipoFiltro = document.getElementById("filtroTipo").value
                const statusFiltro = document.getElementById("filtroStatus").value
                const parceiroFiltro = document.getElementById("filtroParceiro").value.toLowerCase()


                let filtrados = dados.filter(item => {

                    const okTipo = !tipoFiltro || item.tipo === tipoFiltro

                    const okStatus = !statusFiltro || item.status === statusFiltro

                    const okParceiro = !parceiroFiltro ||
                        (item.parceiro || "")
                        .toLowerCase()
                        .includes(parceiroFiltro)

                    return okTipo && okStatus && okParceiro

                })


                filtrados.forEach(item => {

                    const valor = Number(item.valor || 0)

                    if (item.tipo === "RECEBER") {
                        totalReceber += valor
                    }

                    if (item.tipo === "PAGAR") {
                        totalPagar += valor
                    }

                    if (item.status === "PAGO") {
                        totalPago += valor
                    }


                    tbody.innerHTML += `

                        <tr>

                            <td>${item.id}</td>

                            <td class="${item.tipo === 'RECEBER' ? 'receber' : 'pagar'}">
                                ${item.tipo}
                            </td>

                            <td>${item.parceiro || ''}</td>

                            <td>${item.banco || ''}</td>

                            <td>${item.semana || ''}</td>

                            <td>${item.produto_servico || ''}</td>

                            <td>
                                ${valor.toLocaleString('pt-BR', {
                                    style: 'currency',
                                    currency: 'BRL'
                                })}
                            </td>

                            <td>
                                ${item.vencimento
                                    ? new Date(item.vencimento).toLocaleDateString('pt-BR')
                                    : ''}
                            </td>

                            <td class="${item.status === 'PAGO' ? 'pago' : 'pendente'}">
                                ${item.status}
                            </td>

                            <td>

                                <div class="acoes">

                                    <button
                                        class="btnPago"
                                        onclick="baixarLancamento(${item.id})"
                                    >
                                        Baixar
                                    </button>

                                    <button
                                        class="btnExcluir"
                                        onclick="excluirLancamento(${item.id})"
                                    >
                                        Excluir
                                    </button>

                                </div>

                            </td>

                        </tr>

                    `

                })


                document.getElementById("totalReceber").innerText =
                    totalReceber.toLocaleString('pt-BR', {
                        style: 'currency',
                        currency: 'BRL'
                    })


                document.getElementById("totalPagar").innerText =
                    totalPagar.toLocaleString('pt-BR', {
                        style: 'currency',
                        currency: 'BRL'
                    })


                document.getElementById("totalPago").innerText =
                    totalPago.toLocaleString('pt-BR', {
                        style: 'currency',
                        currency: 'BRL'
                    })


                const saldo = totalReceber - totalPagar

                document.getElementById("saldoFinal").innerText =
                    saldo.toLocaleString('pt-BR', {
                        style: 'currency',
                        currency: 'BRL'
                    })

            }

            catch (err) {

                console.error(err)

                alert("Erro ao carregar financeiro")

            }

        }



        async function baixarLancamento(id) {

            try {

                await fetch(`${API}/financeiro/${id}/pagar`, {
                    method: 'PUT'
                })

                carregarFinanceiro()

            }

            catch (err) {

                console.error(err)

                alert("Erro ao baixar lançamento")

            }

        }



        async function excluirLancamento(id) {

            const confirmar = confirm("Deseja excluir este lançamento?")

            if (!confirmar) return

            try {

                await fetch(`${API}/financeiro/${id}`, {
                    method: 'DELETE'
                })

                carregarFinanceiro()

            }

            catch (err) {

                console.error(err)

                alert("Erro ao excluir")

            }

        }


        carregarFinanceiro()

    </script>

</body>
