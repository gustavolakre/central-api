<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Início</title>

<script src="/janelas/logout.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI", Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(160deg,#eef2f7 0%,#e3e9f5 100%);
    color:#1e293b;
    padding:40px 24px;
    min-height:100vh;
}


/* CONTAINER */

.container{
    max-width:1100px;
    margin:auto;
    background:#ffffff;
    padding:40px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,0.8);
    box-shadow:0 10px 40px rgba(15,23,42,0.10);
}


/* CABEÇALHO */

.cabecalho{
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:32px;
    padding-bottom:22px;
    border-bottom:1px solid #e2e8f0;
}

.cabecalho-icone{
    width:56px;
    height:56px;
    flex-shrink:0;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    background:linear-gradient(135deg,#3b82f6,#2563eb);
    box-shadow:0 6px 16px rgba(37,99,235,0.35);
}

h1{
    color:#0f172a;
    font-size:30px;
    font-weight:700;
}

.subtitulo{
    margin-top:6px;
    color:#64748b;
    font-size:15px;
}


/* GRID MENU */

.gridMenu{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:22px;
}

@media (max-width:900px){
    .gridMenu{
        grid-template-columns:1fr;
    }
}


/* CARDS */

.cardMenu{
    position:relative;
    overflow:hidden;
    padding:30px;
    border-radius:16px;
    color:white;
    cursor:pointer;
    transition:0.2s;
    min-height:230px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    box-shadow:0 6px 18px rgba(15,23,42,0.10);
}

.cardMenu:hover{
    transform:translateY(-4px);
    box-shadow:0 16px 32px rgba(15,23,42,0.22);
}

.cardIcone{
    width:48px;
    height:48px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    margin-bottom:16px;
    background:rgba(255,255,255,0.20);
}

.cardMenu h2{
    margin-bottom:10px;
    font-size:22px;
    font-weight:700;
}

.cardMenu p{
    font-size:14px;
    line-height:1.5;
    opacity:0.92;
}

.cardSeta{
    position:absolute;
    right:24px;
    bottom:22px;
    font-size:22px;
    opacity:0;
    transition:0.2s;
}

.cardMenu:hover .cardSeta{
    opacity:0.95;
    transform:translateX(4px);
}


/* CORES CARDS */

.faturamento{
    background:linear-gradient(135deg,#3b82f6,#2563eb);
}

.financeiro{
    background:linear-gradient(135deg,#10b981,#059669);
}

.paineis{
    background:linear-gradient(135deg,#8b5cf6,#7c3aed);
}

</style>

</head>

<body>

<div class="container">

    <div class="cabecalho">

        <div class="cabecalho-icone">🏠</div>

        <div>

            <h1>Início</h1>

            <div class="subtitulo">
                Selecione um módulo para começar
            </div>

        </div>

    </div>


    <div class="gridMenu">

        <div
            class="cardMenu faturamento"
            onclick="abrir('/janelas/inicial-faturamento.html')"
        >

            <div class="cardIcone">🚚</div>

            <h2>Faturamento</h2>

            <p>
                Faturamento de cargas e fretes
                e importações.
            </p>

            <span class="cardSeta">→</span>

        </div>


        <div
            class="cardMenu financeiro"
            onclick="abrir('/janelas/lancamentos-de-contas.html')"
        >

            <div class="cardIcone">💰</div>

            <h2>Financeiro</h2>

            <p>
                Lançamentos, fluxo de caixa,
                relatórios e DRE.
            </p>

            <span class="cardSeta">→</span>

        </div>


        <div
            class="cardMenu paineis"
            onclick="abrir('/janelas/dashboard.html')"
        >

            <div class="cardIcone">📊</div>

            <h2>Painéis</h2>

            <p>
                Painéis de responsáveis, cargas,
                parceiros e fluxo.
            </p>

            <span class="cardSeta">→</span>

        </div>

    </div>

</div>


<script>

    function salvarDestinoEIrLogin() {

        localStorage.setItem(
            "paginaDestino",
            window.location.pathname + window.location.search
        );

        localStorage.removeItem("token");

        window.location.href = "/login";

    }

    async function validarLogin() {

        const token =
            localStorage.getItem("token");

        if (!token) {
            salvarDestinoEIrLogin();
            return;
        }

        try {

            const resposta =
                await fetch(
                    "/validar-token",
                    {
                        headers: {
                            Authorization:
                                `Bearer ${token}`
                        }
                    }
                );

            if (!resposta.ok) {
                salvarDestinoEIrLogin();
            }

        } catch {
            salvarDestinoEIrLogin();
        }

    }

    validarLogin();


    function abrir(url){
        window.location.href = url;
    }

</script>

</body>

</html>
