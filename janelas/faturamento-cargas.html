<script>

async function validarLogin() {

    const token =
        localStorage.getItem("token");

    if (!token) {

        window.location.href =
            "/login";

        return;
    }

    try {

        const resposta =
            await fetch(
                "/validar-token",
                {
                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );

        if (!resposta.ok) {

            localStorage.removeItem(
                "token"
            );

            window.location.href =
                "/login";
        }

    } catch {

        window.location.href =
            "/login";
    }

}

validarLogin();



  Object.keys(localStorage)
        .filter(k =>
            k.startsWith("nf_compr_") ||
            k.startsWith("nf_fornec_")
        )
        .forEach(k => localStorage.removeItem(k))


        let tipoOperacao = "comprador"
        document.getElementById("tipoOperacao").addEventListener("change", function() {
            tipoOperacao = this.value
            montarAgrupamento()
            gerarRelatorio()
        })

        document.getElementById("discriminacao").addEventListener("input", function() {
            gerarRelatorio()
        })

        let dadosPlanilha = []
        let tiposSuino = []
        let agrupado = {}
        let estadoCampos = {}
        let baseParceiros = []
        let compradoresSelecionados = new Set()
        let fornecedoresSelecionados = new Set()
        let semanasSelecionadas = new Set()
        let primeiraCargaSemanas = true
        let agruparSelecionados = false
        let registrosFaturados = []

        const API_URL = "https://api-production-6670.up.railway.app"

        const PROCESSO_SESSAO = "FATURAMENTO_CARGAS"

        let usuarioEmail = ""

        let autoSaveTimer = null


        function getAuthHeaders() {

           const token = localStorage.getItem("token")

           if (!token) {
             location.href = "login.html"
             throw new Error("Sem token")
           }

           return {
             "Content-Type": "application/json",
             "Authorization": `Bearer ${token}`
            }
         }


        async function obterUsuarioEmail() {

            const resp = await fetch(
                "/validar-token",
                { headers: getAuthHeaders() }
            )

            if (!resp.ok) {
                throw new Error("Sessão inválida")
            }

            const data = await resp.json()

            usuarioEmail =
                data.usuario?.email ||
                data.usuario?.usuario ||
                ""

            return usuarioEmail
        }


        function montarPayloadSessao() {

            capturarCampos()

            let nfStorage = {}

            Object.keys(localStorage).forEach(key => {

                if (
                    key.startsWith("nf_compr_") ||
                    key.startsWith("nf_fornec_")
                ) {
                    nfStorage[key] = localStorage.getItem(key)
                }

            })

            return {

                planilha: dadosPlanilha.map(d => ({
                    ...d,
                    enviadoControle: d.enviadoControle || false
                })),
                base: baseParceiros || [],
                estadoCampos: estadoCampos || {},
                compradoresSelecionados: Array.from(compradoresSelecionados || []),
                fornecedoresSelecionados: Array.from(fornecedoresSelecionados || []),
                semanasSelecionadas: Array.from(semanasSelecionadas || []),
                agruparSelecionados: agruparSelecionados || false,
                registrosFaturados: registrosFaturados.map(r => ({
                    ...r,
                    enviadoPipefy: r.enviadoPipefy || false,
                    enviadoControle: r.enviadoControle || false
                })),
                discriminacao: document.getElementById("discriminacao").value || "",
                produtoServico: document.getElementById("produtoServico").value || "",
                mesGerencial: document.getElementById("mesGerencial").value || "",
                tipoOperacao: document.getElementById("tipoOperacao").value || "comprador",
                nfStorage
            }
        }


        function aplicarSessao(dados) {

            dadosPlanilha = dados.planilha || []
            dadosPlanilha = dadosPlanilha.map(l => ({
                ...l,
                enviadoControle: l.enviadoControle || false
            }))

            baseParceiros = dados.base || []
            estadoCampos = dados.estadoCampos || {}

            compradoresSelecionados = new Set(dados.compradoresSelecionados || [])
            fornecedoresSelecionados = new Set(dados.fornecedoresSelecionados || [])
            semanasSelecionadas = new Set(dados.semanasSelecionadas || [])

            agruparSelecionados = dados.agruparSelecionados || false

            let checkboxAgrupar = document.querySelector(
                'input[onchange="toggleAgrupamentoSelecionados(this.checked)"]'
            )

            if (checkboxAgrupar) {
                checkboxAgrupar.checked = agruparSelecionados
            }

            registrosFaturados = (dados.registrosFaturados || []).map(r => ({
                ...r,
                enviadoPipefy: r.enviadoPipefy || false,
                enviadoControle: r.enviadoControle || false
            }))

            Object.keys(localStorage)
                .filter(k =>
                    k.startsWith("nf_compr_") ||
                    k.startsWith("nf_fornec_")
                )
                .forEach(k => localStorage.removeItem(k))

            if (dados.nfStorage) {
                for (let key in dados.nfStorage) {
                    localStorage.setItem(key, dados.nfStorage[key])
                }
            }

            document.getElementById("discriminacao").value = dados.discriminacao || ""
            document.getElementById("produtoServico").value = dados.produtoServico || ""
            document.getElementById("mesGerencial").value = dados.mesGerencial || ""
            document.getElementById("tipoOperacao").value = dados.tipoOperacao || "comprador"

            tipoOperacao = dados.tipoOperacao || "comprador"

            tiposSuino = [...new Set(dadosPlanilha.map(d => d["Tipo Suíno"]))]

            montarListaSemanas()
            montarListasSeparadas()
            montarAgrupamento()
            gerarRelatorio()
        }


        async function salvarSessaoServidor(silencioso) {

            const payload = montarPayloadSessao()

            const resp = await fetch(
                `/faturamento-sessao/${PROCESSO_SESSAO}`,
                {
                    method: "PUT",
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ dados: payload })
                }
            )

            if (!resp.ok) {
                const err = await resp.json()
                throw new Error(err.erro || "Erro ao salvar sessão")
            }

            if (!silencioso) {
                console.log("💾 Sessão salva no servidor")
            }

            return payload
        }


        async function iniciarOuRetomarSessao() {

            await obterUsuarioEmail()

            const resp = await fetch(
                `/faturamento-sessao/${PROCESSO_SESSAO}`,
                { headers: getAuthHeaders() }
            )

            const data = await resp.json()
            const sessao = data.sessao

            if (
                sessao &&
                sessao.status === "EM_ANDAMENTO"
            ) {

                if (sessao.iniciado_por !== usuarioEmail) {

                    alert(
                        `Faturamento em andamento por ${sessao.iniciado_por}.`
                    )

                    window.location.href =
                        "/janelas/inicial.html"

                    return
                }

                aplicarSessao(sessao.dados_json)

                console.log("♻️ Sessão retomada do servidor")

                iniciarAutoSave()

                return
            }

            await carregarDadosBanco()

            const payload = montarPayloadSessao()

            const criar = await fetch(
                "/faturamento-sessao",
                {
                    method: "POST",
                    headers: getAuthHeaders(),
                    body: JSON.stringify({
                        processo: PROCESSO_SESSAO,
                        dados: payload
                    })
                }
            )

            if (!criar.ok) {
                const err = await criar.json()
                throw new Error(err.erro || "Erro ao iniciar sessão")
            }

            console.log("🆕 Nova sessão iniciada no servidor")

            iniciarAutoSave()
        }


        function iniciarAutoSave() {

            if (autoSaveTimer) {
                clearInterval(autoSaveTimer)
            }

            autoSaveTimer = setInterval(() => {
                salvarSessaoServidor(true).catch(console.error)
            }, 180000)
        }


        async function salvarESair() {

            try {

                await salvarSessaoServidor()

                alert("Sessão salva. Você pode retomar depois.")

                window.location.href =
                    "/janelas/inicial.html"

            } catch (err) {

                console.error(err)
                alert(err.message || "Erro ao salvar sessão")

            }

        }


        async function concluirFaturamento() {

            const ok = confirm(
                "Concluir o faturamento? A sessão será encerrada."
            )

            if (!ok) return

            try {

                await salvarSessaoServidor(true)

                await fetch(
                    `/faturamento-sessao/${PROCESSO_SESSAO}/concluir`,
                    {
                        method: "POST",
                        headers: getAuthHeaders()
                    }
                )

                if (autoSaveTimer) {
                    clearInterval(autoSaveTimer)
                }

                alert("Faturamento concluído.")

                window.location.href =
                    "/janelas/inicial.html"

            } catch (err) {

                console.error(err)
                alert(err.message || "Erro ao concluir")

            }

        }


        function abrirSessao() {
            document.getElementById("arquivoSessao").click()
        }

        function idSeguro(t) {
            return t.replace(/[^a-zA-Z0-9]/g, "_")
        }

        function formatar(v) {
            return "R$ " + v.toLocaleString("pt-BR", {
                minimumFractionDigits: 2
            })
        }

        function formatarMoeda(valor) {
            return valor.toLocaleString("pt-BR", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            })
        }

        function destacarGrupo(id) {
            let nf = document.getElementById(`nf_${id}`).value
            let grupo = document.getElementById(`grupo_${id}`)
            if (nf && nf.trim() !== "") {
                grupo.style.background = "#e8f5e9"
                grupo.style.border = "1px solid #4CAF50"
            } else {
                grupo.style.background = "white"
                grupo.style.border = "1px solid #ccc"
            }
        }

      

        function buscarParceiro(nomeUsual) {
           if (!baseParceiros.length) return null

           return baseParceiros.find(p =>
               String(p.nome_usual || "")
                   .trim()
                   .toUpperCase()
               ===
              String(nomeUsual || "")
                  .trim()
                  .toUpperCase()
                )
           }

        function montarListasSeparadas() {
            if (!dadosPlanilha.length) return
            let compradores = [...new Set(dadosPlanilha.map(d => d["Comprador"]))]
            let fornecedores = [...new Set(dadosPlanilha.map(d => d["Fornecedor"]))]
            compradores.sort((a, b) => a.localeCompare(b, 'pt-BR'))
            fornecedores.sort((a, b) => a.localeCompare(b, 'pt-BR'))

            if (compradoresSelecionados.size === 0) {
                compradores.forEach(c => compradoresSelecionados.add(c))
            }
            if (fornecedoresSelecionados.size === 0) {
                fornecedores.forEach(f => fornecedoresSelecionados.add(f))
            }

            let htmlC = ""
            compradores.forEach(nome => {
                let checked = compradoresSelecionados.has(nome) ? "checked" : ""
                htmlC += `<label style="display:block;">
                    <input type="checkbox" ${checked} onchange="toggleComprador(this,'${nome}')"> ${nome}
                </label>`
            })

            let htmlF = ""
            fornecedores.forEach(nome => {
                let checked = fornecedoresSelecionados.has(nome) ? "checked" : ""
                htmlF += `<label style="display:block;">
                    <input type="checkbox" ${checked} onchange="toggleFornecedor(this,'${nome}')"> ${nome}
                </label>`
            })

            document.getElementById("listaCompradores").innerHTML = htmlC
            document.getElementById("listaFornecedores").innerHTML = htmlF
        }

        function toggleComprador(el, nome) {
            capturarCampos()
            if (el.checked) {
                compradoresSelecionados.add(nome)
            } else {
                compradoresSelecionados.delete(nome)
            }
            montarAgrupamento()
            gerarRelatorio()
        }

        function toggleFornecedor(el, nome) {
            capturarCampos()
            if (el.checked) {
                fornecedoresSelecionados.add(nome)
            } else {
                fornecedoresSelecionados.delete(nome)
            }
            montarAgrupamento()
            gerarRelatorio()
        }

        function selecionarTodosCompradores() {
            dadosPlanilha.forEach(d => {
                compradoresSelecionados.add(d["Comprador"])
            })
            montarListasSeparadas()
            montarAgrupamento()
            gerarRelatorio()
        }

        function limparCompradores() {
            compradoresSelecionados.clear()
            document.querySelectorAll("#listaCompradores input[type='checkbox']")
                .forEach(cb => cb.checked = false)
            montarAgrupamento()
            gerarRelatorio()
        }

        function selecionarTodosFornecedores() {
            dadosPlanilha.forEach(d => {
                fornecedoresSelecionados.add(d["Fornecedor"])
            })
            montarListasSeparadas()
            montarAgrupamento()
            gerarRelatorio()
        }

        function limparFornecedores() {
            fornecedoresSelecionados.clear()
            document.querySelectorAll("#listaFornecedores input[type='checkbox']")
                .forEach(cb => cb.checked = false)
            montarAgrupamento()
            gerarRelatorio()
        }

        /* AGRUPAMENTO */
        function montarAgrupamento() {
            agrupado = {}
            dadosPlanilha.forEach(l => {
                if (tipoOperacao === "comprador") {
                    if (l["NF Taxa Compr."] || l["NF Taxa Compr"]) {
                        return
                    }
                }
                if (tipoOperacao === "fornecedor") {
                    if (l["NF Taxa Fornec."] || l["NF Taxa Fornec"]) {
                        return
                    }
                }

                let semana = extrairSemana(getEtiqueta(l))
                if (semanasSelecionadas.size === 0) {
                    return
                }
                if (!semana) {
                    return
                }
                if (!semanasSelecionadas.has(semana)) {
                    return
                }

                let comprador = l["Comprador"] || "SEM COMPRADOR"
                let fornecedor = l["Fornecedor"] || "SEM FORNECEDOR"

                if (agruparSelecionados) {
                    if (compradoresSelecionados.size === 0 && fornecedoresSelecionados.size === 0) {
                        return
                    }
                }

                let tipo = l["Tipo Suíno"] || "SEM TIPO"

                if (compradoresSelecionados.size > 0 && !compradoresSelecionados.has(comprador)) {
                    return
                }
                if (fornecedoresSelecionados.size > 0 && !fornecedoresSelecionados.has(fornecedor)) {
                    return
                }

                let chave = agruparSelecionados ? "GRUPO SELECIONADO" : (tipoOperacao === "comprador" ? comprador : fornecedor)

                if (!agrupado[chave]) {
                    agrupado[chave] = {
                        dados: [],
                        totalQtd: 0,
                        totalMortos: 0,
                        participantes: new Set()
                    }
                }

                let qtd = Number(l["Quantidade"] || 0)
                let mortos = Number(l["Mortos em transporte"] || 0)
                agrupado[chave].dados.push(l)
                agrupado[chave].totalQtd += qtd
                agrupado[chave].totalMortos += mortos

                if (agruparSelecionados) {
                    if (tipoOperacao === "comprador") {
                        agrupado[chave].participantes.add(comprador)
                    } else {
                        agrupado[chave].participantes.add(fornecedor)
                    }
                }
            })
        }

        /* RELATORIO */
        function gerarRelatorio() {
            let html = ""
            let textoDisc = document.getElementById("discriminacao").value || ""
            for (let chave in agrupado) {
                let g = agrupado[chave]
                let id = idSeguro(chave)

        function calcular(chave) {

                let tipo = d["Tipo Suíno"]

                let mortos = Number(d["Mortos em transporte"] || 0)
                if (!mapa[tipo]) mapa[tipo] = 0
                mapa[tipo] += naoDescontarMortos ? qtd : (qtd - mortos)
            })
            for (let tipo in mapa) {
                let qtd = mapa[tipo]
                let preco = Number(document.getElementById(`preco_${id}_${idSeguro(tipo)}`).value || 0)
                let valor = qtd * preco
                total += valor

            }
            let trib = total * 0.18
            html += `

                  font-weight:bold;
                  color:#1565c0;

    </div>
`

html += `<br><span style="color:#d32f2f; font-weight:bold;">Valor dos Tributos (18%): ${formatar(trib)}</span>`

        function gerarExcel() {
            if (!registrosFaturados || registrosFaturados.length === 0) {
                alert("Não há dados para exportar.")
                return
            }

            let linhas = registrosFaturados.map(r => ({
                "Periodo": r["Periodo"] || "",
                "Parceiro": r["Parceiro"] || "",
                "Nota Fiscal": r["Nota Fiscal"] || "",
                "Valor Liquido": Number(r["Valor Líquido"]) || 0,
                "Data do Vencimento": r["Data de Vencimento"]
                ? (() => {

                     let partes = r["Data de Vencimento"].split("-")

                     let ano = Number(partes[0])
                     let mes = Number(partes[1]) - 1
                     let dia = Number(partes[2])

                     let dataLocal = new Date(ano, mes, dia)

                     return (dataLocal - new Date(1899, 11, 30)) / 86400000

                 })()
               : "",
                "Responsável": "307283950"
            }))

            let ws = XLSX.utils.json_to_sheet(linhas)
            let range = XLSX.utils.decode_range(ws['!ref'])
            for (let r = 1; r <= range.e.r; r++) {
                let cellValor = ws[XLSX.utils.encode_cell({
                    r: r,
                    c: 3
                })]
                if (cellValor) {
                    cellValor.z = '#,##0.00'
                }
                let cellData = ws[XLSX.utils.encode_cell({
                    r: r,
                    c: 4
                })]
                if (cellData) {
                    cellData.t = 'n'
                    cellData.z = 'dd/mm/yyyy'
                }
            }
            let wb = XLSX.utils.book_new()
            XLSX.utils.book_append_sheet(wb, ws, "Relatorio")
            XLSX.writeFile(wb, "relatorio_faturamento.xlsx")
        }

        function extrairSemana(valor) {

    if (!valor) return null

    try {

        let semana = null

        // 🔥 formato JSON string
        if (
            typeof valor === "string" &&
            valor.startsWith("[")
        ) {

            let arr = JSON.parse(valor)

            if (
                Array.isArray(arr) &&
                arr.length >= 2
            ) {

                semana = String(arr[1]).trim()

            }

        } else {

            // 🔥 fallback texto normal
            let partes = String(valor).split(",")

            if (partes.length >= 2) {

                semana = partes[1]
                    .replace(/[\[\]"]/g, "")
                    .trim()

            }

        }

        // 🔥 aceita SOMENTE yyyy/nn
        if (
            semana &&
            /^\d{4}\/\d{1,2}$/.test(semana)
        ) {

            return semana

        }

        return null

    } catch (err) {

        console.error(
            "ERRO EXTRAIR SEMANA:",
            valor,
            err
        )

        return null

    }

}

        function montarListaSemanas() {

            semanas.sort((a, b) => {
                let [anoA, semA] = a.split("/").map(Number)
                let [anoB, semB] = b.split("/").map(Number)
                return anoA - anoB || semA - semB
            })

            if (primeiraCargaSemanas) {
                semanas.forEach(s => semanasSelecionadas.add(s))
                primeiraCargaSemanas = false

            let html = ""
            semanas.forEach(sem => {
                let checked = semanasSelecionadas.has(sem) ? "checked" : ""
                html += `<label style="display:block;">
                    <input type="checkbox" ${checked} onchange="toggleSemana(this,'${sem}')"> ${sem}
                </label>`
            })
            document.getElementById("listaSemanas").innerHTML = html
        }

        data_emissao: hoje,

        vencimento: venc || null,

        nota_fiscal: r["Nota Fiscal"] || "",

        observacao: ""

      };

      const resp = await fetch(
        `${API_URL}/financeiro`,
        {
          method: "POST",
          headers: getAuthHeaders(),
          body: JSON.stringify(body)
        }
      );

      if (resp.ok) {

        );

      );

    }

  }

    let cards = []

    let selecionados = Array.from(
       document.querySelectorAll(".checkCarga:checked")
    ).map(cb => Number(cb.dataset.id))

    if (selecionados.length === 0) {
         alert("Selecione pelo menos uma carga.")
         return
    }



    registrosFaturados.forEach(r => {

        // 🔒 evita reenviar
        if (r.enviadoControle) {
            return
        }

        let nf = r["Nota Fiscal"]

        dadosPlanilha.forEach(d => {

            let nfCompr = d["NF Taxa Compr."] || d["NF Taxa Compr"] || ""
            let nfFornec = d["NF Taxa Fornec."] || d["NF Taxa Fornec"] || ""

            // 🔍 encontra linhas ligadas ao faturamento
            let codigoLinha = Number(String(d["Código"]).trim())

            if (
                selecionados.includes(codigoLinha) &&
              (nfCompr === nf || nfFornec === nf)
            ) {

              if (nfCompr || nfFornec) {

                 cards.push({
                      cardId: Number(d["Código"]),
                      nfCompr,
                      nfFornec
                })

           }

       }

        })

    })

    // 🔥 remove duplicados
    cards = cards.filter((c, index, self) =>
        index === self.findIndex(x => x.cardId === c.cardId)
    )

    console.log("CARDS PARA ENVIO:", cards)

    if (cards.length === 0) {
        alert("Nenhum card pronto para envio.")
        return
    }

    try {

        const response = await fetch(
            `${API_URL}/importar-pipefy`,
        {
             method:"POST",
             headers:getAuthHeaders(),
             body:JSON.stringify({ cards })
        }
       )

       await verificar401(response)

        const data = await response.json()

        console.log("RESPOSTA BACKEND:", data)

        // ✅ marca somente as cargas enviadas
        cards.forEach(card => {

            dadosPlanilha.forEach(d => {

             let codigo = Number(String(d["Código"]).trim())

             if (codigo === Number(card.cardId)) {
               d.enviadoControle = true
             }

          })

       })

      // 🔥 marca faturamentos relacionados às cargas enviadas
       registrosFaturados.forEach(r => {

          let nf = r["Nota Fiscal"]

          let possuiCargaEnviada = dadosPlanilha.some(d => {

            let nfCompr = d["NF Taxa Compr."] || d["NF Taxa Compr"] || ""
            let nfFornec = d["NF Taxa Fornec."] || d["NF Taxa Fornec"] || ""

          return (
               d.enviadoControle &&
              (nfCompr === nf || nfFornec === nf)
             )

        })

         if (possuiCargaEnviada) {
            r.enviadoControle = true
         }

     })

        fecharFaturados()
        abrirFaturados()

        alert(`Enviados: ${cards.length}`)

    } catch (error) {

        console.error("ERRO NO ENVIO:", error)
        alert("Erro ao enviar dados.")

    }

}
