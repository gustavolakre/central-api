<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Relat&oacute;rio para Faturamento</title>
    <link rel="stylesheet" href="/janelas/css/base.css">
    <link rel="stylesheet" href="/janelas/css/tema-claro-faturamento.css">
    <link rel="stylesheet" href="/janelas/css/topbar-faturamento.css">
    <link rel="stylesheet" href="/janelas/css/faturamento-form.css">
    <link rel="stylesheet" href="/janelas/css/faturamento-cargas.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="/janelas/auth.js"></script>
    <script src="/janelas/logout.js"></script>
</head>

<body class="tema-claro-faturamento tema-claro-faturamento--pad-25">
    <div class="topbar topbar--full-bleed">
        <div class="topbar-grupo">
            <button class="btn-voltar" onclick="voltarInicioFaturamento()">&#11013; Voltar ao in&iacute;cio</button>
            <span class="topbar-titulo">Faturamento de Cargas</span>
        </div>
        <div class="topbar-grupo">
            <button onclick="salvarSessao()">Salvar Sess&atilde;o</button>
            <button onclick="salvarESair()">Salvar e sair</button>
            <button onclick="abrirSessao()">Abrir Sess&atilde;o (arquivo)</button>
            <button onclick="novaSessao()">Nova Sess&atilde;o</button>
        </div>
    </div>

    <div style="display:flex; justify-content:center; align-items:flex-start; gap:60px; flex-wrap:wrap; margin-bottom:10px;">
        <div>
            <div class="campoTopo">
                <b>Tipo de Opera&ccedil;&atilde;o</b><br>
                <select id="tipoOperacao">
                    <option value="comprador">Comprador</option>
                    <option value="fornecedor">Fornecedor</option>
                </select>
            </div>
            <div class="campoTopo">
                <b>Discrimina&ccedil;&atilde;o / Per&iacute;odo</b><br>
                <input type="text" id="discriminacao">
            </div>
            <div class="campoTopo">
                <b>Produto / Servi&ccedil;o</b><br>
                <input type="text" id="produtoServico">
            </div>
            <div class="campoTopo">
                <b>Conta Gerencial</b><br>
                <select id="mesGerencial">
                    <option value="">Selecione</option>
                </select>
            </div>
        </div>

        <div style="width:222px;">
            <b>Semana</b><br>
            <button class="btn-lista" onclick="selecionarTodasSemanas()">Selecionar todas</button>
            <button class="btn-lista" onclick="limparSemanas()">Limpar</button>
            <div id="listaSemanas" style="width:100%; max-height:250px; overflow:auto; border:1px solid #ccc; padding:10px; background:white; margin-top:5px; white-space:nowrap; box-sizing:border-box;"></div>
            <button onclick="abrirFaturados()"
                onmouseover="this.style.background='#c62828'"
                onmouseout="this.style.background='#e53935'"
                style="width:100%; margin-top:10px; background:#e53935; color:#fff; border:none; padding:10px 0; border-radius:6px; cursor:pointer; font-weight:600; transition:background 0.15s ease; box-sizing:border-box;">
                Ver Listas
            </button>
        </div>

        <div>
            <label style="display:block; margin-bottom:10px;">
                <input type="checkbox" onchange="toggleAgrupamentoSelecionados(this.checked)"> Agrupar selecionados em um &uacute;nico grupo
            </label>
            <b>Compradores</b><br>
            <button class="btn-lista" onclick="selecionarTodosCompradores()">Selecionar todos</button>
            <button class="btn-lista" onclick="limparCompradores()">Limpar</button>
            <div id="listaCompradores" style="width:320px; max-height:250px; overflow:auto; border:1px solid #ccc; padding:10px; background:white; margin-top:5px; white-space:nowrap;"></div>
        </div>

        <div style="margin-top:20px;">
            <b>Fornecedores</b><br>
            <button class="btn-lista" onclick="selecionarTodosFornecedores()">Selecionar todos</button>
            <button class="btn-lista" onclick="limparFornecedores()">Limpar</button>
            <div id="listaFornecedores" style="width:320px; max-height:250px; overflow:auto; border:1px solid #ccc; padding:10px; background:white; margin-top:5px; white-space:nowrap;"></div>
        </div>
    </div>

    <input type="file" id="arquivoSessao" style="display:none">
    <div id="resultado"></div>
    <script src="/janelas/js/ui-comum.js"></script>
    <script src="/janelas/js/faturamento-cargas.js"></script>
</body>

</html>
