<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel de Indicadores</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="/janelas/auth.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#e5e7eb;
    padding:20px;
}

.topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.titulo{
    font-size:28px;
    font-weight:700;
    color:#111827;
}

.cards{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:20px;
}

.card{
    background:white;
    border-radius:16px;
    padding:25px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.card-titulo{
    color:#6b7280;
    font-size:15px;
    margin-bottom:10px;
}

.card-valor{
    font-size:42px;
    font-weight:700;
    color:#111827;
}

.grafico{
    background:white;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.grafico h3{
    margin-bottom:20px;
    color:#111827;
}

canvas{
    max-height:400px;
}

</style>
</head>

<body>

<div class="topo">

    <div class="titulo">
        Indicadores Operacionais
    </div>

</div>

<div class="cards">

    <div class="card">

        <div class="card-titulo">
            Total de Suínos (Última Semana)
        </div>

        <div
            id="totalSuinos"
            class="card-valor"
        >
            0
        </div>

    </div>

    <div class="card">

        <div class="card-titulo">
            Total de Cargas (Última Semana)
        </div>

        <div
            id="totalCargas"
            class="card-valor"
        >
            0
        </div>

    </div>

</div>

<div class="grafico">

    <h3>
        Quantidade de Suínos por Semana
    </h3>

    <canvas id="graficoSuinos"></canvas>

</div>

<div class="grafico">

    <h3>
        Quantidade de Cargas por Semana
    </h3>

    <canvas id="graficoCargas"></canvas>

</div>

<script>




async function carregarGraficos(){

    try{

        const API =
           "https://api-production-6670.up.railway.app";

           console.log(
            `${API}/paineis-cargas`
          );

       const resposta =
            await fetch(
                `${API}/paineis-cargas`,
                {
                  headers:{
                    Authorization:
                      `Bearer ${token}`
                 }
             }
        );

        console.log(
    "STATUS:",
    resposta.status
);
        
        if(
         resposta.status === 401 ||
         resposta.status === 403
     ){
         logoutSessaoExpirada();
         return;
     }

        const dados =
            await resposta.json();

        if(!dados.length){
            return;
        }

        dados.sort(
            (a,b)=>
            a.semana.localeCompare(
                b.semana
            )
        );

        const ultimaSemana =
            dados[dados.length-1];

        document.getElementById(
            "totalSuinos"
        ).innerText =
            Number(
                ultimaSemana.total_suinos
            ).toLocaleString("pt-BR");

        document.getElementById(
            "totalCargas"
        ).innerText =
            Number(
                ultimaSemana.total_cargas
            ).toLocaleString("pt-BR");

        new Chart(

            document.getElementById(
                "graficoSuinos"
            ),

            {

                type:"bar",

                data:{

                    labels:
                        dados.map(
                            x=>x.semana
                        ),

                    datasets:[{

                        label:"Suínos",

                        data:
                            dados.map(
                                x=>x.total_suinos
                            ),

                        backgroundColor:
                            "#2563eb"

                    }]
                }

            }

        );

        new Chart(

            document.getElementById(
                "graficoCargas"
            ),

            {

                type:"line",

                data:{

                    labels:
                        dados.map(
                            x=>x.semana
                        ),

                    datasets:[{

                        label:"Cargas",

                        data:
                            dados.map(
                                x=>x.total_cargas
                            ),

                        borderColor:
                            "#dc2626",

                        backgroundColor:
                            "#dc2626",

                        tension:0.3

                    }]
                }

            }

        );

    }catch(erro){

        console.error(erro);

    }

}

carregarGraficos();

</script>

</body>
</html>
