<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel de Indicadores</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<script src="/janelas/auth.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#e5e7eb;
    padding:20px;
}

.topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.titulo{
    font-size:28px;
    font-weight:700;
    color:#111827;
}

.cards{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);
    gap:20px;
}

.card{
    background:white;
    border-radius:16px;
    padding:25px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.card-titulo{
    color:#6b7280;
    font-size:15px;
    margin-bottom:10px;
}

.card-valor{
    font-size:42px;
    font-weight:700;
    color:#111827;
}

.graficos{
    display:grid;
    gap:20px;
    margin-top:20px;
}

.graficos:first-of-type{
    grid-template-columns:1fr 1fr;
}

.graficos:last-of-type{
    grid-template-columns:1fr 1fr 1fr;
}

.grafico{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.grafico h3{
    margin-bottom:20px;
    color:#111827;
}

canvas{
    max-height:400px;
}

</style>
</head>

<body>

<div class="topo">

    <div class="titulo">
        Indicadores Operacionais
    </div>

</div>

<div class="cards">

    <div class="card">
        <div id="tituloSuinosAtual" class="card-titulo"></div>
        <div id="totalSuinosAtual" class="card-valor">0</div>
    </div>

    <div class="card">
        <div id="tituloCargasAtual" class="card-titulo"></div>
        <div id="totalCargasAtual" class="card-valor">0</div>
    </div>

    <div class="card">
        <div id="tituloSuinosProxima" class="card-titulo"></div>
        <div id="totalSuinosProxima" class="card-valor">0</div>
    </div>

    <div class="card">
        <div id="tituloCargasProxima" class="card-titulo"></div>
        <div id="totalCargasProxima" class="card-valor">0</div>
    </div>
</div>
</div>

<div class="graficos">

    <div class="grafico">
        <h3>Suínos por Semana</h3>
        <canvas id="graficoSuinos"></canvas>
    </div>

    <div class="grafico">
        <h3>Cargas por Semana</h3>
        <canvas id="graficoCargas"></canvas>
    </div>

</div>

<div class="graficos">

    <div class="grafico">
        <h3>Suínos por Comprador</h3>
        <canvas id="graficoComprador"></canvas>
    </div>

    <div class="grafico">
        <h3>Suínos por Fornecedor</h3>
        <canvas id="graficoFornecedor"></canvas>
    </div>

    <div class="grafico">
        <h3>Negociações</h3>
        <canvas id="graficoNegociacoes"></canvas>
    </div>

</div>

<script>




async function carregarGraficos(){

    try{

        const API =
           "https://api-production-6670.up.railway.app";

           console.log(
            `${API}/paineis-cargas`
          );

       const resposta =
            await fetch(
                `${API}/paineis-cargas`,
                {
                  headers:{
                    Authorization:
                      `Bearer ${token}`
                 }
             }
        );

        console.log(
    "STATUS:",
    resposta.status
);
        
        if(
         resposta.status === 401 ||
         resposta.status === 403
         ){
         logoutSessaoExpirada();
         return;
        }

        const resultado = await resposta.json();

        const dados = resultado.semanas;

        if(!dados || !dados.length){
             return;
        }

        dados.sort(
            (a,b)=>
            a.semana.localeCompare(
                b.semana
            )
        );

        const semanaAtual =
          dados[dados.length-2];

        const proximaSemana =
          dados[dados.length-1];

        document.getElementById("tituloSuinosAtual").innerText =
         `Suínos (${semanaAtual.semana})`;

document.getElementById("tituloCargasAtual").innerText =
    `Cargas (${semanaAtual.semana})`;

document.getElementById("tituloSuinosProxima").innerText =
    `Suínos (${proximaSemana.semana})`;

document.getElementById("tituloCargasProxima").innerText =
    `Cargas (${proximaSemana.semana})`;

document.getElementById("totalSuinosAtual").innerText =
    Number(semanaAtual.total_suinos)
        .toLocaleString("pt-BR");

document.getElementById("totalCargasAtual").innerText =
    Number(semanaAtual.total_cargas)
        .toLocaleString("pt-BR");

document.getElementById("totalSuinosProxima").innerText =
    Number(proximaSemana.total_suinos)
        .toLocaleString("pt-BR");

document.getElementById("totalCargasProxima").innerText =
    Number(proximaSemana.total_cargas)
        .toLocaleString("pt-BR");
       new Chart(

    document.getElementById(
        "graficoSuinos"
    ),

    {

        type:"bar",

        data:{

            labels:
                dados.map(
                    x=>x.semana
                ),

            datasets:[{

                label:"Suínos",

                data:
                    dados.map(
                        x=>x.total_suinos
                    ),

                backgroundColor:"#2563eb"

            }]
        },

        plugins:{
            legend:{
                display:false
            }
        }

    }

);

     new Chart(

    document.getElementById(
        "graficoCargas"
    ),

    {

        type:"line",

        data:{

            labels:
                dados.map(
                    x=>x.semana
                ),

            datasets:[{

                label:"Cargas",

                data:
                    dados.map(
                        x=>x.total_cargas
                    ),

                borderColor:"#dc2626",

                backgroundColor:"#dc2626",

                tension:0.3

            }]
        },

        plugins:[ChartDataLabels],

        options:{
            plugins:{
                datalabels:{
                    anchor:"end",
                    align:"top",
                    font:{
                        weight:"bold"
                    }
                }
            }
        }

    }

);

const compradores =
    resultado.compradores;

new Chart(
    document.getElementById(
        "graficoComprador"
    ),
    {
        type:"bar",
        data:{
            labels:
                compradores.map(
                    x => x.comprador
                ),
            datasets:[{
                label:"Suínos",
                data:
                    compradores.map(
                        x => x.total_suinos
                    )
            }]
        },
        plugins:[ChartDataLabels],
        options:{
            indexAxis:"y",
            plugins:{
                datalabels:{
                    anchor:"end",
                    align:"right"
                }
            }
        }
    }
);

const fornecedores =
    resultado.fornecedores;

new Chart(
    document.getElementById(
        "graficoFornecedor"
    ),
    {
        type:"bar",
        data:{
            labels:
                fornecedores.map(
                    x => x.fornecedor
                ),
            datasets:[{
                label:"Suínos",
                data:
                    fornecedores.map(
                        x => x.total_suinos
                    )
            }]
        },
        plugins:[ChartDataLabels],
        options:{
            indexAxis:"y",
            plugins:{
                datalabels:{
                    anchor:"end",
                    align:"right"
                }
            }
        }
    }
);

const negociacoes =
    resultado.negociacoes;

new Chart(
    document.getElementById(
        "graficoNegociacoes"
    ),
    {
        type:"bar",
        data:{
            labels:
                negociacoes.map(
                    x =>
                    `${x.comprador} → ${x.fornecedor}`
                ),

            datasets:[{
                label:"Suínos",
                data:
                    negociacoes.map(
                        x => x.total_suinos
                    )
            }]
        },
        plugins:[ChartDataLabels],
        options:{
            indexAxis:"y",
            plugins:{
                datalabels:{
                    anchor:"end",
                    align:"right"
                }
            }
        }
    }
);

    }catch(erro){

        console.error(erro);

    }

}

carregarGraficos();

</script>

</body>
</html>
