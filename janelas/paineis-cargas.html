<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel de Indicadores</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script src="/janelas/auth.js"></script>
<script src="/janelas/logout.js"></script>

<link rel="stylesheet" href="/janelas/css/base.css">
<link rel="stylesheet" href="/janelas/css/tema-escuro.css">
<link rel="stylesheet" href="/janelas/css/topbar-paineis.css">
<link rel="stylesheet" href="/janelas/css/paineis-cargas.css">
</head>

<body class="tema-escuro">

<div class="topbar-dashboard">

    <div class="topbar-left">

        <button class="btn-voltar" onclick="voltarInicio()">
            ⬅ Voltar ao início
        </button>

        <button class="btnAtualizarPipefy" onclick="atualizarCargasPipefy()">
            Atualizar Pipefy
        </button>

        <div id="status" class="topbar-status"></div>

        <div id="ultimaAtualizacao" class="topbar-ultima-atualizacao"></div>

    </div>

    <div class="topbar-right">

        <a href="/janelas/dashboard.html">
            Por Responsáveis
        </a>

        <a href="/janelas/paineis-cargas.html" class="ativo">
            Por Cargas
        </a>

        <a href="/janelas/paineis-cargas-2.html">
            Por Parceiros
        </a>

        <a href="/janelas/sankey.html">
            Fluxo (Sankey)
        </a>

        <a href="/janelas/paineis-condenacoes.html">
            Condenações
        </a>
    </div>

</div>

<div class="topo">

    <div class="titulo">
        Indicadores Operacionais
    </div>

</div>

<div class="cards">

    <div class="card">
        <div id="tituloSuinosAtual" class="card-titulo"></div>
        <div id="totalSuinosAtual" class="card-valor">0</div>
    </div>

    <div class="card">
        <div id="tituloCargasAtual" class="card-titulo"></div>
        <div id="totalCargasAtual" class="card-valor">0</div>
    </div>

    <div class="card">
        <div id="tituloSuinosProxima" class="card-titulo"></div>
        <div id="totalSuinosProxima" class="card-valor">0</div>
    </div>

    <div class="card">
        <div id="tituloCargasProxima" class="card-titulo"></div>
        <div id="totalCargasProxima" class="card-valor">0</div>
    </div>
</div>

<div class="graficos linha1">

    <div class="grafico">
        <h3>Suínos por Semana</h3>
        <canvas id="graficoSuinos"></canvas>
    </div>

    <div class="grafico">
        <h3>Cargas por Semana</h3>
        <canvas id="graficoCargas"></canvas>
    </div>

</div>

<div class="graficos linha2">

    <div class="grafico grafico-lista">
        <h3>ABC Compradores</h3>

        <div style="display:flex; gap:6px; margin-bottom:8px;">
            <button onclick="selecionarTodas('filtroSemanasComprador')">
                Todas
            </button>

            <button onclick="limparFiltro('filtroSemanasComprador')">
               Limpar
            </button>
        </div>

        <div id="filtroSemanasComprador" class="filtro-semanas"></div>

        <div id="listaComprador"
        style="
        flex:1;
        overflow:hidden;
        min-height:0;
         ">
        </div>
    </div>

    <div class="grafico grafico-lista">
        <h3>ABC Fornecedores</h3>

         <div style="display:flex; gap:6px; margin-bottom:8px;">
            <button onclick="selecionarTodas('filtroSemanasFornecedor')">
               Todas
            </button>

            <button onclick="limparFiltro('filtroSemanasFornecedor')">
               Limpar
           </button>
         </div>

        <div id="filtroSemanasFornecedor" class="filtro-semanas"></div>

        <div id="listaFornecedor"
        style="
        flex:1;
        overflow:hidden;
        min-height:0;
        ">
       </div>
    </div>

    <div class="grafico grafico-lista">
        <h3>ABC Negociações</h3>

        <div style="display:flex; gap:6px; margin-bottom:8px;">
             <button onclick="selecionarTodas('filtroSemanasNegociacoes')">
                 Todas
             </button>

             <button onclick="limparFiltro('filtroSemanasNegociacoes')">
               Limpar
             </button>
        </div>

        <div id="filtroSemanasNegociacoes" class="filtro-semanas"></div>

        <div id="listaNegociacoes"
         style="
        flex:1;
        overflow:hidden;
        min-height:0;
        ">
        </div>

           
     </div> <!-- fecha linha2 -->

     </div>

<div class="grafico-area-container">

    <div class="grafico grafico-area">

        <h3>
            Evolução Semanal de Suínos
        </h3>

        <canvas id="graficoAreaSuinos"></canvas>

    </div>

</div>   

<script src="/janelas/js/ui-comum.js"></script>
<script src="/janelas/js/paineis-cargas.js"></script>

</body>
</html>
