<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel de Indicadores</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<script src="/janelas/auth.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

.topo,
.cards,
.graficos{
    padding-left:20px;
    padding-right:20px;
}


.topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.titulo{
    font-size:28px;
    font-weight:700;
    color:#f9fafb;
}

.cards{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);
    gap:20px;
}

.card{
    background:#1f2937;
    border-radius:16px;
    padding:25px;
    box-shadow:0 4px 12px rgba(0,0,0,.30);
}

.card-titulo{
    color:#9ca3af;
    font-size:15px;
    margin-bottom:10px;
}

.card-valor{
    font-size:42px;
    font-weight:700;
    color:#f9fafb;
}

.graficos{
    display:grid;
    gap:20px;
    margin-top:20px;
}

/* 2 gráficos */
.linha1{
    grid-template-columns:repeat(2, minmax(0, 1fr));
    width:100%;
    max-width:100%;
}

/* 3 gráficos */
.linha2{
    display:grid;
    grid-template-columns:repeat(3, minmax(0, 1fr));
    gap:20px;
    margin-top:20px;
    width:100%;
    max-width:100%;
}

.grafico{
    background:#1f2937;
    border-radius:16px;
    padding:22px 22px 28px 22px;
    box-shadow:0 4px 12px rgba(0,0,0,.30);
    min-width:0;
    height:360px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.grafico h3{
    margin-bottom:10px;
    font-size:16px;
    color:#f9fafb;
}

/* MUITO IMPORTANTE: não forçar tamanho */
canvas{
    flex:1;
    width:100% !important;
    height:auto !important;
    max-width:100%;
}

.lista-item{
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    border-bottom:1px solid #374151;
    font-size:13px;
    color:#f9fafb;
}

.lista-header{
    display:flex;
    justify-content:space-between;
    font-weight:700;
    font-size:14px;
    padding-bottom:8px;
    border-bottom:2px solid #4b5563;
    margin-bottom:8px;
    color:#ffffff;
}

.lista-container{
    overflow-y:auto;
    height:280px;
}

body{
    background:#111827;
    margin:0;
    color:#f9fafb;
}

.topbar-dashboard{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 20px;
    background:#0f172a;
    border-bottom:1px solid #374151;
    position:sticky;
    top:0;
    z-index:1000;
}

.topbar-left{
    font-size:18px;
    font-weight:700;
    color:#f9fafb;
}

.topbar-right a{
    padding:8px 12px;
    border-radius:8px;
    transition:0.2s;
}

.topbar-right a:hover{
    background:#1f2937;
}

.topbar-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.container,
.cards,
.graficos{
    padding-left:20px;
    padding-right:20px;
}

.lista-container{
    overflow-y:auto;
    height:280px;
    padding-right:8px;
}

/* Chrome */
.lista-container::-webkit-scrollbar{
    width:8px;
}

.lista-container::-webkit-scrollbar-track{
    background:#111827;
}

.lista-container::-webkit-scrollbar-thumb{
    background:#4b5563;
    border-radius:10px;
}

.lista-container::-webkit-scrollbar-thumb:hover{
    background:#6b7280;
}

.filtro-semanas{
    max-height:120px;
    overflow-y:auto;
    margin-bottom:12px;
    padding:10px;
    background:#111827;
    border:1px solid #374151;
    border-radius:10px;
    display:flex;
    flex-direction:column;
    gap:6px;
}

.filtro-semanas label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:#f9fafb;
    cursor:pointer;
}

.filtro-semanas input{
    cursor:pointer;
}


</style>
</head>

<body>

<div class="topbar-dashboard">

    <div class="topbar-left"></div>

    <div class="topbar-right" style="display:flex; gap:10px; align-items:center;">

         <a href="/janelas/dashboard.html"
           style="color:#e5e7eb; text-decoration:none; font-weight:700;">
            Por Responsáveis
        </a>

         <a href="/janelas/paineis-cargas-2.html"
           style="color:#e5e7eb; text-decoration:none; font-weight:700;">
            Por Parceiros
        </a>
    </div>

</div>

<div class="topo">

    <div class="titulo">
        Indicadores Operacionais
    </div>

</div>

<div class="cards">

    <div class="card">
        <div id="tituloSuinosAtual" class="card-titulo"></div>
        <div id="totalSuinosAtual" class="card-valor">0</div>
    </div>

    <div class="card">
        <div id="tituloCargasAtual" class="card-titulo"></div>
        <div id="totalCargasAtual" class="card-valor">0</div>
    </div>

    <div class="card">
        <div id="tituloSuinosProxima" class="card-titulo"></div>
        <div id="totalSuinosProxima" class="card-valor">0</div>
    </div>

    <div class="card">
        <div id="tituloCargasProxima" class="card-titulo"></div>
        <div id="totalCargasProxima" class="card-valor">0</div>
    </div>
</div>
</div>

<div class="graficos linha1">

    <div class="grafico">
        <h3>Suínos por Semana</h3>
        <canvas id="graficoSuinos"></canvas>
    </div>

    <div class="grafico">
        <h3>Cargas por Semana</h3>
        <canvas id="graficoCargas"></canvas>
    </div>

</div>

<div class="graficos linha2">

    <div class="grafico">
        <h3>Top 20 Compradores</h3>

        <div id="filtroSemanasComprador" class="filtro-semanas"></div>

        <div id="listaComprador"></div>
    </div>

    <div class="grafico">
        <h3>Top 20 Fornecedores</h3>

        <div id="filtroSemanasFornecedor" class="filtro-semanas"></div>

        <div id="listaFornecedor"></div>
    </div>

    <div class="grafico">
        <h3>Top 20 Negociações</h3>

        <div id="filtroSemanasNegociacoes" class="filtro-semanas"></div>

        <div id="listaNegociacoes"></div>
    </div>

</div>

<script>


let compradores = [];
let fornecedores = [];
let negociacoes = [];

async function carregarGraficos(){

    try{

        const API =
           "https://api-production-6670.up.railway.app";

           console.log(
            `${API}/paineis-cargas`
          );

       const resposta =
            await fetch(
                `${API}/paineis-cargas`,
                {
                  headers:{
                    Authorization:
                      `Bearer ${token}`
                 }
             }
        );

        console.log(
    "STATUS:",
    resposta.status
);
        
        if(
         resposta.status === 401 ||
         resposta.status === 403
         ){
         logoutSessaoExpirada();
         return;
        }

        const resultado = await resposta.json();

        console.log(resultado.compradores[0]);
        console.log(resultado.fornecedores[0]);
        console.log(resultado.negociacoes[0]);

        const semanasDisponiveis = [
         ...new Set(
        (resultado.semanas || [])
            .map(x => x.semana)
            )
        ].sort();

        const filtrar = (item) => {
        const texto = JSON.stringify(item).toLowerCase();

         return !texto.includes("lakre") &&
             !texto.includes("09-cancelada");
        };

        const dados = (resultado.semanas || []).filter(filtrar);

        if(!dados || !dados.length){
             return;
        }

        dados.sort(
            (a,b)=>
            a.semana.localeCompare(
                b.semana
            )
        );

        const semanaAtual =
          dados[dados.length-2];

        const proximaSemana =
          dados[dados.length-1];

        document.getElementById("tituloSuinosAtual").innerText =
         `Suínos (${semanaAtual.semana})`;

        document.getElementById("tituloCargasAtual").innerText =
         `Cargas (${semanaAtual.semana})`;

        document.getElementById("tituloSuinosProxima").innerText =
         `Suínos (${proximaSemana.semana})`;

        document.getElementById("tituloCargasProxima").innerText =
         `Cargas (${proximaSemana.semana})`;

        document.getElementById("totalSuinosAtual").innerText =
          Number(semanaAtual.total_suinos)
               .toLocaleString("pt-BR");

        document.getElementById("totalCargasAtual").innerText =
          Number(semanaAtual.total_cargas)
                .toLocaleString("pt-BR");

        document.getElementById("totalSuinosProxima").innerText =
          Number(proximaSemana.total_suinos)
                .toLocaleString("pt-BR");

        document.getElementById("totalCargasProxima").innerText =
          Number(proximaSemana.total_cargas)
                .toLocaleString("pt-BR");


      new Chart(
    document.getElementById("graficoSuinos"),
    {
        type:"bar",
        data:{
            labels: dados.map(x=>x.semana),
            datasets:[{
                label:"Suínos",
                data: dados.map(x=>x.total_suinos),
                backgroundColor:"#2563eb"
            }]
        },
        plugins:[ChartDataLabels],
        options:{

            layout:{
              padding:{
              top:30,
              right:20,
              bottom:20,
              left:20
             }
           },
            responsive:true,
            maintainAspectRatio:false,
            plugins:{
                legend:{ display:false },
                datalabels:{
                 color:"#f9fafb",
                 anchor:"end",
                 align:"top",
                 offset:8,

               font:{
                  size:14,
                  weight:"bold"
               },

    textStrokeColor:"#111827",
    textStrokeWidth:3
}
            }
        }
    }
);

    new Chart(
    document.getElementById("graficoCargas"),
    {
        type:"line",
        data:{
            labels: dados.map(x=>x.semana),
            datasets:[{
                label:"Cargas",
                data: dados.map(x=>x.total_cargas),
                borderColor:"#dc2626",
                backgroundColor:"#dc2626",
                tension:0.3,
                fill:false
            }]
        },
        plugins:[ChartDataLabels],
        options:{

            layout:{
               padding:{
               top:30,
               right:20,
               bottom:20,
               left:20
               }
            },
            responsive:true,
            maintainAspectRatio:false,
             plugins:{
                datalabels:{
                color:"#f9fafb",
                anchor:"end",
                align:"top",
                offset:8,

             font:{
                size:14,
                weight:"bold"
             },

               textStrokeColor:"#111827",
               textStrokeWidth:3
            }
            }
        }
    }
);

compradores = (resultado.compradores || []).filter(filtrar);

fornecedores = (resultado.fornecedores || []).filter(filtrar);

negociacoes = (resultado.negociacoes || []).filter(filtrar);


criarFiltroSemanas(
    "filtroSemanasComprador",
    semanasDisponiveis,
    atualizarListas
);

criarFiltroSemanas(
    "filtroSemanasFornecedor",
    semanasDisponiveis,
    atualizarListas
);

criarFiltroSemanas(
    "filtroSemanasNegociacoes",
    semanasDisponiveis,
    atualizarListas
);

atualizarListas();



    }catch(erro){

        console.error(erro);

    }

}

function criarFiltroSemanas(id, semanas, callback){

    const container = document.getElementById(id);

    container.innerHTML = semanas.map(semana => `
        <label>
            <input type="checkbox"
                   value="${semana}"
                   checked>
            ${semana}
        </label>
    `).join("");

    container.querySelectorAll("input").forEach(cb => {
        cb.addEventListener("change", callback);
    });
}

function semanasSelecionadas(id){

    return Array.from(
        document.querySelectorAll(
            `#${id} input:checked`
        )
    ).map(x => x.value);

}

function atualizarListas(){

    // Compradores
    const semanasComprador =
        semanasSelecionadas("filtroSemanasComprador");

    const compradoresFiltrados = compradores;

    const topCompradores =
        compradoresFiltrados
        .sort((a,b) => b.total_suinos - a.total_suinos)
        .slice(0,20);

    document.getElementById("listaComprador").innerHTML = `
        <div class="lista-container">

            <div class="lista-header">
                <span>Comprador</span>
                <span>Suínos | Cargas</span>
            </div>

            ${topCompradores.map(x => `
                <div class="lista-item">
                    <strong>${x.comprador}</strong>
                    <span>${x.total_suinos} | ${x.total_cargas}</span>
                </div>
            `).join("")}

        </div>
    `;


    // Fornecedores
    const semanasFornecedor =
        semanasSelecionadas("filtroSemanasFornecedor");

    const fornecedoresFiltrados = fornecedores;

    const topFornecedores =
        fornecedoresFiltrados
        .sort((a,b) => b.total_suinos - a.total_suinos)
        .slice(0,20);

    document.getElementById("listaFornecedor").innerHTML = `
        <div class="lista-container">

            <div class="lista-header">
                <span>Fornecedor</span>
                <span>Suínos | Cargas</span>
            </div>

            ${topFornecedores.map(x => `
                <div class="lista-item">
                    <strong>${x.fornecedor}</strong>
                    <span>${x.total_suinos} | ${x.total_cargas}</span>
                </div>
            `).join("")}

        </div>
    `;


    // Negociações
    const semanasNegociacoes =
        semanasSelecionadas("filtroSemanasNegociacoes");

    const negociacoesFiltradas = negociacoes;

    const topNegociacoes =
        negociacoesFiltradas
        .sort((a,b) => b.total_suinos - a.total_suinos)
        .slice(0,20);

    document.getElementById("listaNegociacoes").innerHTML = `
        <div class="lista-container">

            <div class="lista-header">
                <span>Comprador → Fornecedor</span>
                <span>Suínos | Cargas</span>
            </div>

            ${topNegociacoes.map(x => `
                <div class="lista-item">
                    <strong>${x.comprador} → ${x.fornecedor}</strong>
                    <span>${x.total_suinos} | ${x.total_cargas}</span>
                </div>
            `).join("")}

        </div>
    `;
}


carregarGraficos();

</script>

</body>
</html>
