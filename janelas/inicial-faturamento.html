<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<title>Faturamento</title>

<script src="/janelas/logout.js"></script>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI", Arial, Helvetica, sans-serif;
}

body{

    background:linear-gradient(160deg,#eef2f7 0%,#e3e9f5 100%);

    color:#1e293b;

    padding:14px 18px;

    height:100vh;

    overflow:hidden;
}



/* CONTAINER */

.container{

    max-width:1400px;

    margin:0 auto;

    height:100%;

    display:flex;

    flex-direction:column;
}



/* CABEÇALHO */

.cabecalho{

    display:flex;

    align-items:center;

    gap:14px;

    margin-bottom:12px;

    padding-bottom:10px;

    border-bottom:1px solid #cbd5e1;

    flex-shrink:0;
}

.cabecalho-icone{

    width:42px;

    height:42px;

    flex-shrink:0;

    border-radius:10px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:22px;

    background:linear-gradient(135deg,#3b82f6,#2563eb);

    box-shadow:0 4px 12px rgba(37,99,235,0.30);
}

h1{

    color:#0f172a;

    font-size:22px;

    font-weight:700;
}

.subtitulo{

    margin-top:2px;

    color:#64748b;

    font-size:13px;
}


.secaoTitulo{

    display:flex;

    align-items:center;

    gap:8px;

    font-size:11px;

    font-weight:700;

    text-transform:uppercase;

    letter-spacing:0.5px;

    color:#94a3b8;

    margin-bottom:8px;

    flex-shrink:0;
}

.secaoTitulo::before{

    content:"";

    width:4px;

    height:15px;

    border-radius:3px;

    background:linear-gradient(#3b82f6,#2563eb);
}



/* BOTAO BASE */

button{

    border:none;

    border-radius:10px;

    cursor:pointer;

    font-size:14px;

    font-weight:600;

    transition:0.15s;
}

button:hover{

    transform:translateY(-1px);

    filter:brightness(1.05);
}

button:active{

    transform:translateY(0);
}



/* CORES BOTÕES */

.btnAtualizar{

    background:#ea580c;

    color:white;

    box-shadow:0 4px 12px rgba(234,88,12,0.30);
}

.btnPipefy{

    background:#2563eb;

    color:white;

    box-shadow:0 4px 12px rgba(37,99,235,0.30);
}



/* SEÇÃO DE IMPORTAÇÕES */

.secaoImportacoes{

    display:flex;

    flex-direction:column;

    gap:8px;

    margin-bottom:10px;

    flex:1;

    min-height:0;
}


.blocoImportacao{

    padding:10px 14px;

    border:1px solid #e5e7eb;

    border-left:3px solid #3b82f6;

    border-radius:10px;

    background:rgba(255,255,255,0.75);

    transition:0.15s;
}

.blocoImportacao:hover{

    border-color:#cbd5e1;

    border-left-color:#2563eb;

    box-shadow:0 2px 8px rgba(15,23,42,0.05);
}

.blocoImportacao h3{

    margin-bottom:8px;

    color:#0f172a;

    font-size:13px;

    font-weight:600;
}


/* LINHA DE CONTROLES (alinhada em grade) */

.blocoControles{

    display:grid;

    grid-template-columns:1fr 150px 150px 260px;

    align-items:center;

    gap:8px;
}


/* CONTROLES COM ALTURA PADRÃO */

.blocoControles input[type=file],
.blocoControles button{

    height:36px;

    border-radius:8px;

    font-size:12px;
}

.blocoControles input[type=file]{

    padding:6px 10px;

    background:white;

    border:1px solid #d1d5db;

    cursor:pointer;
}

.blocoControles button{

    width:100%;

    padding:0 16px;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    text-align:center;
}


/* INFO DE ÚLTIMA ATUALIZAÇÃO (badge alinhado à direita) */

.ultimaInfo{

    justify-self:stretch;

    text-align:center;

    font-size:11px;

    font-weight:600;

    color:#475569;

    background:#eef2f7;

    border:1px solid #e2e8f0;

    border-radius:6px;

    padding:6px 10px;

    width:100%;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    line-height:1.3;
}


@media (max-width: 860px){

    .blocoControles{

        grid-template-columns:1fr;
    }

    .ultimaInfo{

        justify-self:stretch;

        text-align:left;
    }
}



/* GRID MENU */

.gridMenu{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-bottom:8px;

    flex-shrink:0;
}

@media (max-width:720px){

    .gridMenu{
        grid-template-columns:1fr;
    }
}



/* CARDS */

.cardMenu{

    position:relative;

    overflow:hidden;

    padding:14px 18px;

    border-radius:12px;

    color:white;

    cursor:pointer;

    transition:0.2s;

    min-height:0;

    display:flex;

    flex-direction:row;

    align-items:center;

    gap:14px;

    box-shadow:0 4px 12px rgba(15,23,42,0.10);
}

.cardMenu:hover{

    transform:translateY(-2px);

    box-shadow:0 10px 24px rgba(15,23,42,0.18);
}

.cardIcone{

    width:40px;

    height:40px;

    flex-shrink:0;

    border-radius:10px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:20px;

    margin-bottom:0;

    background:rgba(255,255,255,0.20);
}

.cardMenu h2{

    margin:0;

    font-size:16px;

    font-weight:700;

    flex:1;
}

.cardSeta{

    position:static;

    font-size:18px;

    opacity:0.6;

    flex-shrink:0;
}

.cardMenu:hover .cardSeta{

    opacity:1;

    transform:translateX(3px);
}


/* CORES CARDS */

.cargas{

    background:linear-gradient(135deg,#3b82f6,#2563eb);
}

.fretes{

    background:linear-gradient(135deg,#8b5cf6,#7c3aed);
}

.financeiro{

    background:linear-gradient(135deg,#10b981,#059669);
}



/* STATUS */

#status{

    margin-top:auto;

    padding:8px 12px;

    background:rgba(255,255,255,0.75);

    border:1px solid #e2e8f0;

    border-radius:8px;

    color:#475569;

    font-size:12px;

    flex-shrink:0;
}

.avisoSessoes{

    margin-bottom:8px;

    display:flex;

    flex-direction:column;

    gap:6px;

    flex-shrink:0;
}

.avisoSessao{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:12px;

    padding:8px 12px;

    background:#eff6ff;

    border:1px solid #bfdbfe;

    border-radius:8px;

    font-size:12px;

    color:#1e40af;
}

.avisoSessao button{

    background:#2563eb;

    color:white;

    border:none;

    padding:10px 18px;

    border-radius:8px;

    font-size:13px;

    font-weight:600;

    cursor:pointer;

    white-space:nowrap;
}

</style>

</head>

<body>

<div class="container">

    <div class="cabecalho">

        <div class="cabecalho-icone">📊</div>

        <div>

            <h1>Faturamento</h1>

            <div class="subtitulo">
                Importações e módulos do sistema
            </div>

        </div>

    </div>



    <div id="avisoSessoes" class="avisoSessoes"></div>



    <!-- IMPORTAÇÕES -->

    <div class="secaoTitulo">Importações</div>

<div class="secaoImportacoes">

    <div class="blocoImportacao">

        <h3>Importação de Cargas</h3>

        <div class="blocoControles">

            <input
                type="file"
                id="arquivoCargas"
                accept=".xlsx,.xls"
            >

            <button
                id="btnImportarCargas"
                class="btnAtualizar"
                onclick="importarCargas()"
            >
                Importar Cargas
            </button>

            <button
                class="btnPipefy"
                onclick="atualizarCargasPipefy()"
            >
                Atualizar via Pipefy
            </button>

            <span id="ultimaCargas" class="ultimaInfo"></span>

        </div>

    </div>

    <div class="blocoImportacao">

        <h3>Importação de Parceiros</h3>

        <div class="blocoControles">

            <input
                type="file"
                id="arquivoParceiros"
                accept=".xlsx,.xls"
            >

            <button
                class="btnAtualizar"
                onclick="importarParceiros()"
            >
                Importar Parceiros
            </button>

            <button
                class="btnPipefy"
                onclick="importarParceirosPipefy()"
            >
                Atualizar via Pipefy
            </button>

            <span id="ultimaParceiros" class="ultimaInfo"></span>

        </div>

    </div>

    <div class="blocoImportacao">

        <h3>Importação de Contratação de Fretes</h3>

        <div class="blocoControles">

            <input
                type="file"
                id="arquivoFretes"
                accept=".xlsx,.xls"
            >

            <button
                id="btnImportarFretesPlanilha"
                class="btnAtualizar"
                onclick="importarFretes()"
            >
                Importar Fretes
            </button>

            <button
                 id="btnImportarFretes"
                 class="btnPipefy"
                 onclick="importarFretesPipefy()"
             >
                Atualizar via Pipefy
            </button>

            <span id="ultimaFretes" class="ultimaInfo"></span>

        </div>

    </div>

</div>



    <!-- MENU -->

    <div class="secaoTitulo">Módulos</div>

    <div class="gridMenu">



        <div
            class="cardMenu cargas"
            onclick="abrirCargas()"
        >

            <div class="cardIcone">🚚</div>

            <h2>Faturamento de Cargas</h2>

            <span class="cardSeta">→</span>

        </div>




        <div
            class="cardMenu fretes"
            onclick="abrirFretes()"
        >

            <div class="cardIcone">🛻</div>

            <h2>Faturamento de Fretes</h2>

            <span class="cardSeta">→</span>

        </div>

    </div>



    <!-- STATUS -->

    <div id="status">

        Sistema aguardando atualização.

    </div>

</div>



<script>

    function salvarDestinoEIrLogin() {

        localStorage.setItem(
            "paginaDestino",
            window.location.pathname + window.location.search
        );

        localStorage.removeItem("token");

        window.location.href = "/login";

    }

    async function validarLogin() {

    const token =
        localStorage.getItem("token");

    if (!token) {

        salvarDestinoEIrLogin();

        return;
    }

    try {

        const resposta =
            await fetch(
                "/validar-token",
                {
                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );

        if (!resposta.ok) {

            salvarDestinoEIrLogin();
        }

    } catch {

        salvarDestinoEIrLogin();
    }

}

validarLogin();


async function carregarSessoesAtivas() {

    try {

        const token =
            localStorage.getItem("token")

        if (!token) return

        const resp = await fetch(
            "/faturamento-sessao",
            {
                headers: {
                    Authorization:
                        `Bearer ${token}`
                }
            }
        )

        if (!resp.ok) return

        const data = await resp.json()

        const container =
            document.getElementById(
                "avisoSessoes"
            )

        if (!container) return

        container.innerHTML = ""

        const mapa = {
            FATURAMENTO_CARGAS: {
                titulo: "Faturamento de Cargas",
                url: "/janelas/faturamento-cargas.html"
            },
            FATURAMENTO_FRETES: {
                titulo: "Faturamento de Fretes",
                url: "/janelas/fatura-fretes.html"
            }
        }

        ;(data.sessoes || []).forEach(sessao => {

            const info = mapa[sessao.processo]

            if (!info) return

            const dataFmt = sessao.atualizado_em
                ? new Date(sessao.atualizado_em)
                    .toLocaleString("pt-BR")
                : ""

            container.innerHTML += `
                <div class="avisoSessao">
                    <span>
                        <strong>${info.titulo}</strong>
                        em andamento por
                        <strong>${sessao.iniciado_por}</strong>
                        ${dataFmt ? ` — salvo ${dataFmt}` : ""}
                    </span>
                    <button onclick="window.location.href='${info.url}'">
                        Retomar
                    </button>
                </div>
            `

        })

    } catch (err) {

        console.error(err)

    }

}

carregarSessoesAtivas();


/* =========================================
   ÚLTIMA ATUALIZAÇÃO (TEMPO REAL)
========================================= */

const socket = io(
    "https://api-production-6670.up.railway.app"
);

function mostrarUltima(elementoId, valor){

    const campo =
        document.getElementById(elementoId);

    if(!campo){
        return;
    }

    campo.innerHTML = valor
        ? `🕒 Última atualização: ${valor}`
        : "🕒 Ainda não atualizado";

}

function aplicarUltima(chave, elementoId, valor){

    if(valor){
        localStorage.setItem(chave, valor);
    }

    mostrarUltima(
        elementoId,
        valor || localStorage.getItem(chave)
    );

}

// CARGAS (mesmo evento dos painéis)
socket.on("ultimaAtualizacaoPipefy", (data) => {
    aplicarUltima(
        "ultimaAtualizacaoPipefy",
        "ultimaCargas",
        data.data
    );
});

// PARCEIROS
socket.on("ultimaAtualizacaoParceiros", (data) => {
    aplicarUltima(
        "ultimaAtualizacaoParceiros",
        "ultimaParceiros",
        data.data
    );
});

// FRETES
socket.on("ultimaAtualizacaoFretes", (data) => {
    aplicarUltima(
        "ultimaAtualizacaoFretes",
        "ultimaFretes",
        data.data
    );
});

// EXIBE O QUE JÁ ESTIVER SALVO LOCALMENTE
mostrarUltima(
    "ultimaCargas",
    localStorage.getItem("ultimaAtualizacaoPipefy")
);

mostrarUltima(
    "ultimaParceiros",
    localStorage.getItem("ultimaAtualizacaoParceiros")
);

mostrarUltima(
    "ultimaFretes",
    localStorage.getItem("ultimaAtualizacaoFretes")
);


async function atualizarCargasPipefy(){

    const status =
        document.getElementById("status");

    status.innerHTML =
        "Gerando relatório no Pipefy...";

    try{

        const resposta =
            await fetch(
                "/importar-cargas-relatorio",
                {
                    method:"POST",

                    headers:{
                        Authorization:
                            `Bearer ${
                                localStorage.getItem(
                                    "token"
                                )
                            }`
                    }
                }
            );

        const dados =
            await resposta.json();

  
            console.log(
            "RETORNO IMPORTACAO:",
             dados
        );

        if(dados.sucesso){

            status.innerHTML =
                `✅ ${dados.importados} cargas importadas`;

        }else{

            status.innerHTML =
                `❌ ${dados.erro}`;
        }

    }catch(err){

        console.error(err);

        status.innerHTML =
            "❌ Erro ao atualizar cargas.";
    }
}


function abrirCargas(){

    window.location.href =
        "/janelas/faturamento-cargas.html"

}



function abrirFretes(){

    window.location.href =
        "/janelas/fatura-fretes.html"

}

async function importarCargas(){

    const status =
        document.getElementById("status");

    const botao =
    document.getElementById(
        "btnImportarCargas"
    );

    const arquivo =
        document.getElementById(
            "arquivoCargas"
        ).files[0];

    if(!arquivo){

        alert(
            "Selecione uma planilha."
        );

        return;
    }

    try{

        status.innerHTML =
            "Enviando arquivo...";

        const formData =
            new FormData();

        formData.append(
            "arquivo",
            arquivo
        );

     const resposta =
        await fetch(
    "/importar-cargas",
    {

        method:"POST",

        headers:{

            Authorization:
                `Bearer ${
                    localStorage.getItem(
                        "token"
                    )
                }`

        },

        body:formData

    }
);

      if(!resposta.ok){

      throw new Error(
        "Erro na resposta do servidor"
    );
}
            

        const dados =
            await resposta.json();

        if(dados.sucesso){
             status.innerHTML =
        `
       ✅ Importação concluída com sucesso.

         <br><br>

        <b>${dados.importados}</b>
        registros importados.
        `;

        }else{

            status.innerHTML =
                "Erro na importação.";

        }

    }catch(err){

        console.log(dados);

        console.error(err);


        status.innerHTML =
            "Erro ao importar planilha.";

    }finally{

   botao.disabled = false;
   botao.innerHTML =
       "Importar Cargas";



    }
}




async function importarFretes(){

    const status =
        document.getElementById("status");

    const botao =
        document.getElementById(
            "btnImportarFretesPlanilha"
        );

    const arquivo =
        document.getElementById(
            "arquivoFretes"
        ).files[0];

    if(!arquivo){

        alert(
            "Selecione uma planilha."
        );

        return;
    }

    try{

        botao.disabled = true;

        status.innerHTML =
            "Enviando arquivo...";

        const formData =
            new FormData();

        formData.append(
            "arquivo",
            arquivo
        );

        const resposta =
            await fetch(
                "/importar-fretes",
                {

                    method:"POST",

                    headers:{

                        Authorization:
                            `Bearer ${
                                localStorage.getItem(
                                    "token"
                                )
                            }`

                    },

                    body:formData

                }
            );

        if(!resposta.ok){

            throw new Error(
                "Erro na resposta do servidor"
            );

        }

        const dados =
            await resposta.json();

        if(dados.sucesso){

            status.innerHTML =
        `
       ✅ Importação concluída com sucesso.

         <br><br>

        <b>${dados.importados}</b>
        registros importados.
        `;

        }else{

            status.innerHTML =
                "Erro na importação.";

        }

    }catch(err){

        console.error(err);

        status.innerHTML =
            "Erro ao importar planilha.";

    }finally{

        botao.disabled = false;
        botao.innerHTML =
            "Importar Fretes";

    }
}




async function importarParceiros(){

    const arquivo =
        document.getElementById(
            "arquivoParceiros"
        ).files[0];

    if(!arquivo){

        alert(
            "Selecione a planilha de parceiros."
        );

        return;
    }

    const formData =
        new FormData();

    formData.append(
        "arquivo",
        arquivo
    );
    
    const resposta =
           await fetch(
        "/importar-parceiros-excel",
        {
            method:"POST",

            headers:{
                Authorization:
                    `Bearer ${
                        localStorage.getItem(
                            "token"
                        )
                    }`
            },

            body:formData
        }
    );

    const dados =
        await resposta.json();

    document.getElementById("status")
        .innerHTML =
        `✅ ${dados.importados} parceiros importados`;
}

async function importarParceirosPipefy(){

    const status =
        document.getElementById("status");

    status.innerHTML =
        "Atualizando parceiros via Pipefy...";

    try{

        const resposta =
            await fetch(
                "/importar-parceiros",
                {
                    headers:{
                        Authorization:
                            `Bearer ${
                                localStorage.getItem(
                                    "token"
                                )
                            }`
                    }
                }
            );

        if(!resposta.ok){

            status.innerHTML =
                `❌ Erro ${resposta.status} ao importar parceiros.`;

            return;
        }

        const dados =
            await resposta.json();

        if(dados.success){

            status.innerHTML =
                `✅ ${dados.total} parceiros importados`;

        }else{

            status.innerHTML =
                `❌ ${dados.error || "Erro ao importar parceiros."}`;
        }

    }catch(err){

        console.error(err);

        status.innerHTML =
            "❌ Erro ao importar parceiros.";
    }
}


async function importarFretesPipefy(){

    const status =
        document.getElementById("status");

    status.innerHTML =
        "Atualizando contratação de fretes via Pipefy...";

    try{

        const resposta =
            await fetch(
                "/importar-fretes-relatorio",
                {
                    method: "POST",

                    headers:{
                        Authorization:
                            `Bearer ${
                                localStorage.getItem(
                                    "token"
                                )
                            }`
                    }
                }
            );

        const dados =
            await resposta.json();

        if(dados.sucesso){

            status.innerHTML =
                `✅ ${dados.importados} fretes importados`;

        }else{

            status.innerHTML =
                `❌ ${dados.erro}`;
        }

    }catch(err){

        console.error(err);

        status.innerHTML =
            "❌ Erro ao importar fretes.";

    }

}



</script>
