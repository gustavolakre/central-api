<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<title>Faturamento</title>

<link rel="stylesheet" href="/janelas/css/base.css">
<link rel="stylesheet" href="/janelas/css/topbar-paineis.css">
<link rel="stylesheet" href="/janelas/css/inicial-faturamento.css">

</head>

<body class="tema-inicial-faturamento">

<div class="topbar-dashboard">

    <div class="topbar-left">

        <button class="btn-voltar" onclick="voltarInicio()">
            ⬅ Voltar ao início
        </button>

        <span>Faturamento</span>

    </div>

    <div class="topbar-right"></div>

</div>

<div class="container">

    <div id="avisoSessoes" class="avisoSessoes"></div>



    <!-- IMPORTAÇÕES -->

    <div class="secaoTitulo">Importações</div>

<div class="secaoImportacoes">

    <div class="blocoImportacao">

        <h3>Importação de Cargas</h3>

        <div class="blocoControles">

            <input
                type="file"
                id="arquivoCargas"
                accept=".xlsx,.xls"
            >

            <button
                id="btnImportarCargas"
                class="btnAtualizar"
                onclick="importarCargas()"
            >
                Importar por Planilha
            </button>

            <button
                class="btnPipefy"
                onclick="atualizarCargasPipefy({ recarregar: false })"
            >
                Atualização automática
            </button>

            <span id="ultimaCargas" class="ultimaInfo"></span>

        </div>

    </div>

    <div class="blocoImportacao">

        <h3>Importação de Parceiros</h3>

        <div class="blocoControles">

            <input
                type="file"
                id="arquivoParceiros"
                accept=".xlsx,.xls"
            >

            <button
                class="btnAtualizar"
                onclick="importarParceiros()"
            >
                Importar por Planilha
            </button>

            <button
                class="btnPipefy"
                onclick="importarParceirosPipefy()"
            >
                Atualização automática
            </button>

            <span id="ultimaParceiros" class="ultimaInfo"></span>

        </div>

    </div>

    <div class="blocoImportacao">

        <h3>Importação de Contratação de Fretes</h3>

        <div class="blocoControles">

            <input
                type="file"
                id="arquivoFretes"
                accept=".xlsx,.xls"
            >

            <button
                id="btnImportarFretesPlanilha"
                class="btnAtualizar"
                onclick="importarFretes()"
            >
                Importar por Planilha
            </button>

            <button
                 id="btnImportarFretes"
                 class="btnPipefy"
                 onclick="importarFretesPipefy()"
             >
                Atualização automática
            </button>

            <span id="ultimaFretes" class="ultimaInfo"></span>

        </div>

    </div>

</div>



    <!-- MENU -->

    <div class="secaoTitulo">Módulos</div>

    <div class="gridMenu">



        <div
            class="cardMenu cargas"
            onclick="abrirCargas()"
        >

            <div class="cardIcone">🚚</div>

            <h2>Faturamento de Cargas</h2>

            <span class="cardSeta">→</span>

        </div>




        <div
            class="cardMenu fretes"
            onclick="abrirFretes()"
        >

            <div class="cardIcone">🛻</div>

            <h2>Faturamento de Fretes</h2>

            <span class="cardSeta">→</span>

        </div>

    </div>



    <!-- STATUS -->

    <div id="status">

        Sistema aguardando atualização.

    </div>

</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="/janelas/logout.js"></script>
<script src="/janelas/js/ui-comum.js"></script>
<script src="/janelas/js/inicial-faturamento.js"></script>

</body>

</html>
