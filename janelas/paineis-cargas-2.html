<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Filtrado - Suínos</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<style>

body{
    background:#111827;
    margin:0;
    overflow-x:hidden;
}

.linha{
    display:grid;
    grid-template-columns:1fr;
    gap:25px;
    margin-bottom:30px;
}

.box{
    background:#1f2937;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.30);

    display:flex;
    flex-direction:column;

    min-height:auto;
}

h2{
    color:#f9fafb;
    margin:20px;
    font-size:28px;
}

h3{
    margin-top:0;
    margin-bottom:8px;
    font-size:16px;
    color:#f9fafb;
}

canvas{
    width:100% !important;
    height:700px !important;
}

/* ==========================
   TOPBAR
========================== */

.topbar-dashboard{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 20px;
    background:#0f172a;
    border-bottom:1px solid #374151;
    position:sticky;
    top:0;
    z-index:1000;
}

.topbar-left{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:18px;
    font-weight:700;
    color:#f9fafb;
}

.topbar-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.topbar-right a{
    color:#e5e7eb;
    text-decoration:none;
    font-weight:700;
    padding:8px 12px;
    border-radius:8px;
    transition:.2s;
}

.topbar-right a:hover{
    background:#1f2937;
}

/* ==========================
   FILTROS PADRÃO
========================== */

.filtros-topo{

    display:grid;

    grid-template-columns:
        2fr
        2fr
        1fr
        1fr;

    gap:15px;

    margin-bottom:20px;

    align-items:start;

}

.filtro-box{
    width:auto;
}

.filtro-titulo{
    font-size:13px;
    font-weight:700;
    margin-bottom:6px;
    color:#f9fafb;
}

.filtro-lista{
    display:flex;
    flex-direction:column;
}

.filtro-item{
    display:flex;
    align-items:center;
    gap:6px;
    width:100%;
    margin-bottom:3px;
}

.filtro-item label{
    font-size:12px;
    cursor:pointer;
    color:#e5e7eb;
}

.filtro-pesquisa{
    width:100%;
    box-sizing:border-box;
    padding:6px 8px;
    margin-bottom:6px;
    border:1px solid #374151;
    border-radius:6px;
    background:#1f2937;
    color:#f9fafb;
}

.filtro-pesquisa::placeholder{
    color:#9ca3af;
}

.lista-checkbox{
    height:200px;
    overflow-y:auto;
    overflow-x:hidden;
}

/* ==========================
   PRIMEIRO GRÁFICO
========================== */

.btn-limpar-filtro{
    width:100%;
    margin-bottom:6px;
    padding:6px 8px;

    border:none;
    border-radius:6px;

    background:#374151;
    color:#f9fafb;

    font-size:12px;
    font-weight:700;

    cursor:pointer;
}

.btn-limpar-filtro:hover{
    background:#4b5563;
}


.btnAtualizarPipefy{

    background:#ea580c;
    color:white;
    border:none;
    padding:10px 16px;
    border-radius:10px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    transition:0.2s;

}


.btnAtualizarPipefy:hover{

    transform:translateY(-2px);
    background:#fb923c;

}

.filtro-periodo{

    display:flex;
    align-items:center;
    gap:10px;

    margin:18px 0 25px;

    flex-wrap:wrap;

}

.titulo-periodo{

    color:#f9fafb;
    font-weight:bold;

}

.btnPeriodo{

    background:#374151;
    color:white;

    border:none;

    padding:8px 16px;

    border-radius:8px;

    cursor:pointer;

    transition:.2s;

}

.btnPeriodo:hover{

    background:#4b5563;

}

.btnPeriodo.ativo{

    background:#2563eb;

}


</style>
</head>

<body>


<div class="topbar-dashboard">

   <div class="topbar-left">

    <button class="btnAtualizarPipefy" onclick="atualizarCargasPipefy()">
        Atualizar Pipefy
    </button>

    <div id="status" style="margin-left:12px; color:#e5e7eb;"></div>

    <div id="ultimaAtualizacao" style="margin-left:20px; color:#9ca3af;">
    </div>

</div>

    <div class="topbar-right" style="display:flex; gap:10px; align-items:center;">

         <a href="/janelas/dashboard.html"
           style="color:#e5e7eb; text-decoration:none; font-weight:700;">
            Por Responsáveis
        </a>

         <a href="/janelas/paineis-cargas.html"
           style="color:#e5e7eb; text-decoration:none; font-weight:700;">
            Por Cargas
        </a>
    </div>

</div>

<h2>Painel por Parceiros - Filtros Avançados</h2>

<div class="linha">

<div class="box">

<div class="filtros-topo">

    <div class="filtro-box fornecedor">
        <div class="filtro-titulo">Fornecedor</div>
        <div id="filtroFornecedor"></div>
    </div>

    <div class="filtro-box comprador">
        <div class="filtro-titulo">Comprador</div>
        <div id="filtroComprador"></div>
    </div>

    <div class="filtro-box uf">
        <div class="filtro-titulo">UF</div>
        <div id="filtroUF"></div>
    </div>

    <div class="filtro-box tipo">
        <div class="filtro-titulo">Tipo Suíno</div>
        <div id="filtroTipo"></div>
    </div>

</div>

<div id="filtroPeriodo" class="filtro-periodo"></div>


<canvas id="graficoPrincipal"></canvas>

</div>

</div>

</div>

<script>

let dadosGlobais = [];

let chartPrincipal;

let periodoSelecionado = "52";

async function carregar(){

    const API =
        "https://api-production-6670.up.railway.app";

    const res =
        await fetch(`${API}/paineis-cargas-2`);

    console.log("STATUS:", res.status);

    dadosGlobais = await res.json();

    dadosGlobais = dadosGlobais.filter(
    item => item.fase !== "09-Cancelada"
    );

    console.log(dadosGlobais);

    criarFiltrosCheckbox();

    atualizarGraficos();
}



function filtrarUF(lista, estados){

    if(!estados.length)
        return lista;

    return lista.filter(item =>

        estados.includes(item.estado_fornecedor) ||

        estados.includes(item.estado_comprador)

    );

}


function criarFiltrosCheckbox(){

    criarFiltro(
        "filtroFornecedor",
        [...new Set(dadosGlobais.map(x=>x.fornecedor))].sort()
    );

    criarFiltro(
        "filtroComprador",
        [...new Set(dadosGlobais.map(x=>x.comprador))].sort()
    );

    const estados = [
        ...new Set(
            dadosGlobais.flatMap(x=>[
                x.estado_fornecedor,
                x.estado_comprador
            ])
        )
    ]
    .filter(Boolean)
    .sort();

    criarFiltro("filtroUF", estados);

    criarFiltro(
        "filtroTipo",
        [...new Set(dadosGlobais.map(x=>x.tipo_suino))].sort()
    );

    // ===== NOVO CÓDIGO =====

    const anos = [
        ...new Set(
            dadosGlobais.map(x => x.semana.substring(0,4))
        )
    ].sort().reverse();

    criarFiltroPeriodo(anos);

    // =======================

    document
        .querySelectorAll("input[type=checkbox]")
        .forEach(c=>{

            c.addEventListener(
                "change",
                atualizarGraficos
            );

        });

}


function criarFiltroPeriodo(anos){

    const div = document.getElementById("filtroPeriodo");

    div.innerHTML = `
        <span class="titulo-periodo">Período:</span>

        <button class="btnPeriodo ativo" data-periodo="52">
            Últimas 52 semanas
        </button>

        ${anos.map(ano => `
            <button class="btnPeriodo" data-periodo="${ano}">
                ${ano}
            </button>
        `).join("")}
    `;

    document.querySelectorAll(".btnPeriodo").forEach(btn => {

        btn.onclick = () => {

            document
                .querySelectorAll(".btnPeriodo")
                .forEach(b => b.classList.remove("ativo"));

            btn.classList.add("ativo");

            periodoSelecionado = btn.dataset.periodo;

            atualizarGraficos();

        };

    });

}


function criarFiltro(id, valores){

    const el = document.getElementById(id);

    const itens = valores
        .filter(Boolean)
        .sort()
        .map(v => `
            <div class="filtro-item">

                <input
                    type="checkbox"
                    value="${v}"
                >

                <label>${v}</label>

            </div>
        `)
        .join("");

    el.innerHTML = `

          <button
              class="btn-limpar-filtro"
              onclick="limparFiltro('${id}')">
              Limpar Seleção
          </button>
        <input
            type="text"
            class="filtro-pesquisa"
            placeholder="Pesquisar..."
            oninput="filtrarListaCheckbox('${id}', this.value)"
        >

        <div class="lista-checkbox">
            ${itens}
        </div>
    `;
}

function filtrarListaCheckbox(id, texto){

    const busca = texto.toLowerCase();

    document
        .querySelectorAll(`#${id} .filtro-item`)
        .forEach(item => {

            const nome = item
                .querySelector("label")
                .textContent
                .toLowerCase();

            item.style.display =
                nome.includes(busca)
                    ? "flex"
                    : "none";

        });
}

function valoresMarcados(id){

    return [
        ...document.querySelectorAll(
            `#${id} input:checked`
        )
    ].map(x=>x.value);
}

function filtrar(lista,campo,valores){

    if(!valores.length)
        return lista;

    return lista.filter(x=>
        valores.includes(
            x[campo]
        )
    );
}


function limparFiltro(id){

    document
        .querySelectorAll(
            `#${id} input[type=checkbox]`
        )
        .forEach(cb=>{

            cb.checked = false;

        });

    atualizarGraficos();

}

function agruparPorSemana(lista){

    const mapa = {};

    lista.forEach(item=>{

        if(!mapa[item.semana]){

            mapa[item.semana] = 0;

        }

        mapa[item.semana] +=
            Number(item.quantidade || 0);

    });

    const semanas =
        Object.keys(mapa)
        .sort()
        .slice(-52);

    return {

        labels: semanas,

        valores: semanas.map(
            s=>mapa[s]
        )

    };
}

function destruir(chart){

    if(chart){

        chart.destroy();

    }
}

function criarGrafico(canvasId, labels, data, cor, tipo="bar"){

    return new Chart(
        document.getElementById(canvasId),
        {
            type: tipo,

            plugins:[ChartDataLabels],

            data:{
                labels,
                datasets:[{
                   label:"Suínos",
                   data,
                   backgroundColor:cor,
                   borderColor:cor,
                   borderWidth:2,
                   borderRadius:4,
                   barPercentage:0.8,
                   categoryPercentage:0.8
                }]
            },

            options:{
                responsive:true,
                maintainAspectRatio:false,

                layout:{
                  padding:{
                  top:10,
                  right:10,
                  left:5,
                  bottom:0
                  }
                },

                scales:{

                    x:{
                        ticks:{
                           color:"#d1d5db",
                            font:{
                                size:13,
                                weight:"600"
                            },

                            autoSkip: false, 
                            maxRotation:45,
                            minRotation:45
                        },

                        grid:{
                            display:false
                        }
                    },

                    y:{
                        beginAtZero:true,

                        ticks:{
                            color:"#f9fafb",
                            font:{
                                size:13,
                                weight:"600"
                            },

                            callback:(value)=>
                                Number(value)
                                    .toLocaleString("pt-BR")
                        },

                        grid: {
                            color: "rgba(255,255,255,0.05)"
                        }
                    }

                },

                plugins:{

                    legend:{
                        display:false
                    },

                    datalabels: {
                       color: "#f9fafb",
                       anchor: "end",
                       align: "top",
                       offset: 4,

                       font: {
                           size: 13,
                           weight: "700"
                       },

                       formatter: (value) =>
                         Number(value).toLocaleString("pt-BR")
                         }

                }

            }

        }
    );

}

function atualizarGraficos(){

    let dados=[...dadosGlobais];

    dados = filtrar(
        dados,
        "fornecedor",
        valoresMarcados("filtroFornecedor")
    );

    dados = filtrar(
        dados,
        "comprador",
        valoresMarcados("filtroComprador")
    );

    dados = filtrarUF(
        dados,
        valoresMarcados("filtroUF")
    );

    dados = filtrar(
        dados,
        "tipo_suino",
        valoresMarcados("filtroTipo")
    );


    if (periodoSelecionado === "52") {

    // 1. pegar semanas únicas já agregadas
    const semanasOrdenadas = [
        ...new Set(dados.map(x => x.semana))
    ].sort((a, b) => {
        const [anoA, semanaA] = a.split("/").map(Number);
        const [anoB, semanaB] = b.split("/").map(Number);

        if (anoA !== anoB) return anoA - anoB;
        return semanaA - semanaB;
    });

    // 2. pegar últimas 52 semanas
    const ultimas52 = semanasOrdenadas.slice(-52);

    // 3. filtrar dados apenas dessas semanas
    dados = dados.filter(item =>
        ultimas52.includes(item.semana)
    );
}
     else{

    dados = dados.filter(item=>

        item.semana.startsWith(periodoSelecionado)

    );

}

    const g = agruparPorSemana(dados);

    destruir(chartPrincipal);

    chartPrincipal = criarGrafico(
        "graficoPrincipal",
        g.labels,
        g.valores,
        "#2563eb"
    );

}

function mostrarUltimaAtualizacao(){

    const campo =
        document.getElementById("ultimaAtualizacao");


    if(!campo){
        return;
    }


    const ultima =
        localStorage.getItem(
            "ultimaAtualizacaoPipefy"
        );


    if(ultima){

        campo.innerHTML =
        `🕒 Última atualização: ${ultima}`;

    }else{

        campo.innerHTML =
        "🕒 Ainda não atualizado";

    }

}

async function atualizarCargasPipefy(){

    const status =
        document.getElementById("status");


    if(status){

        status.innerHTML =
        "Gerando relatório no Pipefy...";

    }


    try{


        const resposta =
            await fetch(
                "/importar-cargas-relatorio",
                {

                method:"POST",

                headers:{

                    Authorization:
                    `Bearer ${localStorage.getItem("token")}`

                }

            });



        const dados =
            await resposta.json();



        if(dados.sucesso){


            const agora =
                new Date();



            const dataHora =
                agora.toLocaleDateString("pt-BR")
                +
                " "
                +
                agora.toLocaleTimeString("pt-BR");



            localStorage.setItem(
                "ultimaAtualizacaoPipefy",
                dataHora
            );



            if(status){

                status.innerHTML =
                `✅ ${dados.importados} cargas importadas`;

            }


            mostrarUltimaAtualizacao();



            setTimeout(()=>{

                location.reload();

            },1500);



        }else{


            if(status){

                status.innerHTML =
                `❌ ${dados.erro}`;

            }

        }



    }catch(err){


        console.error(err);


        if(status){

            status.innerHTML =
            "❌ Erro ao atualizar cargas.";

        }

    }

}


mostrarUltimaAtualizacao();
carregar();

</script>

</body>
</html>
