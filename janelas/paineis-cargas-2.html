<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Filtrado - Suínos</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-sankey@0.12.0"></script>

<script>
    const {
  SankeyController,
  SankeyElement,
  SankeyDataController
} = window['chartjs-chart-sankey'];

Chart.register(
  SankeyController,
  SankeyElement,
  SankeyDataController
);



</script>

<style>

body{
    background:#111827;
    margin:0;
    overflow-x:hidden;
}

.linha{
    display:grid;
    grid-template-columns:1fr;
    gap:25px;
    margin-bottom:30px;
}

.box{
    background:#1f2937;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.30);

    display:flex;
    flex-direction:column;

    min-height:auto;
}

h2{
    color:#f9fafb;
    margin:20px;
    font-size:28px;
}

h3{
    margin-top:0;
    margin-bottom:8px;
    font-size:16px;
    color:#f9fafb;
}

canvas{
    width:100% !important;
    height:700px !important;
    font-family: Arial, sans-serif !important;
}

/* ==========================
   TOPBAR
========================== */

.topbar-dashboard{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 20px;
    background:#0f172a;
    border-bottom:1px solid #374151;
    position:sticky;
    top:0;
    z-index:1000;
}

.topbar-left{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:18px;
    font-weight:700;
    color:#f9fafb;
}

.topbar-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.topbar-right a{
    color:#e5e7eb;
    text-decoration:none;
    font-weight:700;
    padding:8px 12px;
    border-radius:8px;
    transition:.2s;
}

.topbar-right a:hover{
    background:#1f2937;
}

/* ==========================
   FILTROS PADRÃO
========================== */

.filtros-topo{
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    gap:15px;
    margin-bottom:20px;
    align-items:start;
}

@media (max-width: 1400px){
    .filtros-topo{
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 800px){
    .filtros-topo{
        grid-template-columns: repeat(2, 1fr);
    }
}

.filtro-box{
    width:auto;
}

.filtro-titulo{
    font-size:13px;
    font-weight:700;
    margin-bottom:6px;
    color:#f9fafb;
}

.filtro-lista{
    display:flex;
    flex-direction:column;
}

.filtro-item{
    display:flex;
    align-items:center;
    gap:6px;
    width:100%;
    margin-bottom:3px;
}

.filtro-item label{
    font-size:12px;
    cursor:pointer;
    color:#e5e7eb;
}

.filtro-pesquisa{
    width:100%;
    box-sizing:border-box;
    padding:6px 8px;
    margin-bottom:6px;
    border:1px solid #374151;
    border-radius:6px;
    background:#1f2937;
    color:#f9fafb;
}

.filtro-pesquisa::placeholder{
    color:#9ca3af;
}

.lista-checkbox{
    height:200px;
    overflow-y:auto;
    overflow-x:hidden;
}

/* ==========================
   PRIMEIRO GRÁFICO
========================== */

.btn-limpar-filtro{
    width:100%;
    margin-bottom:6px;
    padding:6px 8px;

    border:none;
    border-radius:6px;

    background:#374151;
    color:#f9fafb;

    font-size:12px;
    font-weight:700;

    cursor:pointer;
}

.btn-limpar-filtro:hover{
    background:#4b5563;
}


.btnAtualizarPipefy{

    background:#ea580c;
    color:white;
    border:none;
    padding:10px 16px;
    border-radius:10px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    transition:0.2s;

}


.btnAtualizarPipefy:hover{

    transform:translateY(-2px);
    background:#fb923c;

}

.filtro-periodo{

    display:flex;
    align-items:center;
    gap:10px;

    margin:18px 0 25px;

    flex-wrap:wrap;

}

.titulo-periodo{

    color:#f9fafb;
    font-weight:bold;

}

.btnPeriodo{

    background:#374151;
    color:white;

    border:none;

    padding:8px 16px;

    border-radius:8px;

    cursor:pointer;

    transition:.2s;

}

.btnPeriodo:hover{

    background:#4b5563;

}

.btnPeriodo.ativo{

    background:#2563eb;

}

#graficoSankey {
    height: 650px !important;
    margin-top: 20px;
    background: #0b1220;
    border-radius: 12px;
}


</style>
</head>

<body>


<div class="topbar-dashboard">

   <div class="topbar-left">

    <button class="btnAtualizarPipefy" onclick="atualizarCargasPipefy()">
        Atualizar Pipefy
    </button>

    <div id="status" style="margin-left:12px; color:#e5e7eb;"></div>

    <div id="ultimaAtualizacao" style="margin-left:20px; color:#9ca3af;">
    </div>

</div>

    <div class="topbar-right" style="display:flex; gap:10px; align-items:center;">

         <a href="/janelas/dashboard.html"
           style="color:#e5e7eb; text-decoration:none; font-weight:700;">
            Por Responsáveis
        </a>

         <a href="/janelas/paineis-cargas.html"
           style="color:#e5e7eb; text-decoration:none; font-weight:700;">
            Por Cargas
        </a>
    </div>

</div>

<h2>Painel por Parceiros - Filtros Avançados</h2>

<div class="linha">

<div class="box">

<div class="filtros-topo">

    <div class="filtro-box fornecedor">
        <div class="filtro-titulo">Fornecedor</div>
        <div id="filtroFornecedor"></div>
    </div>

    <div class="filtro-box comprador">
        <div class="filtro-titulo">Comprador</div>
        <div id="filtroComprador"></div>
    </div>

    <div class="filtro-box uf-fornecedor">
       <div class="filtro-titulo">UF Fornecedor</div>
       <div id="filtroUFFornecedor"></div>
    </div>

    <div class="filtro-box uf-comprador">
       <div class="filtro-titulo">UF Comprador</div>
       <div id="filtroUFComprador"></div>
    </div>

    <div class="filtro-box tipo">
        <div class="filtro-titulo">Tipo Suíno</div>
        <div id="filtroTipo"></div>
    </div>

    <div class="filtro-box frete">
       <div class="filtro-titulo">Frete</div>
    <div id="filtroFrete"></div>
</div>

</div>

<div id="filtroPeriodo" class="filtro-periodo"></div>


<canvas id="graficoPrincipal"></canvas>


<canvas id="graficoSankey"></canvas>

</div>

<script>



let dadosGlobais = [];

let chartPrincipal;

let periodoSelecionado = "52";

let chartSankey;



async function carregar(){

    const API =
        "https://api-production-6670.up.railway.app";

    const res =
        await fetch(`${API}/paineis-cargas-2`);

    console.log("STATUS:", res.status);

    dadosGlobais = await res.json();

    dadosGlobais = dadosGlobais.filter(
        item => item.fase !== "09-Cancelada"
    );

    console.log(dadosGlobais);

    criarFiltrosCheckbox();

    atualizarGraficos(); 
}



function filtrarUF(lista, ufsFornecedor, ufsComprador) {

    if (!ufsFornecedor.length && !ufsComprador.length)
        return lista;

    return lista.filter(item => {

        const okFornecedor =
            !ufsFornecedor.length ||
            ufsFornecedor.includes(item.estado_fornecedor);

        const okComprador =
            !ufsComprador.length ||
            ufsComprador.includes(item.estado_comprador);

        return okFornecedor && okComprador;
    });
}


function criarFiltrosCheckbox(){

    criarFiltro(
        "filtroFornecedor",
        [...new Set(dadosGlobais.map(x=>x.fornecedor))].sort()
    );

    criarFiltro(
        "filtroComprador",
        [...new Set(dadosGlobais.map(x=>x.comprador))].sort()
    );

    criarFiltro(
        "filtroFrete",
         [...new Set(dadosGlobais.map(x => x.frete))]
        .filter(Boolean)
        .sort()
    );

    const estados = [
        ...new Set(
            dadosGlobais.flatMap(x=>[
                x.estado_fornecedor,
                x.estado_comprador
            ])
        )
    ]
    .filter(Boolean)
    .sort();

    const ufsFornecedor = [
    ...new Set(dadosGlobais.map(x => x.estado_fornecedor))
    ]
    .filter(Boolean)
    .sort();

    const ufsComprador = [
    ...new Set(dadosGlobais.map(x => x.estado_comprador))
    ]
    .filter(Boolean)
    .sort();

    criarFiltro("filtroUFFornecedor", ufsFornecedor);
    criarFiltro("filtroUFComprador", ufsComprador);

    criarFiltro(
        "filtroTipo",
        [...new Set(dadosGlobais.map(x=>x.tipo_suino))].sort()
    );

    // ===== NOVO CÓDIGO =====

    const anos = [
        ...new Set(
            dadosGlobais.map(x => x.semana.substring(0,4))
        )
    ].sort().reverse();

    criarFiltroPeriodo(anos);

    // =======================

    document
        .querySelectorAll("input[type=checkbox]")
        .forEach(c=>{

            c.addEventListener(
                "change",
                atualizarGraficos
            );

        });

}


function criarFiltroPeriodo(anos){

    const div = document.getElementById("filtroPeriodo");

    div.innerHTML = `
      <span class="titulo-periodo">Período:</span>

    <button class="btnPeriodo ativo" data-periodo="52">
       Últimas 52 semanas
    </button>

    <button class="btnPeriodo" data-periodo="all">
       Todo período
    </button>

    ${anos.map(ano => `
       <button class="btnPeriodo" data-periodo="${ano}">
        ${ano}
       </button>
    `).join("")}
      `;

    document.querySelectorAll(".btnPeriodo").forEach(btn => {

        btn.onclick = () => {

            document
                .querySelectorAll(".btnPeriodo")
                .forEach(b => b.classList.remove("ativo"));

            btn.classList.add("ativo");

            periodoSelecionado = btn.dataset.periodo;

            atualizarGraficos();

        };

    });

}


function criarFiltro(id, valores){

    const el = document.getElementById(id);

    const itens = valores
        .filter(Boolean)
        .sort()
        .map(v => `
            <div class="filtro-item">

                <input
                    type="checkbox"
                    value="${v}"
                >

                <label>${v}</label>

            </div>
        `)
        .join("");

    el.innerHTML = `

          <button
              class="btn-limpar-filtro"
              onclick="limparFiltro('${id}')">
              Limpar Seleção
          </button>
        <input
            type="text"
            class="filtro-pesquisa"
            placeholder="Pesquisar..."
            oninput="filtrarListaCheckbox('${id}', this.value)"
        >

        <div class="lista-checkbox">
            ${itens}
        </div>
    `;
}

function filtrarListaCheckbox(id, texto){

    const busca = texto.toLowerCase();

    document
        .querySelectorAll(`#${id} .filtro-item`)
        .forEach(item => {

            const nome = item
                .querySelector("label")
                .textContent
                .toLowerCase();

            item.style.display =
                nome.includes(busca)
                    ? "flex"
                    : "none";

        });
}

function valoresMarcados(id){

    return [
        ...document.querySelectorAll(
            `#${id} input:checked`
        )
    ].map(x=>x.value);
}

function filtrar(lista,campo,valores){

    if(!valores.length)
        return lista;

    return lista.filter(x=>
        valores.includes(
            x[campo]
        )
    );
}


function limparFiltro(id){

    document
        .querySelectorAll(
            `#${id} input[type=checkbox]`
        )
        .forEach(cb=>{

            cb.checked = false;

        });

    atualizarGraficos();

}

function agruparPorSemana(lista, limite52 = true) {

    const mapa = {};

    lista.forEach(item => {

        if (!mapa[item.semana]) {
            mapa[item.semana] = 0;
        }

        mapa[item.semana] += Number(item.quantidade || 0);

    });

    let semanas = Object.keys(mapa).sort((a, b) => {
        const [anoA, semanaA] = a.split("/").map(Number);
        const [anoB, semanaB] = b.split("/").map(Number);

        if (anoA !== anoB) return anoA - anoB;
        return semanaA - semanaB;
    });

    // 🔥 só corta se NÃO for "all"
    if (limite52) {
        semanas = semanas.slice(-52);
    }

    return {
        labels: semanas,
        valores: semanas.map(s => mapa[s])
    };
}

function destruir(chart){

    if(chart){

        chart.destroy();

    }
}

function criarGrafico(canvasId, labels, data, cor = "#f97316", tipo = "bar") {

    return new Chart(
        document.getElementById(canvasId),
        {
            type: tipo,

            plugins: [ChartDataLabels],

            data: {
                labels,
                datasets: [{
                    label: "Suínos",
                    data,

                    backgroundColor: tipo === "line"
                        ? "rgba(249, 115, 22, 0.25)"
                        : cor,

                    borderColor: cor,
                    borderWidth: 2,
                    borderRadius: 4,

                    barPercentage: 0.75,
                    categoryPercentage: 0.8,

                    fill: tipo === "line",
                    tension: 0.3
                }]
            },

            options: {
                responsive: true,
                maintainAspectRatio: false,

                layout: {
                    padding: {
                        top: 30,
                        right: 10,
                        left: 10,
                        bottom: 10
                    }
                },

                scales: {
                    x: {
                        ticks: {
                            color: "#e5e7eb",
                            font: {
                                size: 14,
                                weight: "800",
                                family: "Calibri"
                            },
                            autoSkip: false,
                            maxRotation: 60,
                            minRotation: 60
                        },
                        grid: {
                            display: false
                        }
                    },

                    y: {
                        beginAtZero: true,
                        ticks: {
                            color: "#e5e7eb",
                            font: {
                                size: 14,
                                weight: "800",
                                family: "Calibri"
                            },
                            callback: (value) =>
                                Number(value).toLocaleString("pt-BR")
                        },
                        grid: {
                            color: "rgba(255,255,255,0.08)"
                        }
                    }
                },

                plugins: {
                    legend: {
                        display: false
                    },

                    datalabels: {
                        color: "#ffffff",
                        font: {
                            size: 14,
                            weight: "500",
                            family: "Arial"
                        },

                        anchor: "end",
                        align: "top",
                        offset: 2,

                        clip: true,   // 🔥 evita bagunça fora do gráfico

                        formatter: (value) =>
                            Number(value).toLocaleString("pt-BR")
                    }
                }
            }
        }
    );
}



function atualizarGraficos(){

    let dados = [...dadosGlobais];

    // FILTROS
    dados = filtrar(dados, "fornecedor", valoresMarcados("filtroFornecedor"));
    dados = filtrar(dados, "comprador", valoresMarcados("filtroComprador"));

    dados = filtrarUF(
        dados,
        valoresMarcados("filtroUFFornecedor"),
        valoresMarcados("filtroUFComprador")
    );

    dados = filtrar(dados, "tipo_suino", valoresMarcados("filtroTipo"));
    dados = filtrar(dados, "frete", valoresMarcados("filtroFrete"));

    // PERÍODO
    const is52 = periodoSelecionado === "52";
    const isAll = periodoSelecionado === "all";

    if (is52) {

        const semanasOrdenadas = [...new Set(dados.map(x => x.semana))]
            .sort((a, b) => {
                const [anoA, semanaA] = a.split("/").map(Number);
                const [anoB, semanaB] = b.split("/").map(Number);
                return anoA !== anoB ? anoA - anoB : semanaA - semanaB;
            });

        const ultimas52 = semanasOrdenadas.slice(-52);

        dados = dados.filter(item =>
            ultimas52.includes(item.semana)
        );

    } else if (!isAll) {

        dados = dados.filter(item =>
            item.semana.startsWith(periodoSelecionado)
        );
    }

    // GRÁFICO PRINCIPAL
    const limite52 = periodoSelecionado === "52";
    const g = agruparPorSemana(dados, limite52);

    destruir(chartPrincipal);

    chartPrincipal = criarGrafico(
        "graficoPrincipal",
        g.labels,
        g.valores,
        "#f97316",
        periodoSelecionado === "all" ? "line" : "bar"
    );

    atualizarSankey(dados);

}




function mostrarUltimaAtualizacao(){

    const campo =
        document.getElementById("ultimaAtualizacao");


    if(!campo){
        return;
    }


    const ultima =
        localStorage.getItem(
            "ultimaAtualizacaoPipefy"
        );


    if(ultima){

        campo.innerHTML =
        `🕒 Última atualização: ${ultima}`;

    }else{

        campo.innerHTML =
        "🕒 Ainda não atualizado";

    }

}

async function atualizarCargasPipefy(){

    const status =
        document.getElementById("status");


    if(status){

        status.innerHTML =
        "Gerando relatório no Pipefy...";

    }


    try{


        const resposta =
            await fetch(
                "/importar-cargas-relatorio",
                {

                method:"POST",

                headers:{

                    Authorization:
                    `Bearer ${localStorage.getItem("token")}`

                }

            });



        const dados =
            await resposta.json();



        if(dados.sucesso){


            const agora =
                new Date();



            const dataHora =
                agora.toLocaleDateString("pt-BR")
                +
                " "
                +
                agora.toLocaleTimeString("pt-BR");



            localStorage.setItem(
                "ultimaAtualizacaoPipefy",
                dataHora
            );



            if(status){

                status.innerHTML =
                `✅ ${dados.importados} cargas importadas`;

            }


            mostrarUltimaAtualizacao();



            setTimeout(()=>{

                location.reload();

            },1500);



        }else{


            if(status){

                status.innerHTML =
                `❌ ${dados.erro}`;

            }

        }



    }catch(err){


        console.error(err);


        if(status){

            status.innerHTML =
            "❌ Erro ao atualizar cargas.";

        }

    }

}


function montarFluxoSankey(lista) {

    const mapa = {};

    lista.forEach(item => {

        const origem = item.estado_fornecedor;
        const destino = item.estado_comprador;

        if (!origem || !destino) return;

        const chave = `${origem}->${destino}`;

        mapa[chave] = (mapa[chave] || 0) + Number(item.quantidade || 0);

    });

    return Object.entries(mapa).map(([key, value]) => {

        const [from, to] = key.split("->");

        return {
            from,
            to,
            flow: value
        };

    });
}


function atualizarSankey(dados) {

    const data = montarFluxoSankey(dados);

    if (!data.length) return; // 👈 evita gráfico vazio

    if (chartSankey) chartSankey.destroy();

    chartSankey = new Chart(
        document.getElementById("graficoSankey"),
        {
            type: "sankey",
            data: {
                datasets: [{
                    data,
                    colorFrom: "#f97316",
                    colorTo: "#2563eb",
                    colorMode: "gradient",
                    borderWidth: 1,

                      nodeWidth: 30,
                      nodePadding: 25,

                    labels: {
                       font: {
                           size: 18,     
                           weight: "800"
                       },
                        color: "#ffffff"
                  }
            }]
            },
            options: {
               responsive: true,
               maintainAspectRatio: false,

              plugins: {
                  legend: { display: false },

                  tooltip: {
                     bodyFont: {
                       size: 16
                   },
                     titleFont: {
                     size: 16
                   }
            }
        },

    font: {
        family: "Arial",
        size: 16
    }
}
        }
    );
}


mostrarUltimaAtualizacao();
carregar();

</script>

</body>
</html>
