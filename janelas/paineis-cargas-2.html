<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Filtrado - Suínos</title>

<link rel="stylesheet" href="/janelas/css/base.css">
<link rel="stylesheet" href="/janelas/css/tema-escuro.css">
<link rel="stylesheet" href="/janelas/css/topbar-paineis.css">
<link rel="stylesheet" href="/janelas/css/paineis-cargas-2.css">

<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;700&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">

<script src="/janelas/logout.js"></script>
</head>

<body class="tema-escuro">


<div class="topbar-dashboard">

    <div class="topbar-left">

        <button class="btn-voltar" onclick="voltarInicio()">
            ⬅ Voltar ao início
        </button>

        <button class="btnAtualizarPipefy" onclick="atualizarCargasPipefy()">
            Atualizar Pipefy
        </button>

        <div id="status" class="topbar-status"></div>

        <div id="ultimaAtualizacao" class="topbar-ultima-atualizacao"></div>

    </div>

    <div class="topbar-right">

        <a href="/janelas/dashboard.html">
            Por Responsáveis
        </a>

        <a href="/janelas/paineis-cargas.html">
            Por Cargas
        </a>

        <a href="/janelas/paineis-cargas-2.html" class="ativo">
            Por Parceiros
        </a>

        <a href="/janelas/sankey.html">
            Fluxo (Sankey)
        </a>

        <a href="/janelas/paineis-condenacoes.html">
            Condenações
        </a>

    </div>

</div>

<h2>Painel por Parceiros - Filtros Avançados</h2>

<div class="linha">

<div class="box">

<div class="filtros-topo">

    <div class="filtro-box fornecedor">
        <div class="filtro-titulo">Fornecedor</div>
        <div id="filtroFornecedor"></div>
    </div>

    <div class="filtro-box comprador">
        <div class="filtro-titulo">Comprador</div>
        <div id="filtroComprador"></div>
    </div>

    <div class="filtro-box uf-fornecedor">
       <div class="filtro-titulo">UF Fornecedor</div>
       <div id="filtroUFFornecedor"></div>
    </div>

    <div class="filtro-box uf-comprador">
       <div class="filtro-titulo">UF Comprador</div>
       <div id="filtroUFComprador"></div>
    </div>

    <div class="filtro-box tipo">
        <div class="filtro-titulo">Tipo Suíno</div>
        <div id="filtroTipo"></div>
    </div>

    <div class="filtro-box frete">
   <div class="filtro-titulo">Frete</div>
   <div id="filtroFrete"></div>
</div>

<div class="filtro-box perfil-box">

    <div class="filtro-titulo">
        Perfis
    </div>

    <div id="listaPerfis" class="lista-perfis"></div>

    <div style="display:flex; gap:8px; margin-top:8px;">

        <button id="btnSalvarPerfil">
            💾 Salvar
        </button>

        <button id="btnExcluirPerfil">
            🗑 Excluir
        </button>

    </div>

</div>

</div>

<div id="filtroPeriodo" class="filtro-periodo"></div>

<div class="box">
   <div class="box box-grafico">

    <h3 class="titulo-grafico">
        Quantidade de Suínos por Semana
    </h3>

    <canvas id="graficoPrincipal"></canvas>

</div>

<div class="box box-grafico">

    <h3 class="titulo-grafico">
        Preço Médio por Semana
    </h3>

    <canvas id="graficoMediaPonderada"></canvas>

</div>

</div>



</div>


</div>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<script>
    Chart.register(ChartDataLabels);
</script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="/janelas/js/ui-comum.js"></script>
<script src="/janelas/js/paineis-cargas-2.js"></script>

</body>
</html>
