<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Filtrado - Suínos</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    
body{
    background:#e5e7eb;
    margin:0;
    overflow-x:hidden;
}

.linha{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:25px;
}

.box{
    background:#fff;
    padding:15px;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    display:flex;
    flex-direction:column;
}

h3{
    margin-bottom:10px;
    font-size:16px;
}

select{
    width:100%;
    padding:8px;
    margin-bottom:10px;
}

canvas{
    height:320px !important;
}

.topbar-dashboard{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 20px;
    background:#0f172a;
    border-bottom:1px solid #374151;
    position:sticky;
    top:0;
    z-index:1000;
}

.topbar-left{
    font-size:18px;
    font-weight:700;
    color:#f9fafb;
}

.topbar-right a{
    padding:8px 12px;
    border-radius:8px;
    transition:0.2s;
}

.topbar-right a:hover{
    background:#1f2937;
}

.topbar-left{
    display:flex;
    align-items:center;
    gap:12px;
}

</style>
</head>

<body>

<div class="topbar-dashboard">

    <div class="topbar-left">

        <button class="btnAtualizarPipefy" onclick="atualizarCargasPipefy()">
            Atualizar Pipefy
        </button>

        <div id="status" style="margin-left:12px; color:#e5e7eb;"></div>

    </div>

    <div class="topbar-right">

        <a href="/janelas/dashboard.html"
           style="color:#e5e7eb; text-decoration:none; font-weight:700;">
            Por Responsáveis
        </a>

        <a href="/janelas/paineis-cargas.html"
           style="color:#e5e7eb; text-decoration:none; font-weight:700;">
            Por Cargas
        </a>

    </div>

</div>

<h2>Painel de Suínos - Filtros Avançados</h2>

<!-- LINHA 1 -->
<div class="linha">

    <div class="box">
        <h3>Suínos por Semana - Fornecedor</h3>
        <select id="filtroFornecedor" multiple></select>
        <canvas id="graficoFornecedor"></canvas>
    </div>

    <div class="box">
        <h3>Suínos por Semana - Comprador</h3>
        <select id="filtroComprador" multiple></select>
        <canvas id="graficoComprador"></canvas>
    </div>

</div>

<!-- LINHA 2 -->
<div class="linha">

    <div class="box">
        <h3>Suínos por Semana - Estado Fornecedor</h3>
        <select id="filtroEstadoFornecedor" multiple></select>
        <canvas id="graficoEstadoFornecedor"></canvas>
    </div>

    <div class="box">
        <h3>Suínos por Semana - Estado Comprador</h3>
        <select id="filtroEstadoComprador" multiple></select>
        <canvas id="graficoEstadoComprador"></canvas>
    </div>

</div>

<script>

let dadosGlobais = [];

let chartFornecedor, chartComprador, chartEstFornecedor, chartEstComprador;

async function carregar(){
    const API = "https://api-production-6670.up.railway.app";

    const res = await fetch(`${API}/paineis-cargas`);
    const json = await res.json();

    dadosGlobais = json.semanas || [];

    popularFiltros();
    atualizarGraficos();
}

function valoresSelecionados(id){
    return [...document.getElementById(id).selectedOptions]
        .map(o => o.value);
}

function popularFiltros(){

    const fornecedores = [...new Set(dadosGlobais.map(d => d.fornecedor || "N/A"))];
    const compradores = [...new Set(dadosGlobais.map(d => d.comprador || "N/A"))];
    const estadosF = [...new Set(dadosGlobais.map(d => d.estado_fornecedor || "N/A"))];
    const estadosC = [...new Set(dadosGlobais.map(d => d.estado_comprador || "N/A"))];

    preencher("filtroFornecedor", fornecedores);
    preencher("filtroComprador", compradores);
    preencher("filtroEstadoFornecedor", estadosF);
    preencher("filtroEstadoComprador", estadosC);

    document.querySelectorAll("select").forEach(s=>{
        s.addEventListener("change", atualizarGraficos);
    });
}

function preencher(id, lista){
    const el = document.getElementById(id);
    el.innerHTML = lista.map(v => `<option value="${v}">${v}</option>`).join("");
}

function filtrar(base, campo, valores){
    if(!valores.length) return base;
    return base.filter(d => valores.includes(d[campo] || "N/A"));
}

function agruparPorSemana(lista){
    const mapa = {};

    lista.forEach(d=>{
        mapa[d.semana] = (mapa[d.semana] || 0) + Number(d.total_suinos || 0);
    });

    const labels = Object.keys(mapa).sort();
    const valores = labels.map(l => mapa[l]);

    return { labels, valores };
}

function destruir(chart){
    if(chart) chart.destroy();
}

function criarGrafico(canvasId, labels, data, cor, tipo="bar"){

    return new Chart(document.getElementById(canvasId),{
        type:tipo,
        data:{
            labels,
            datasets:[{
                label:"Suínos",
                data,
                backgroundColor:cor,
                borderColor:cor
            }]
        },
        options:{
            responsive:true,
            maintainAspectRatio:false
        }
    });
}

function atualizarGraficos(){

    const fFornecedor = valoresSelecionados("filtroFornecedor");
    const fComprador = valoresSelecionados("filtroComprador");
    const fEstF = valoresSelecionados("filtroEstadoFornecedor");
    const fEstC = valoresSelecionados("filtroEstadoComprador");

    // FORNECEDOR
    let d1 = filtrar(dadosGlobais, "fornecedor", fFornecedor);
    let g1 = agruparPorSemana(d1);

    // COMPRADOR
    let d2 = filtrar(dadosGlobais, "comprador", fComprador);
    let g2 = agruparPorSemana(d2);

    // EST FORNECEDOR
    let d3 = filtrar(dadosGlobais, "estado_fornecedor", fEstF);
    let g3 = agruparPorSemana(d3);

    // EST COMPRADOR
    let d4 = filtrar(dadosGlobais, "estado_comprador", fEstC);
    let g4 = agruparPorSemana(d4);

    destruir(chartFornecedor);
    destruir(chartComprador);
    destruir(chartEstFornecedor);
    destruir(chartEstComprador);

    chartFornecedor = criarGrafico(
        "graficoFornecedor",
        g1.labels,
        g1.valores,
        "#2563eb"
    );

    chartComprador = criarGrafico(
        "graficoComprador",
        g2.labels,
        g2.valores,
        "#16a34a"
    );

    chartEstFornecedor = criarGrafico(
        "graficoEstadoFornecedor",
        g3.labels,
        g3.valores,
        "#f59e0b"
    );

    chartEstComprador = criarGrafico(
        "graficoEstadoComprador",
        g4.labels,
        g4.valores,
        "#dc2626"
    );
}

carregar();

</script>

</body>
</html>
