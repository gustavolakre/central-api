<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fluxo de Cargas - Sankey</title>

<link rel="stylesheet" href="/janelas/css/base.css">
<link rel="stylesheet" href="/janelas/css/tema-escuro.css">
<link rel="stylesheet" href="/janelas/css/topbar-paineis.css">
<link rel="stylesheet" href="/janelas/css/sankey.css">

<script src="/janelas/auth.js"></script>
<script src="/janelas/logout.js"></script>
</head>

<body class="tema-escuro">

<div class="topbar-dashboard">

    <div class="topbar-left">

        <button class="btn-voltar" onclick="voltarInicio()">
            &#11013; Voltar ao in&iacute;cio
        </button>

        <button class="btnAtualizarPipefy" onclick="atualizarCargasPipefy()">
            Atualizar Pipefy
        </button>

        <div id="status" class="topbar-status"></div>

        <span>Fluxo de Cargas</span>

    </div>

    <div class="topbar-right">

        <a href="/janelas/dashboard.html">
            Por Respons&aacute;veis
        </a>

        <a href="/janelas/paineis-cargas.html">
            Por Cargas
        </a>

        <a href="/janelas/paineis-cargas-2.html">
            Por Parceiros
        </a>

        <a href="/janelas/sankey.html" class="ativo">
            Fluxo (Sankey)
        </a>

        <a href="/janelas/paineis-condenacoes.html">
            Condenações
        </a>

    </div>

</div>

<h2>Fluxo de Cargas (Sankey)</h2>

<div class="filtros-box">

    <div class="filtros-modo">
        <div class="filtro-titulo">Tipo de Intera&ccedil;&atilde;o</div>
        <select id="filtroModoFluxo" onchange="aoMudarModoFluxo()">
            <option value="estado">Por Estado (UF)</option>
            <option value="parceiro" selected>Por Parceiro</option>
        </select>
    </div>

    <div class="filtros-topo">

        <div class="filtro-box semana">
            <div class="filtro-titulo">Semana</div>
            <div id="filtroSemanas"></div>
        </div>

        <div class="filtro-box fornecedor">
            <div class="filtro-titulo">Fornecedor</div>
            <div id="filtroFornecedor"></div>
        </div>

        <div class="filtro-box comprador">
            <div class="filtro-titulo">Comprador</div>
            <div id="filtroComprador"></div>
        </div>

        <div class="filtro-box uf-fornecedor">
            <div class="filtro-titulo">UF Fornecedor</div>
            <div id="filtroUFFornecedor"></div>
        </div>

        <div class="filtro-box uf-comprador">
            <div class="filtro-titulo">UF Comprador</div>
            <div id="filtroUFComprador"></div>
        </div>

        <div class="filtro-box tipo">
            <div class="filtro-titulo">Tipo Su&iacute;no</div>
            <div id="filtroTipoSuino"></div>
        </div>

        <div class="filtro-box frete">
            <div class="filtro-titulo">Frete</div>
            <div id="filtroFrete"></div>
        </div>

    </div>

    <div class="resumo">
        <div>Total exibido</div>
        <b id="totalExibido">0</b> su&iacute;nos
    </div>

</div>

<div class="box-grafico">
    <div id="sankey"></div>
    <div id="vazio" class="vazio" style="display:none;">
        Nenhuma carga encontrada para os filtros selecionados.
    </div>
</div>

<script src="https://www.gstatic.com/charts/loader.js"></script>
<script src="/janelas/js/ui-comum.js"></script>
<script src="/janelas/js/sankey.js"></script>

</body>

</html>
