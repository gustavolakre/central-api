<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fluxo de Cargas - Sankey</title>

<script src="/janelas/auth.js"></script>
<script src="/janelas/logout.js"></script>

<script src="https://www.gstatic.com/charts/loader.js"></script>

<style>

    body{
        background:#111827;
        margin:0;
        color:#f9fafb;
        font-family:"Segoe UI", Arial, Helvetica, sans-serif;
        overflow-x:hidden;
    }

    /* ==========================
       TOPBAR
    ========================== */

    .topbar-dashboard{
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:10px 20px;
        background:#0f172a;
        border-bottom:1px solid #374151;
        position:sticky;
        top:0;
        z-index:1000;
        flex-wrap:wrap;
        gap:12px;
    }

    .topbar-left{
        display:flex;
        align-items:center;
        gap:12px;
        font-size:18px;
        font-weight:700;
        color:#f9fafb;
    }

    .btn-voltar{
        background:#1f2937;
        color:#e5e7eb;
        border:1px solid #374151;
        padding:9px 16px;
        border-radius:8px;
        font-weight:600;
        font-size:14px;
        cursor:pointer;
    }

    .btn-voltar:hover{
        background:#374151;
    }

    .topbar-right{
        display:flex;
        align-items:center;
        gap:10px;
        flex-wrap:wrap;
    }

    .topbar-right a{
        color:#e5e7eb;
        text-decoration:none;
        font-weight:700;
        padding:8px 12px;
        border-radius:8px;
        transition:.2s;
    }

    .topbar-right a:hover{
        background:#1f2937;
    }

    .topbar-right a.ativo{
        background:#1f2937;
        color:#60a5fa;
    }

    h2{
        color:#f9fafb;
        margin:20px;
        font-size:26px;
    }

    /* ==========================
       FILTROS
    ========================== */

    .filtros{
        display:flex;
        flex-wrap:wrap;
        gap:16px;
        align-items:flex-end;
        background:#1f2937;
        margin:0 20px 20px 20px;
        padding:18px 20px;
        border-radius:12px;
        box-shadow:0 4px 12px rgba(0,0,0,.30);
    }

    .filtro-campo{
        display:flex;
        flex-direction:column;
        gap:6px;
    }

    .filtro-campo label{
        font-size:12px;
        font-weight:700;
        text-transform:uppercase;
        letter-spacing:.4px;
        color:#9ca3af;
    }

    .filtro-campo select{
        background:#111827;
        color:#f9fafb;
        border:1px solid #374151;
        border-radius:8px;
        padding:9px 12px;
        font-size:14px;
        min-width:220px;
        cursor:pointer;
    }

    .filtro-campo select:focus{
        outline:none;
        border-color:#60a5fa;
    }

    .resumo{
        margin-left:auto;
        text-align:right;
        color:#e5e7eb;
        font-size:14px;
    }

    .resumo b{
        font-size:22px;
        color:#60a5fa;
    }

    /* ==========================
       GRAFICO
    ========================== */

    .box-grafico{
        background:#1f2937;
        margin:0 20px 30px 20px;
        padding:20px;
        border-radius:12px;
        box-shadow:0 4px 12px rgba(0,0,0,.30);
    }

    #sankey{
        width:100%;
    }

    .vazio{
        color:#9ca3af;
        font-size:16px;
        font-style:italic;
        padding:40px 10px;
        text-align:center;
    }

</style>

</head>

<body>

<div class="topbar-dashboard">

    <div class="topbar-left">

        <button class="btn-voltar" onclick="voltarInicio()">
            ⬅ Voltar ao início
        </button>

        <span>Fluxo de Cargas</span>

    </div>

    <div class="topbar-right">

        <a href="/janelas/dashboard.html"
           style="color:#e5e7eb; text-decoration:none; font-weight:700;">
            Por Responsáveis
        </a>

        <a href="/janelas/paineis-cargas.html"
           style="color:#e5e7eb; text-decoration:none; font-weight:700;">
            Por Cargas
        </a>

        <a href="/janelas/paineis-cargas-2.html"
           style="color:#e5e7eb; text-decoration:none; font-weight:700;">
            Por Parceiros
        </a>

        <a href="/janelas/sankey.html"
           style="color:#60a5fa; text-decoration:none; font-weight:700;">
            Fluxo (Sankey)
        </a>

    </div>

</div>

<h2>Fluxo de Cargas (Sankey)</h2>

<div class="filtros">

    <div class="filtro-campo">
        <label>Tipo de Interação</label>
        <select id="filtroTipo" onchange="aoMudarTipo()">
            <option value="estado">Por Estado (UF)</option>
            <option value="parceiro">Por Parceiro</option>
        </select>
    </div>

    <div class="filtro-campo">
        <label>Origem</label>
        <select id="filtroOrigem" onchange="renderizar()">
            <option value="">Todas</option>
        </select>
    </div>

    <div class="filtro-campo">
        <label>Destino</label>
        <select id="filtroDestino" onchange="renderizar()">
            <option value="">Todos</option>
        </select>
    </div>

    <div class="filtro-campo">
        <label>Semana</label>
        <select id="filtroSemana" onchange="aoMudarSemana()">
            <option value="">Todas as semanas</option>
        </select>
    </div>

    <div class="resumo">
        <div>Total exibido</div>
        <b id="totalExibido">0</b> suínos
    </div>

</div>

<div class="box-grafico">
    <div id="sankey"></div>
    <div id="vazio" class="vazio" style="display:none;">
        Nenhuma carga encontrada para os filtros selecionados.
    </div>
</div>


<script>

const API = "https://api-production-6670.up.railway.app";

let dadosGlobais = [];
let googlePronto = false;


function voltarInicio(){
    window.location.href = "/janelas/inicial.html";
}


google.charts.load("current", { packages:["sankey"] });

google.charts.setOnLoadCallback(() => {
    googlePronto = true;
    renderizar();
});


/* ============================
   ORIGEM / DESTINO conforme tipo
============================ */

function camposDoTipo(){

    const tipo =
        document.getElementById("filtroTipo").value;

    if(tipo === "estado"){
        return {
            origem: "estado_fornecedor",
            destino: "estado_comprador"
        };
    }

    return {
        origem: "fornecedor",
        destino: "comprador"
    };

}


/* ============================
   CARREGAR DADOS
============================ */

async function carregarDados(){

    try{

        const res = await fetch(`${API}/paineis-cargas-2`);

        dadosGlobais = await res.json();

        montarFiltroSemana();
        montarFiltroOrigem();
        montarFiltroDestino();
        renderizar();

    }catch(err){

        console.error(err);

    }

}


function montarFiltroSemana(){

    const semanas = [
        ...new Set(
            dadosGlobais
                .map(d => d.semana)
                .filter(Boolean)
        )
    ];

    semanas.sort().reverse();

    const select =
        document.getElementById("filtroSemana");

    let html = `<option value="">Todas as semanas</option>`;

    semanas.forEach(s => {
        html += `<option value="${s}">${s}</option>`;
    });

    select.innerHTML = html;

}


function linhasFiltradasPorSemana(){

    const semana =
        document.getElementById("filtroSemana").value;

    if(!semana){
        return dadosGlobais;
    }

    return dadosGlobais.filter(d => d.semana === semana);

}


function montarFiltroOrigem(){

    const { origem } = camposDoTipo();

    const linhas = linhasFiltradasPorSemana();

    const valorAtual =
        document.getElementById("filtroOrigem").value;

    const origens = [
        ...new Set(
            linhas
                .map(d => (d[origem] || "").trim())
                .filter(Boolean)
        )
    ];

    origens.sort((a, b) => a.localeCompare(b, "pt-BR"));

    const select =
        document.getElementById("filtroOrigem");

    let html = `<option value="">Todas</option>`;

    origens.forEach(o => {
        html += `<option value="${o}">${o}</option>`;
    });

    select.innerHTML = html;

    // mantém a seleção se ainda existir
    if(origens.includes(valorAtual)){
        select.value = valorAtual;
    }

}


function montarFiltroDestino(){

    const { destino } = camposDoTipo();

    const linhas = linhasFiltradasPorSemana();

    const valorAtual =
        document.getElementById("filtroDestino").value;

    const destinos = [
        ...new Set(
            linhas
                .map(d => (d[destino] || "").trim())
                .filter(Boolean)
        )
    ];

    destinos.sort((a, b) => a.localeCompare(b, "pt-BR"));

    const select =
        document.getElementById("filtroDestino");

    let html = `<option value="">Todos</option>`;

    destinos.forEach(d => {
        html += `<option value="${d}">${d}</option>`;
    });

    select.innerHTML = html;

    // mantém a seleção se ainda existir
    if(destinos.includes(valorAtual)){
        select.value = valorAtual;
    }

}


function aoMudarTipo(){
    montarFiltroOrigem();
    montarFiltroDestino();
    renderizar();
}


function aoMudarSemana(){
    montarFiltroOrigem();
    montarFiltroDestino();
    renderizar();
}


/* ============================
   RENDERIZAR SANKEY
============================ */

function renderizar(){

    if(!googlePronto){
        return;
    }

    const { origem, destino } = camposDoTipo();

    const origemSelecionada =
        document.getElementById("filtroOrigem").value;

    const destinoSelecionado =
        document.getElementById("filtroDestino").value;

    const linhas = linhasFiltradasPorSemana();


    // agrega: origem -> destino => soma de quantidade
    const fluxos = {};
    let totalExibido = 0;

    linhas.forEach(d => {

        const o = (d[origem] || "").trim();
        const dst = (d[destino] || "").trim();

        if(!o || !dst){
            return;
        }

        if(
            origemSelecionada &&
            o !== origemSelecionada
        ){
            return;
        }

        if(
            destinoSelecionado &&
            dst !== destinoSelecionado
        ){
            return;
        }

        const qtd = Number(d.quantidade || 0);

        if(qtd <= 0){
            return;
        }

        const chave = o + " ||| " + dst;

        fluxos[chave] = (fluxos[chave] || 0) + qtd;

        totalExibido += qtd;

    });


    document.getElementById("totalExibido")
        .textContent =
            totalExibido.toLocaleString("pt-BR");


    const chaves = Object.keys(fluxos);

    const elVazio = document.getElementById("vazio");
    const elSankey = document.getElementById("sankey");


    if(!chaves.length){
        elSankey.innerHTML = "";
        elVazio.style.display = "block";
        return;
    }

    elVazio.style.display = "none";


    /* monta linhas do Sankey
       sufixo invisível no destino evita
       ciclos quando o mesmo nome aparece
       como origem e destino */

    const SUFixoDestino = "\u200B";

    const data = new google.visualization.DataTable();
    data.addColumn("string", "Origem");
    data.addColumn("string", "Destino");
    data.addColumn("number", "Suínos");

    const nosUnicos = new Set();

    // total por nó (para exibir abaixo do nome)
    const totalPorNo = {};

    chaves.forEach(chave => {

        const [o, dst] = chave.split(" ||| ");

        const destinoLabel = dst + SUFixoDestino;

        nosUnicos.add(o);
        nosUnicos.add(destinoLabel);

        totalPorNo[o] =
            (totalPorNo[o] || 0) + fluxos[chave];

        totalPorNo[destinoLabel] =
            (totalPorNo[destinoLabel] || 0) + fluxos[chave];

        data.addRow([
            o,
            destinoLabel,
            fluxos[chave]
        ]);

    });


    // altura dinâmica conforme número de nós
    const altura = Math.max(
        420,
        nosUnicos.size * 26
    );

    elSankey.style.height = altura + "px";


    const options = {
        sankey: {
            node: {
                label: {
                    color: "#f9fafb",
                    fontName: "Segoe UI",
                    fontSize: 14,
                    bold: true
                },
                labelPadding: 8,
                nodePadding: 18,
                width: 14
            },
            link: {
                colorMode: "gradient"
            }
        },
        tooltip: {
            textStyle: { color: "#111827" }
        }
    };


    const chart = new google.visualization.Sankey(
        elSankey
    );

    // após desenhar, injeta a quantidade
    // numa segunda linha abaixo do nome do nó
    google.visualization.events.addListener(
        chart,
        "ready",
        () => {
            adicionarQuantidadeNosNos(totalPorNo);
            observarSankey(totalPorNo);
        }
    );

    chart.draw(data, options);

}


let observerSankey = null;

function observarSankey(totalPorNo){

    const alvo = document.getElementById("sankey");

    if(!alvo){
        return;
    }

    if(observerSankey){
        observerSankey.disconnect();
    }

    observerSankey = new MutationObserver(() => {

        // evita laço: pausa, reinjeta e religa
        observerSankey.disconnect();

        adicionarQuantidadeNosNos(totalPorNo);

        observerSankey.observe(alvo, {
            childList: true,
            subtree: true
        });

    });

    observerSankey.observe(alvo, {
        childList: true,
        subtree: true
    });

}


function adicionarQuantidadeNosNos(totalPorNo){

    const svg =
        document.querySelector("#sankey svg");

    if(!svg){
        return;
    }

    svg.querySelectorAll("text").forEach(texto => {

        const label = texto.textContent;

        if(
            totalPorNo[label] == null ||
            texto.dataset.qtdAdicionada
        ){
            return;
        }

        const x = texto.getAttribute("x");

        const tspan = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "tspan"
        );

        if(x !== null){
            tspan.setAttribute("x", x);
        }

        tspan.setAttribute("dy", "1.35em");
        tspan.setAttribute("fill", "#9ca3af");
        tspan.setAttribute("font-size", "12");
        tspan.setAttribute("font-weight", "600");

        tspan.textContent =
            totalPorNo[label].toLocaleString("pt-BR");

        texto.appendChild(tspan);

        texto.dataset.qtdAdicionada = "1";

    });

}


window.addEventListener("resize", () => {
    renderizar();
});


carregarDados();

</script>

</body>

</html>
