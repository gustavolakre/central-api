<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Importar Cargas</title>
</head>
<body>

<h2>Importar Planilha de Cargas</h2>

<input
    type="file"
    id="arquivo"
    accept=".xlsx,.xls"
/>

<button onclick="importar()">
    Importar
</button>

<div id="resultado"></div>

<script>

async function importar() {

    const arquivo =
        document.getElementById("arquivo").files[0];

    if (!arquivo) {

        alert("Selecione um arquivo");

        return;
    }

    const formData = new FormData();

    formData.append(
        "arquivo",
        arquivo
    );

    const resposta = await fetch(
        "/importar-cargas-excel",
        {
            method: "POST",
            body: formData
        }
    );

    const dados =
        await resposta.json();

    document.getElementById("resultado")
        .innerHTML =
        JSON.stringify(dados, null, 2);
}

</script>

</body>
</html>
