<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Operacional</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#e5e7eb;
    margin:0;
    overflow-x:hidden;
}

.container{
    margin-top:20px;
}

.painel{
    min-width:0;
}

.painel .pipeline-barra{
    background:#374151;
    border-radius:8px;
    overflow:hidden;
}

.topo-dashboard{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 24px;
    background:#111827;
    border-bottom:1px solid #374151;
}

.btnAtualizarPipefy{
    background:#ea580c;
    color:white;
    border:none;
    padding:10px 16px;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
    transition:0.2s;
}

.btnAtualizarPipefy:hover{
    transform:translateY(-2px);
    background:#fb923c;
}

.container{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:20px;
    padding:12px 20px 20px 20px;
    height:calc(100vh - 60px);
    overflow:hidden;
}

.painel{
    background:#1f2937; /* cinza grafite */
    border-radius:16px;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    border:1px solid #374151;
}

.titulo{
    padding:18px 24px;
    font-size:22px;
    font-weight:700;
    color:#f9fafb;
    background:#111827;
    border-bottom:1px solid #374151;
}

.conteudo{
    flex:1;
    overflow-y:auto;
    padding:15px;
    color:#e5e7eb;
}

.pipeline-item{
    display:grid;
    grid-template-columns:220px 100px 1fr;
    gap:15px;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid #ececec;
}

.pipeline-header{
    display:contents;
}


.semana{
    color:#d1d5db;
    font-weight:700;
    font-size:18px;
}

.pipeline-linha{
    display:flex;
    align-items:center;
    gap:10px;
}

.pipeline-barra{
    height:42px;
    display:flex;
    overflow:hidden;
    border-radius:8px;
    background:#374151;
}

.fase{
    height:100%;
    cursor:pointer;
}

.total{
    text-align:right;
    font-weight:700;
    color:#f9fafb;
    font-size:18px;
}

.legenda{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:20px;
    padding-top:15px;
    border-top:1px solid #ececec;
}

.legenda-item{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:16px;
    font-weight:700;
    color:#e5e7eb;
}

.legenda-cor{
    width:20px;
    height:20px;
    border-radius:5px;
}

.vazio{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100%;
    color:#9ca3af;
    font-size:18px;
}

.avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    margin-right:10px;
    border:2px solid #374151;
}

.responsavel{
    display:flex;
    align-items:center;
    font-weight:600;
}

.legenda-topo{
    display:flex;
    flex-wrap:wrap;
    gap:22px;
    padding:18px 24px;
    background:#111827;
    border-bottom:1px solid #374151;
}

.foto-usuario{
    width:60px;
    height:60px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #e5e7eb;
}

.card-responsavel{
    background:#111827;
    border:1px solid #374151;
    border-radius:14px;
    padding:18px;
    margin-bottom:16px;
    transition:.2s;
}

.card-responsavel:hover{
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.cabecalho-responsavel{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:18px;
    padding-bottom:12px;
    border-bottom:1px solid #f1f5f9;
}

.nome-responsavel{
    font-size:16px;
    font-weight:700;
    color:#f9fafb;
}

.linha-semana{
    display:grid;
    grid-template-columns:90px 1fr 40px;
    gap:6px;
    align-items:center;
    margin-bottom:4px;
}

.grupo-responsavel{
    display:grid;
    grid-template-columns:220px 1fr;
    gap:15px;
    margin-bottom:26px;
    padding-bottom:16px;
    border-bottom:1px solid #e5e7eb;
}

.info-responsavel{
    display:flex;
    align-items:flex-start;
    gap:10px;
}

.lista-semanas{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.linha-semana{
    display:grid;
    grid-template-columns:80px 1fr 40px;
    gap:10px;
    align-items:center;
}

.foto-usuario{
    width:42px;
    height:42px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #e5e7eb;
}

.topbar-dashboard{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 20px;
    background:#0f172a;
    border-bottom:1px solid #374151;
    position:sticky;
    top:0;
    z-index:1000;
}

.topbar-left{
    font-size:18px;
    font-weight:700;
    color:#f9fafb;
}

.topbar-right{
    display:flex;
    gap:10px;
}

.topbar-left{
    display:flex;
    align-items:center;
    gap:12px;
}
</style>
</head>

<body>

<div class="topbar-dashboard">

    <div class="topbar-left">
      <button class="btnAtualizarPipefy" onclick="atualizarCargasPipefy()">
        Atualizar Pipefy
      </button>

      <div id="status" style="margin-left:12px; display:inline-block;"></div>
      
    </div>

</div>

<div class="container">

    <!-- PAINEL ESQUERDO -->

    <div class="painel">

        <div class="titulo">
            Evolução de Cargas por Semana e Programador
        </div>


<div class="legenda-topo">

    <div class="legenda-item">
        <div class="legenda-cor" style="background:#f97316"></div>
        Negociado
    </div>

    <div class="legenda-item">
        <div class="legenda-cor" style="background:#dc2626"></div>
        Planejamento
    </div>

    <div class="legenda-item">
        <div class="legenda-cor" style="background:#2563eb"></div>
        Programado
    </div>

    <div class="legenda-item">
        <div class="legenda-cor" style="background:#e7ad30"></div>
        04-Fechamento Fiscal
    </div>

    <div class="legenda-item">
        <div class="legenda-cor" style="background:#9333ea"></div>
        Doc. Pendentes
    </div>

</div>

        <div class="conteudo">

            <div id="listaPipeline"></div>

           
        </div>

    </div>

    <!-- PAINEL DIREITO -->

    <div class="painel">

        <div class="titulo">
            Evolução das cargas por dia da Semana
        </div>

        <div class="legenda-topo">

    <div class="legenda-item">
        <div class="legenda-cor" style="background:#f97316"></div>
        Negociado
    </div>

    <div class="legenda-item">
        <div class="legenda-cor" style="background:#dc2626"></div>
        Planejamento
    </div>

    <div class="legenda-item">
        <div class="legenda-cor" style="background:#2563eb"></div>
        Programado
    </div>

    <div class="legenda-item">
        <div class="legenda-cor" style="background:#e7ad30"></div>
        Fech. Fiscal
    </div>

    <div class="legenda-item">
        <div class="legenda-cor" style="background:#16a34a"></div>
        Verificação
    </div>

    <div class="legenda-item">
        <div class="legenda-cor" style="background:#9333ea"></div>
        Doc. Pendentes
    </div>

    <div class="legenda-item">
        <div class="legenda-cor" style="background:#e87bf7"></div>
        Pagamento
    </div>

</div>

        <div class="conteudo">

            <div class="vazio">
                Em construção
            </div>

        </div>

    </div>

</div>

<script>

const token = localStorage.getItem("token");

if(!token){
    window.location.href = "/janelas/login.html";
}

const CORES = {
    "01-Negociado":"#f97316",
    "02-Planejamento":"#dc2626",
    "03-Programado":"#2563eb",
    "04-Fechamento Fiscal":"#e7ad30",
    "05-Verificação":"#16a34a",
    "06-Doc. Pendentes":"#9333ea",
    "07-Pagamento":"#e87bf7"
};

const FOTOS = {
    "Adelar Schuh":
        "imagens/usuarios/adelar.jpeg",

    "Enário dos Santos":
        "imagens/usuarios/enario.jpeg",

    "Rafael de Lima":
        "imagens/usuarios/rafael.jpeg",

    "Vânia Riva":
        "imagens/usuarios/vania.jpg"
};

async function carregarPipeline(){

    const token = localStorage.getItem("token");

    if(!token){
        alert("Sessão expirada. Faça login novamente.");
        return;
    }

    try{

        const resposta = await fetch("/dashboard/pipeline", {
            headers:{
                Authorization:`Bearer ${token}`
            }
        });

        // 🔴 importante: checar 401 antes de tudo
        if(!resposta.ok){
            console.error("Erro HTTP:", resposta.status);
            alert("Erro ao carregar dados (login inválido).");
            return;
        }

        const dados = await resposta.json();
        
        console.log("Total registros:", dados.length);
console.table(dados.slice(0,50));

montarPipeline(dados);
montarPainelDireito(dados);

        montarPipeline(dados);
        montarPainelDireito(dados);

    }catch(erro){
        console.error(erro);
    }
}


async function atualizarCargasPipefy(){
    const status = document.getElementById("status");

    if (status) {
        status.innerHTML = "Gerando relatório no Pipefy...";
    }

    try{
        const resposta = await fetch("/importar-cargas-relatorio", {
            method:"POST",
            headers:{
                Authorization:`Bearer ${localStorage.getItem("token")}`
            }
        });

        const dados = await resposta.json();

        if(dados.sucesso){

            if (status) {
                status.innerHTML = `✅ ${dados.importados} cargas importadas`;
            }

                setTimeout(() => {
                location.reload();
            }, 1500);

         

        } else {

            if (status) {
                status.innerHTML = `❌ ${dados.erro}`;
            }
        }

    }catch(err){
        console.error(err);

        if (status) {
            status.innerHTML = "❌ Erro ao atualizar cargas.";
        }
    }
}



function montarPipeline(linhas){

    const responsaveis = {};

    linhas.forEach(item => {

    if(item.semana && item.semana.includes("2025")){
        return;
    }

    const fasesPainelEsquerdo = [
        "01-Negociado",
        "02-Planejamento",
        "03-Programado",
        "04-Fechamento Fiscal",
        "06-Doc. Pendentes"
    ];

    if(!fasesPainelEsquerdo.includes(item.fase)){
        return;
    }

    const nome = item.responsavel_dashboard;

    if(!responsaveis[nome]){
        responsaveis[nome] = {};
    }

    if(!responsaveis[nome][item.semana]){
        responsaveis[nome][item.semana] = {
            fases:{}
        };
    }

    if(
    !responsaveis[nome][item.semana]
        .fases[item.fase]
    ){
    responsaveis[nome][item.semana]
        .fases[item.fase] = 0;
    }

    responsaveis[nome][item.semana]
     .fases[item.fase] +=
     Number(item.quantidade);

    });

    const container =
        document.getElementById("listaPipeline");

    container.innerHTML = "";

    Object.entries(responsaveis)
        .forEach(([nome,semanas])=>{

        let htmlSemanas = "";

        Object.entries(semanas)
            .sort((a,b)=> b[0].localeCompare(a[0]))
            .forEach(([semana,dados])=>{

            const total =
               Object.values(dados.fases || {})
               .reduce((a,b)=>a+b,0);

            let barra = "";

            Object.entries(dados.fases)
                .forEach(([fase,qtd])=>{

                const largura =
                    (qtd / total) * 100;

                barra += `
                    <div
                        class="fase"
                        style="
                            width:${largura}%;
                            background:${CORES[fase]};
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            color:white;
                            font-size:16px;
                            font-weight:bold;
                            min-width:28px;
                        "
                        title="${fase}: ${qtd}"
                    >
                        ${qtd}
                    </div>
                `;
            });

            htmlSemanas += `
                <div class="linha-semana">

                    <div class="semana">
                        ${semana}
                    </div>

                    <div class="pipeline-barra">
                        ${barra}
                    </div>

                    <div class="total">
                        ${total}
                    </div>

                </div>
            `;

        });

        container.innerHTML += `

           <div class="grupo-responsavel">

               <div class="info-responsavel">

                <img
                  class="foto-usuario"
                  src="${FOTOS[nome]}"
                  alt="${nome}"
                >

                <div class="nome-responsavel">
                 ${nome}
              </div>

            </div>

            <div class="lista-semanas">

           ${htmlSemanas}

        </div>

      </div>

`;

    });

}


function montarPainelDireito(linhas){

    const semanas = {};

    linhas.forEach(item => {

    const semana = item.semana;
    const diaRaw = item.etiquetas || item.dia || "";
    const fase = item.fase;
    const qtd = Number(item.quantidade || 0);

    const diaLower = diaRaw.toString().trim().toLowerCase();

    // ignora lixo
    if (
        !semana ||
        semana.includes("2025") ||
        diaLower.includes("semana sem data definida")
    ) {
        return;
    }

    // extrai dia antes da vírgula
    let dia = diaLower.split(",")[0].trim();

    // normalização básica
    dia = dia
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace("-feira", "")
        .replace("feira", "")
        .trim();

    if (dia.includes("sem data definida")) {
    dia = "sem definição";
}

    if (!semanas[semana]) {
        semanas[semana] = {
            _semDia: {} // 👈 fallback para quem não tem dia
        };
    }

    // 🚨 CASO 1: tem dia
    if (dia && dia !== semana) {

        if (!semanas[semana][dia]) {
            semanas[semana][dia] = { fases: {} };
        }

        if (!semanas[semana][dia].fases[fase]) {
            semanas[semana][dia].fases[fase] = 0;
        }

        semanas[semana][dia].fases[fase] += qtd;

    }
    // 🚨 CASO 2: só semana (sem dia)
    else {

        if (!semanas[semana]._semDia.fases) {
            semanas[semana]._semDia.fases = {};
        }

        if (!semanas[semana]._semDia.fases[fase]) {
            semanas[semana]._semDia.fases[fase] = 0;
        }

        semanas[semana]._semDia.fases[fase] += qtd;
    }
});

    const diasOrdem = [
           "domingo",
           "segunda",
           "terca",
           "quarta",
           "quinta",
           "sexta",
           "sabado",
           "sem definição"
        ];

    const container = document
        .querySelectorAll(".painel")[1]
        .querySelector(".conteudo");

    let html = "";

    Object.entries(semanas)
    .sort((a,b) => b[0].localeCompare(a[0]))
    .forEach(([semana,dias]) => {

    let linhasDias = "";

    diasOrdem.forEach(dia => {

        const dadosDia = dias[dia];

        if(!dadosDia){
            return;
        }

           const fases = dadosDia.fases;

            const total = Object.values(fases)
                .reduce((a,b) => a + b, 0);

            let barra = "";

            Object.entries(fases).forEach(([fase,qtd]) => {

                const largura = (qtd / total) * 100;

                barra += `
                    <div style="
                        width:${largura}%;
                        background:${
                           fase === "01-Negociado" ? "#f97316" :
                           fase === "02-Planejamento" ? "#dc2626" :
                           fase === "03-Programado" ? "#2563eb" :
                           fase === "04-Fechamento Fiscal" ? "#e7ad30" :
                           fase === "05-Verificação" ? "#16a34a" :
                           fase === "06-Doc. Pendentes" ? "#9333ea" :
                           fase === "07-Pagamento" ? "#c026d3" :
                           "#6b7280"
                        };
                        height:100%;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        color:white;
                        font-size:16px;
                        font-weight:bold;
                    ">
                        ${qtd}
                    </div>
                `;
            });

            linhasDias += `
                <div class="linha-semana">

                    <div class="semana">
                        ${dia}
                    </div>

                    <div class="pipeline-barra">
                        ${barra}
                    </div>

                    <div class="total">
                        ${total}
                    </div>

                </div>
            `;
        });

        // NOVO BLOCO
        if(
            dias._semDia &&
            dias._semDia.fases &&
            Object.keys(dias._semDia.fases).length
        ){

            const fases = dias._semDia.fases;

            const total = Object.values(fases)
                .reduce((a,b) => a + b, 0);

            let barra = "";

            Object.entries(fases).forEach(([fase,qtd]) => {

                const largura = (qtd / total) * 100;

                barra += `
                    <div style="
                        width:${largura}%;
                        background:${
                           fase === "01-Negociado" ? "#f97316" :
                           fase === "02-Planejamento" ? "#dc2626" :
                           fase === "03-Programado" ? "#2563eb" :
                           fase === "04-Fechamento Fiscal" ? "#e7ad30" :
                           fase === "05-Verificação" ? "#16a34a" :
                           fase === "06-Doc. Pendentes" ? "#9333ea" :
                           fase === "07-Pagamento" ? "#c026d3" :
                           "#6b7280"
                        };
                        height:100%;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        color:white;
                        font-size:11px;
                        font-weight:bold;
                    ">
                        ${qtd}
                    </div>
                `;
            });

            linhasDias += `
                <div class="linha-semana">

                    <div class="semana">
                        Sem dia
                    </div>

                    <div class="pipeline-barra">
                        ${barra}
                    </div>

                    <div class="total">
                        ${total}
                    </div>

                </div>
            `;
        }

        html += `
            <div class="grupo-responsavel">

                <div class="info-responsavel">
                    <div class="nome-responsavel">
                        Semana ${semana}
                    </div>
                </div>

                <div class="lista-semanas">
                    ${linhasDias}
                </div>

            </div>
        `;
    });

    container.innerHTML = html;
}

carregarPipeline();

</script>

</body>
</html>
