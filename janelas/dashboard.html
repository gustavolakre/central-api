<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Operacional</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#e5e7eb;
    padding:20px;
}

.container{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    height:calc(100vh - 40px);
}

.painel{
    background:white;
    border-radius:16px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

.titulo{
    padding:18px 24px;
    font-size:22px;
    font-weight:700;
    color:#111827;
    background:white;
    border-bottom:1px solid #e5e7eb;
}

.conteudo{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.pipeline-item{
    display:grid;
    grid-template-columns:220px 100px 1fr;
    gap:15px;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid #ececec;
}

.pipeline-header{
    display:contents;
}

.responsavel{
    font-weight:600;
    color:#111827;
}

.semana{
    color:#374151;
    font-weight:700;
    font-size:14px;
}

.pipeline-linha{
    display:flex;
    align-items:center;
    gap:10px;
}

.pipeline-barra{
    height:34px;
    display:flex;
    overflow:hidden;
    border-radius:8px;
    background:#e5e7eb;
}

.fase{
    height:100%;
    cursor:pointer;
}

.total{
    text-align:right;
    font-weight:700;
    color:#111827;
}

.legenda{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:20px;
    padding-top:15px;
    border-top:1px solid #ececec;
}

.legenda-item{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
}

.legenda-cor{
    width:14px;
    height:14px;
    border-radius:4px;
}

.vazio{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100%;
    color:#9ca3af;
    font-size:18px;
}

.avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    margin-right:10px;
}

.responsavel{
    display:flex;
    align-items:center;
    font-weight:600;
}

.legenda-topo{
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    padding:14px 24px;
    background:#f8fafc;
    border-bottom:1px solid #e5e7eb;
}

.foto-usuario{
    width:60px;
    height:60px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #e5e7eb;
}

.card-responsavel{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:18px;
    margin-bottom:16px;
    transition:.2s;
}

.card-responsavel:hover{
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.cabecalho-responsavel{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:18px;
    padding-bottom:12px;
    border-bottom:1px solid #f1f5f9;
}

.nome-responsavel{
    font-size:20px;
    font-weight:700;
    color:#111827;
}

.linha-semana{
    display:grid;
    grid-template-columns:90px 1fr 50px;
    gap:15px;
    align-items:center;
    margin-bottom:10px;
}

</style>
</head>

<body>

<div class="container">

    <!-- PAINEL ESQUERDO -->

    <div class="painel">

        <div class="titulo">
            Pipeline de Cargas por Semana
        </div>


<div class="legenda-topo">

    <div class="legenda-item">
        <div class="legenda-cor" style="background:#f97316"></div>
        Negociado
    </div>

    <div class="legenda-item">
        <div class="legenda-cor" style="background:#dc2626"></div>
        Planejamento
    </div>

    <div class="legenda-item">
        <div class="legenda-cor" style="background:#2563eb"></div>
        Programado
    </div>

    <div class="legenda-item">
        <div class="legenda-cor" style="background:#ca8a04"></div>
        Fech. Fiscal
    </div>

    <div class="legenda-item">
        <div class="legenda-cor" style="background:#16a34a"></div>
        Verificação
    </div>

    <div class="legenda-item">
        <div class="legenda-cor" style="background:#9333ea"></div>
        Doc. Pendentes
    </div>

</div>

        <div class="conteudo">

            <div id="listaPipeline"></div>

           
        </div>

    </div>

    <!-- PAINEL DIREITO -->

    <div class="painel">

        <div class="titulo">
            Painel Direito
        </div>

        <div class="conteudo">

            <div class="vazio">
                Em construção
            </div>

        </div>

    </div>

</div>

<script>

const token = localStorage.getItem("token");

const CORES = {
    "01-Negociado":"#f97316",
    "02-Planejamento":"#dc2626",
    "03-Programado":"#2563eb",
    "04-Fechamento Fiscal":"#ca8a04",
    "05-Verificação":"#16a34a",
    "06-Doc. Pendentes":"#9333ea"
};

const FOTOS = {
    "Adelar Schuh":
        "imagens/usuarios/adelar.jpeg",

    "Enário dos Santos":
        "imagens/usuarios/enario.jpeg",

    "Rafael de Lima":
        "imagens/usuarios/rafael.jpeg",

    "Vânia Riva":
        "imagens/usuarios/vania.jpg"
};

async function carregarPipeline(){

    try{

        const resposta = await fetch(
            "/dashboard/pipeline",
            {
                headers:{
                    Authorization:`Bearer ${token}`
                }
            }
        );

        const dados = await resposta.json();

        montarPipeline(dados);

    }catch(erro){

        console.error(erro);

    }

}

function montarPipeline(linhas){

    const responsaveis = {};

    linhas.forEach(item => {

        const nome = item.responsaveis;

        if(!responsaveis[nome]){
            responsaveis[nome] = {};
        }

        if(!responsaveis[nome][item.semana]){
            responsaveis[nome][item.semana] = {
                fases:{}
            };
        }

        responsaveis[nome][item.semana]
            .fases[item.fase] =
            Number(item.quantidade);

    });

    const container =
        document.getElementById("listaPipeline");

    container.innerHTML = "";

    Object.entries(responsaveis)
        .forEach(([nome,semanas])=>{

        let htmlSemanas = "";

        Object.entries(semanas)
            .sort((a,b)=> b[0].localeCompare(a[0]))
            .forEach(([semana,dados])=>{

            const total =
                Object.values(dados.fases)
                .reduce((a,b)=>a+b,0);

            let barra = "";

            Object.entries(dados.fases)
                .forEach(([fase,qtd])=>{

                const largura =
                    (qtd / total) * 100;

                barra += `
                    <div
                        class="fase"
                        style="
                            width:${largura}%;
                            background:${CORES[fase]};
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            color:white;
                            font-size:12px;
                            font-weight:bold;
                            min-width:28px;
                        "
                        title="${fase}: ${qtd}"
                    >
                        ${qtd}
                    </div>
                `;
            });

            htmlSemanas += `
                <div class="linha-semana">

                    <div class="semana">
                        ${semana}
                    </div>

                    <div class="pipeline-barra">
                        ${barra}
                    </div>

                    <div class="total">
                        ${total}
                    </div>

                </div>
            `;

        });

        container.innerHTML += `

            <div class="card-responsavel">

                <div class="cabecalho-responsavel">

                    <img
                        class="foto-usuario"
                        src="${FOTOS[nome]}"
                        alt="${nome}"
                    >

                    <div class="nome-responsavel">
                        ${nome}
                    </div>

                </div>

                ${htmlSemanas}

            </div>

        `;

    });

}

carregarPipeline();

</script>

</body>
</html>
