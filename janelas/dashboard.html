<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Operacional</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f6f9;
    padding:20px;
}

.container{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    height:calc(100vh - 40px);
}

.painel{
    background:white;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

.titulo{
    padding:15px 20px;
    font-size:20px;
    font-weight:bold;
    border-bottom:1px solid #e5e7eb;
}

.conteudo{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.pipeline-item{
    display:grid;
    grid-template-columns:220px 100px 1fr;
    gap:15px;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid #ececec;
}

.pipeline-header{
    display:contents;
}

.responsavel{
    font-weight:600;
    color:#111827;
}

.semana{
    color:#6b7280;
    font-weight:600;
}

.pipeline-linha{
    display:flex;
    align-items:center;
    gap:10px;
}

.pipeline-barra{
    flex:1;
    height:32px;
    display:flex;
    overflow:hidden;
    border-radius:8px;
    background:#e5e7eb;
}

.fase{
    height:100%;
    cursor:pointer;
}

.total{
    min-width:45px;
    text-align:right;
    font-weight:bold;
    font-size:16px;
}

.legenda{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:20px;
    padding-top:15px;
    border-top:1px solid #ececec;
}

.legenda-item{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
}

.legenda-cor{
    width:14px;
    height:14px;
    border-radius:4px;
}

.vazio{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100%;
    color:#9ca3af;
    font-size:18px;
}

.avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    margin-right:10px;
}

.responsavel{
    display:flex;
    align-items:center;
    font-weight:600;
}

.legenda-topo{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    padding:12px 20px;
    border-bottom:1px solid #e5e7eb;
    background:#fafafa;
}


</style>
</head>

<body>

<div class="container">

    <!-- PAINEL ESQUERDO -->

    <div class="painel">

        <div class="titulo">
            Pipeline de Cargas por Semana
        </div>


<div class="legenda-topo">

    <div class="legenda-item">
        <div class="legenda-cor" style="background:#f97316"></div>
        Negociado
    </div>

    <div class="legenda-item">
        <div class="legenda-cor" style="background:#dc2626"></div>
        Planejamento
    </div>

    <div class="legenda-item">
        <div class="legenda-cor" style="background:#2563eb"></div>
        Programado
    </div>

    <div class="legenda-item">
        <div class="legenda-cor" style="background:#ca8a04"></div>
        Fech. Fiscal
    </div>

    <div class="legenda-item">
        <div class="legenda-cor" style="background:#16a34a"></div>
        Verificação
    </div>

    <div class="legenda-item">
        <div class="legenda-cor" style="background:#9333ea"></div>
        Doc. Pendentes
    </div>

</div>

        <div class="conteudo">

            <div id="listaPipeline"></div>

           
        </div>

    </div>

    <!-- PAINEL DIREITO -->

    <div class="painel">

        <div class="titulo">
            Painel Direito
        </div>

        <div class="conteudo">

            <div class="vazio">
                Em construção
            </div>

        </div>

    </div>

</div>

<script>

const token = localStorage.getItem("token");

const CORES = {
    "01-Negociado":"#f97316",
    "02-Planejamento":"#dc2626",
    "03-Programado":"#2563eb",
    "04-Fechamento Fiscal":"#ca8a04",
    "05-Verificação":"#16a34a",
    "06-Doc. Pendentes":"#9333ea"
};

async function carregarPipeline(){

    try{

        const resposta = await fetch(
            "/dashboard/pipeline",
            {
                headers:{
                    Authorization:`Bearer ${token}`
                }
            }
        );

        const dados = await resposta.json();

        montarPipeline(dados);

    }catch(erro){

        console.error(erro);

    }

}

function montarPipeline(linhas){

    const agrupado = {};

    linhas.forEach(item => {

        const chave =
            item.responsaveis +
            "|" +
            item.semana;

        if(!agrupado[chave]){

            agrupado[chave] = {
                responsavel:item.responsaveis,
                semana:item.semana,
                fases:{}
            };

        }

        agrupado[chave]
            .fases[item.fase] =
                Number(item.quantidade);

    });

    const container =
        document.getElementById(
            "listaPipeline"
        );

    container.innerHTML = "";

    Object.values(agrupado)
        .forEach(item => {

        const total =
            Object.values(item.fases)
            .reduce((a,b)=>a+b,0);

        

        let barra = "";

        Object.entries(item.fases)
            .forEach(([fase,qtd])=>{

            const largura =
                (qtd/total)*100;

            barra += `
           <div
               class="fase"
               style="
                  width:${largura}%;
                  background:${CORES[fase]};
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  color:white;
                  font-size:12px;
                  font-weight:bold;
                  min-width:28px;
            "
            title="${fase}: ${qtd}"
        >
            ${qtd}
        </div>
     `;

        });

     container.innerHTML += `

<div class="pipeline-item">

    <div class="responsavel">

        <div class="avatar">
            ${item.responsavel.charAt(0)}
        </div>

        ${item.responsavel}

    </div>

    <div class="semana">
        ${item.semana}
    </div>

    <div>

     
        <div class="pipeline-linha">

            <div class="pipeline-barra">
                ${barra}
            </div>

            <div class="total">
                ${total}
            </div>

        </div>

    </div>

</div>

`;

    });

}

carregarPipeline();

</script>

</body>
</html>
