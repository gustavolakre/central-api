<script>

    async function validarLogin() {

    const token =
        localStorage.getItem("token");

    if (!token) {

        window.location.href =
            "/login";

        return;
    }

    try {

        const resposta =
            await fetch(
                "/validar-token",
                {
                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );

        if (!resposta.ok) {

            localStorage.removeItem(
                "token"
            );

            window.location.href =
                "/login";
        }

    } catch {

        window.location.href =
            "/login";
    }

}

validarLogin();



 //const API = "https://api-production-6670.up.railway.app"



function authHeaders(extra = {}){

    return {
        ...extra,

        Authorization:
            `Bearer ${
                localStorage.getItem("token")
            }`
    };

}

async function salvarLancamento(){

    try{

        const body = {

            tipo:
                document.getElementById("tipo").value,

            parceiro:
                document.getElementById("parceiro").value,

            discriminacao_periodo:
                document.getElementById(
                    "discriminacao_periodo"
                ).value,

            produto_servico:
                document.getElementById(
                    "produto_servico"
                ).value,
                
            conta_gerencial:
                document.getElementById(
                   "conta_gerencial"
                ).value,

            valor:
               document.getElementById("valor")
                 .value
                 .replace(/\./g,'')
                 .replace(',','.'),

            data_emissao:
                document.getElementById(
                    "data_emissao"
                ).value,

            vencimento:
                document.getElementById(
                    "vencimento"
                ).value,

            nota_fiscal:
                document.getElementById(
                    "nota_fiscal"
                ).value,

            observacao:
                document.getElementById(
                    "observacao"
                ).value

        }


        const url = editandoId

           ? `${API}/financeiro/${editandoId}`
           : `${API}/financeiro`
 
        const metodo = editandoId
           ? "PUT"
           : "POST"


        const response = await fetch(

             url,

            {

                method:metodo,

                headers: authHeaders({
                   "Content-Type":"application/json"
             }),

                body:JSON.stringify(body)

            }

        )


        if(!response.ok){

            throw new Error(
                "Erro ao salvar"
            )

        }


        alert("Lançamento salvo")

        document.getElementById("tipo").value = "RECEBER"

        document.getElementById("parceiro").value = ""

        document.getElementById(
             "discriminacao_periodo"
        ).value = ""

        document.getElementById(
             "produto_servico"
        ).value = ""

        document.getElementById(
             "conta_gerencial"
        ).value = ""
             
        document.getElementById("valor").value = ""

        document.getElementById(
             "vencimento"
        ).value = ""

        document.getElementById(
             "nota_fiscal"
        ).value = ""

        document.getElementById(
            "observacao"
        ).value = ""


        /* mantém data atual */

        document.getElementById(
           "data_emissao"
        ).value =
            new Date()
            .toISOString()
            .split("T")[0]


        carregarLancamentos()

    }

    catch(err){

        console.error(err)

        alert("Erro ao salvar lançamento")

    }

}

    try{

        await fetch(

            `${API}/financeiro/${id}`,

            {

               headers: authHeaders()
            }
        )

        carregarLancamentos()

    }

    catch(err){

        console.error(err)

        alert("Erro ao excluir")

function formatarMoeda(input){

    let valor = input.value

    valor = valor.replace(/\D/g,'')

    valor = (Number(valor) / 100)
        .toFixed(2) + ''

    valor = valor.replace(".", ",")

    valor = valor.replace(
        /\B(?=(\d{3})+(?!\d))/g,
        "."
    )

    input.value = valor

}


function abrirBaixa(
    id,
    valor,
    valorPagoAtual
){

    lancamentoAtual = id

    valorDocumento = Number(valor)

    valorJaPago = Number(valorPagoAtual || 0)

    const restante =
        valorDocumento - valorJaPago


        if(
           valorJaPago > 0 &&
           valorJaPago < valorDocumento
        ){

           document.getElementById(
               "btnExcluirBaixa"
        ).style.display = "block"

        }
        else{

            document.getElementById(
                 "btnExcluirBaixa"
            ).style.display = "none"

        }


    document.getElementById(
        "modalBaixa"
    ).style.display = "block"


    document.getElementById(
        "tipoBaixa"
    ).value = "TOTAL"


    document.getElementById(
        "valorPago"
    ).value = restante.toFixed(2)


    document.getElementById(
        "dataPagamento"
    ).value =
        new Date()
        .toISOString()
        .split("T")[0]

}

}

}



function alterarTipoBaixa(){

    const tipo =
        document.getElementById(
            "tipoBaixa"
        ).value

    const restante =
        valorDocumento - valorJaPago


    if(tipo === "TOTAL"){

        document.getElementById(
            "valorPago"
        ).value =
            restante.toFixed(2)

    }

    else{

        document.getElementById(
            "valorPago"
        ).value = ""

    }

}


function editarLancamento(item){

    editandoId = item.id


    document.getElementById("tipo").value =
        item.tipo || ""

    document.getElementById("parceiro").value =
        item.parceiro || ""

    document.getElementById(
        "discriminacao_periodo"
    ).value =
        item.discriminacao_periodo || ""

    document.getElementById(
        "produto_servico"
    ).value =
        item.produto_servico || ""

    document.getElementById(
       "conta_gerencial"
    ).value =
        item.conta_gerencial || ""


    document.getElementById("valor").value =
        Number(item.valor || 0)
        .toLocaleString(
            'pt-BR',
            {
                minimumFractionDigits:2
            }
        )

    document.getElementById(
        "data_emissao"
    ).value =
        item.data_emissao
        ? item.data_emissao.split("T")[0]
        : ""

    document.getElementById(
        "vencimento"
    ).value =
        item.vencimento
        ? item.vencimento.split("T")[0]
        : ""

    document.getElementById(
        "nota_fiscal"
    ).value =
        item.nota_fiscal || ""

    document.getElementById(
        "observacao"
    ).value =
        item.observacao || ""


    document.querySelector(
        ".acoes button"
    ).innerText =
        "Atualizar Lançamento"


    window.scrollTo({
        top:0,
        behavior:"smooth"
    })

}

async function excluirBaixaParcial(){

    try{

        const ok = confirm(
            "Deseja excluir a baixa parcial?"
        )

        if(!ok) return


        await fetch(

            `${API}/financeiro/${lancamentoAtual}/anular-baixa`,

            {
               method:"PUT",

              headers: authHeaders()
            }

        )

        alert("Baixa parcial removida")


        fecharModalBaixa()

        carregarLancamentos()

    }

    catch(err){

        console.error(err)

        alert("Erro ao remover baixa")

    }

}

async function confirmarBaixa(){

    try{

        const banco =
            document.getElementById(
                "bancoBaixa"
            ).value

        const valorPago =
            Number(
                document.getElementById(
                    "valorPago"
                ).value
            )

        const dataPagamento =
            document.getElementById(
                "dataPagamento"
            ).value


        if(!banco){

            alert("Selecione o banco")

            return

        }


        const restante =
            valorDocumento - valorJaPago


        if(valorPago <= 0){

            alert("Valor inválido")

            return

        }


        if(valorPago > restante){

            alert(
                "Valor maior que o saldo restante"
            )

            return

        }


        await fetch(

            `${API}/financeiro/${lancamentoAtual}/baixa`,

            {

                method:"PUT",

                headers: authHeaders({
                     "Content-Type":"application/json"
                }),

                body:JSON.stringify({

                    valor_pago:valorPago,

                    banco_pagamento:banco,

                    data_pagamento:dataPagamento

                })

            }

        )


        alert("Baixa realizada")

        fecharModalBaixa()

        carregarLancamentos()

    }

    catch(err){

        console.error(err)

        alert("Erro na baixa")

    }

}

        const filtroTipo =
            document.getElementById(
               "filtroTipo"
        ).value

        const filtroParceiro =
            document.getElementById(
              "filtroParceiro"
        )
            .value
            .toLowerCase()

        const emissaoInicial =
            document.getElementById(
                "filtroEmissaoInicial"
            ).value


        const emissaoFinal =
            document.getElementById(
                "filtroEmissaoFinal"
            ).value


        const vencInicial =
            document.getElementById(
                "filtroVencInicial"
            ).value


        const vencFinal =
            document.getElementById(
                "filtroVencFinal"
            ).value

     
        const filtroNota =
            document.getElementById(
                "filtroNota"
            )
            .value
            .toLowerCase()


               



        /* =========================================
           FILTRAR
        ========================================= */

        const filtrados = dados.filter(item=>{

         
            /* TIPO */

            const okTipo =

              !filtroTipo ||

              item.tipo === filtroTipo


        
            /* PARCEIRO */

           const okParceiro =

                !filtroParceiro ||

                (item.parceiro || "")
                .toLowerCase()
                .includes(filtroParceiro)


            const okNota =

                !filtroNota ||

                (item.nota_fiscal || "")
                .toLowerCase()
                .includes(filtroNota)



            /* EMISSÃO */

            let okEmissao = true

            if(item.data_emissao){

                const emissao =

                    item.data_emissao
                    .split("T")[0]


                if(
                    emissaoInicial &&
                    emissao < emissaoInicial
                ){
                    okEmissao = false
                }


                if(
                    emissaoFinal &&
                    emissao > emissaoFinal
                ){
                    okEmissao = false
                }

            }



            /* VENCIMENTO */

            let okVencimento = true

            if(item.vencimento){

                const venc =

                    item.vencimento
                    .split("T")[0]


                if(
                    vencInicial &&
                    venc < vencInicial
                ){
                    okVencimento = false
                }


                if(
                    vencFinal &&
                    venc > vencFinal
                ){
                    okVencimento = false
                }

            }



            return (

                 okTipo &&
                 okParceiro &&
                 okEmissao &&
                 okNota &&
                 okVencimento
            )

        })



        /* =========================================
           TABELA
        ========================================= */

        filtrados.forEach(item=>{


            const valor =
                Number(item.valor || 0)

            const valorPago =
                Number(item.valor_pago || 0)

            const saldo =
                valor - valorPago


                const hoje = new Date()

            const vencimentoData = item.vencimento
                ? new Date(item.vencimento)
                : null

            const diffDias = vencimentoData
                ? Math.ceil(
                (vencimentoData - hoje)
                / (1000 * 60 * 60 * 24)
            )
                : null

            let corVencimento = "#111827"


            /* VENCIDO */

            if(
                vencimentoData &&
                diffDias < 0 &&
                item.status !== "PAGO"
            ){

                corVencimento = "#dc2626"

            }


/* VENCE EM ATÉ 5 DIAS */

else if(
    vencimentoData &&
    diffDias >= 0 &&
    diffDias <= 5 &&
    item.status !== "PAGO"
){

    corVencimento = "#ca8a04"

}


            tbody.innerHTML += `

                <tr>

                    <td>${item.id}</td>


                    <td class="${
                        item.tipo === 'RECEBER'
                        ? 'receber'
                        : 'pagar'
                    }">

                        ${item.tipo}

                    </td>


                    <td>
                        ${item.parceiro || ''}
                    </td>

                    <td>
                       ${item.discriminacao_periodo || ''}
                    </td>


                    <td>
                       ${item.produto_servico || ''}
                    </td>

                    <td>
                       ${item.conta_gerencial || ''}
                    </td>

                    <td>
                       ${item.nota_fiscal || ''}
                    </td>

                    <td>

                         ${valor.toLocaleString(
                            'pt-BR',{

                            style:'currency',

                            currency:'BRL'

                        })}

                    </td>


                    <td>

                        ${valorPago.toLocaleString(
                            'pt-BR',{

                            style:'currency',

                            currency:'BRL'

                        })}

                    </td>


                    <td style="
                        font-weight:bold;
                        color:${saldo > 0 ? '#dc2626' : '#15803d'};
                    ">

                        ${saldo.toLocaleString(
                    'pt-BR',{

                        style:'currency',

                        currency:'BRL'

                    })}

                    </td>

                    <td>

                        ${item.data_emissao
                            ? item.data_emissao
                            .split("T")[0]
                            .split("-")
                            .reverse()
                            .join("/")
                        : ''}

                    </td>


                    <td style="
                        font-weight:bold;
                        color:${corVencimento};
                     ">

                        ${item.vencimento
                            ? new Date(
                                item.vencimento
                              ).toLocaleDateString('pt-BR')
                            : ''}

                    </td>


                  <td
                       style="
                            display:flex;
                            gap:6px;
                            flex-wrap:wrap;
                        "
                    >

                     <button
                        onclick="abrirBaixa(
                            ${item.id},
                            ${valor},
                            ${valorPago}
                        )"
                     >
                         Baixar
                    </button>


                    <button
                         style="background:#ca8a04;"
                         onclick='editarLancamento(${JSON.stringify(item)})'
                     >
                         Editar
                     </button>


                    <button
                          style="background:#dc2626;"
                          onclick="excluirLancamento(${item.id})"
                     >
                          Excluir
                     </button>


                   </td>
                    

                </tr>

            `

        })

    }

    catch(err){

        console.error(err)

    }

}

    "data_emissao"

    new Date()
    .toISOString()
    .split("T")[0]
