<script>

    async function validarLogin() {

    const token =
        localStorage.getItem("token");

    if (!token) {

        window.location.href =
            "/login";

        return;
    }

    try {

        const resposta =
            await fetch(
                "/validar-token",
                {
                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );

        if (!resposta.ok) {

            localStorage.removeItem(
                "token"
            );

            window.location.href =
                "/login";
        }

    } catch {

        window.location.href =
            "/login";
    }

}

validarLogin();



 //const API = "https://api-production-6670.up.railway.app"



function authHeaders(extra = {}){

    return {
        ...extra,

        Authorization:
            `Bearer ${
                localStorage.getItem("token")
            }`
    };

}

async function salvarLancamento(){

    try{

        const body = {

            tipo:
                document.getElementById("tipo").value,

            parceiro:
                document.getElementById("parceiro").value,

            discriminacao_periodo:
                document.getElementById(
                    "discriminacao_periodo"
                ).value,

            produto_servico:
                document.getElementById(
                    "produto_servico"
                ).value,
                
            conta_gerencial:
                document.getElementById(
                   "conta_gerencial"
                ).value,

            valor:
               document.getElementById("valor")
                 .value
                 .replace(/\./g,'')
                 .replace(',','.'),

            data_emissao:
                document.getElementById(
                    "data_emissao"
                ).value,

            vencimento:
                document.getElementById(
                    "vencimento"
                ).value,

            nota_fiscal:
                document.getElementById(
                    "nota_fiscal"
                ).value,

            observacao:
                document.getElementById(
                    "observacao"
                ).value

        }


        const url = editandoId

           ? `${API}/financeiro/${editandoId}`
           : `${API}/financeiro`
 
        const metodo = editandoId
           ? "PUT"
           : "POST"


        const response = await fetch(

             url,

            {

                method:metodo,

                headers: authHeaders({
                   "Content-Type":"application/json"
             }),

                body:JSON.stringify(body)

            }

        )


        if(!response.ok){

            throw new Error(
                "Erro ao salvar"
            )

        }


        alert("Lançamento salvo")

        document.getElementById("tipo").value = "RECEBER"

        definirComboboxParceiro("parceiro", "")

        document.getElementById(
             "discriminacao_periodo"
        ).value = ""

        document.getElementById(
             "produto_servico"
        ).value = ""

        document.getElementById(
             "conta_gerencial"
        ).value = ""
             
        document.getElementById("valor").value = ""

        document.getElementById(
             "vencimento"
        ).value = ""

        document.getElementById(
             "nota_fiscal"
        ).value = ""

        document.getElementById(
            "observacao"
        ).value = ""


        /* mantém data atual */

        document.getElementById(
           "data_emissao"
        ).value =
            new Date()
            .toISOString()
            .split("T")[0]


        carregarLancamentos()

    }

    catch(err){

        console.error(err)

        alert("Erro ao salvar lançamento")

    }

}


let lancamentoAtual = null

let editandoId = null

let valorDocumento = 0

let valorJaPago = 0

let parceirosBase = []


function definirComboboxParceiro(id, nome){

    document.getElementById(id).value =
        nome || ""

    const label =
        document.getElementById(`${id}Label`)

    if(id === "filtroParceiro"){

        label.textContent =
            nome || "Todos"

        return

    }

    label.textContent =
        nome || "Selecione"

}


function fecharComboboxParceiro(id){

    const panel =
        document.getElementById(`${id}Panel`)

    if(panel){
        panel.style.display = "none"
    }

    const busca =
        document.getElementById(`${id}Busca`)

    if(busca){
        busca.value = ""
    }

}


function fecharTodosComboboxParceiro(){

    fecharComboboxParceiro("parceiro")

    fecharComboboxParceiro("filtroParceiro")

}


function toggleComboboxParceiro(id, event){

    event.stopPropagation()

    const panel =
        document.getElementById(`${id}Panel`)

    const aberto =
        panel.style.display === "block"

    fecharTodosComboboxParceiro()

    if(aberto){
        return
    }

    panel.style.display = "block"

    renderizarComboboxParceiro(id, "")

    document.getElementById(`${id}Busca`).focus()

}


function filtrarComboboxParceiro(id){

    const termo =
        document.getElementById(`${id}Busca`).value

    renderizarComboboxParceiro(id, termo)

}


function renderizarComboboxParceiro(id, termo){

    const lista =
        document.getElementById(`${id}Lista`)

    const termoNorm =
        (termo || "")
        .toLowerCase()
        .trim()

    let html = ""

    if(id === "filtroParceiro"){

        html += `
            <li onclick="selecionarComboboxParceiro('filtroParceiro','')">
                Todos
            </li>
        `

    }

    const filtrados =
        parceirosBase.filter(parceiro=>{

            const nome =
                (parceiro.nome_usual || "")
                .toLowerCase()

            return !termoNorm ||
                nome.includes(termoNorm)

        })

    if(!filtrados.length){

        html += `
            <li class="parceiro-combobox-vazio">
                Nenhum parceiro encontrado
            </li>
        `

    }
    else{

       filtrados.forEach(parceiro=>{

         const nome = parceiro.nome_usual || ""

            html += `
            <li
                onclick="selecionarComboboxParceiro(
                    '${id}',
                 this.dataset.nome
                 )"
               data-nome="${nome
                .replace(/"/g,'&quot;')
                .replace(/'/g,'&#39;')
                 }"
               >
                ${nome}
            </li>
           `

        })

    }

    lista.innerHTML = html

}


function selecionarComboboxParceiro(id, nome){

    definirComboboxParceiro(id, nome)

    fecharComboboxParceiro(id)

    if(id === "filtroParceiro"){
        carregarLancamentos()
    }

}


document.addEventListener("click", () => {

    fecharTodosComboboxParceiro()

})


function limparFiltros(){

    document.getElementById("filtroTipo").value = ""

    definirComboboxParceiro("filtroParceiro", "")

    document.getElementById("filtroNota").value = ""

    document.getElementById("filtroEmissaoInicial").value = ""

    document.getElementById("filtroEmissaoFinal").value = ""

    document.getElementById("filtroVencInicial").value = ""

    document.getElementById("filtroVencFinal").value = ""

    carregarLancamentos()

}


async function excluirLancamento(id){

    const confirmar = confirm(
        "Deseja excluir o lançamento?"
    )

    if(!confirmar) return


    try{

        await fetch(

            `${API}/financeiro/${id}`,

            {
               method:"DELETE",

               headers: authHeaders()
            }
        )

        carregarLancamentos()

    }

    catch(err){

        console.error(err)

        alert("Erro ao excluir")

    }

}


async function carregarContasGerenciais(){

    try{

       const response = await fetch(
            `${API}/contas-gerenciais`,
        {
             headers: authHeaders()
        }
    )

        const contas = await response.json()

        const select =
            document.getElementById(
                "conta_gerencial"
            )

        select.innerHTML = `

            <option value="">
                Selecione
            </option>

        `

        contas.forEach(conta=>{

            select.innerHTML += `

                <option value="${conta.nome}">
                    ${conta.nome}
                </option>

            `

        })

    }

    catch(err){

        console.error(err)

    }

}



async function carregarParceiros(){

    console.log("FUNÇÃO PARCEIROS EXECUTOU")

    try{

        const response =
          await fetch(
          `${API}/buscarParceiros`,
        {
          headers: authHeaders()
        }
      )

        const parceiros =
            await response.json()

        console.log(parceiros)

        parceirosBase = parceiros

        renderizarComboboxParceiro("parceiro", "")

    }

    catch(err){

    }

}



async function carregarBancosBaixa(){

    try{

        const bancos =

function formatarMoeda(input){

    let valor = input.value

    valor = valor.replace(/\D/g,'')

    valor = (Number(valor) / 100)
        .toFixed(2) + ''

    valor = valor.replace(".", ",")

    valor = valor.replace(
        /\B(?=(\d{3})+(?!\d))/g,
        "."
    )

    input.value = valor

}


function abrirBaixa(
    id,
    valor,
    valorPagoAtual
){

    lancamentoAtual = id

    valorDocumento = Number(valor)

    valorJaPago = Number(valorPagoAtual || 0)

    const restante =
        valorDocumento - valorJaPago


        if(
           valorJaPago > 0 &&
           valorJaPago < valorDocumento
        ){

           document.getElementById(
               "btnExcluirBaixa"
        ).style.display = "block"

        }
        else{

            document.getElementById(
                 "btnExcluirBaixa"
            ).style.display = "none"

        }


    document.getElementById(
        "modalBaixa"
    ).style.display = "block"


    document.getElementById(
        "tipoBaixa"
    ).value = "TOTAL"


    document.getElementById(
        "valorPago"
    ).value = restante.toFixed(2)


    document.getElementById(
        "dataPagamento"
    ).value =
        new Date()
        .toISOString()
        .split("T")[0]

}



function fecharModalBaixa(){

    document.getElementById(
        "modalBaixa"
    ).style.display = "none"

}

function voltarInicio() {

    window.location.href =
        "/janelas/inicial.html";

}



function alterarTipoBaixa(){

    const tipo =
        document.getElementById(
            "tipoBaixa"
        ).value

    const restante =
        valorDocumento - valorJaPago


    if(tipo === "TOTAL"){

        document.getElementById(
            "valorPago"
        ).value =
            restante.toFixed(2)

    }

    else{

        document.getElementById(
            "valorPago"
        ).value = ""

    }

}


function editarLancamento(item){

    editandoId = item.id


    document.getElementById("tipo").value =
        item.tipo || ""

    definirComboboxParceiro(
        "parceiro",
        item.parceiro || ""
    )

    document.getElementById(
        "discriminacao_periodo"
    ).value =
        item.discriminacao_periodo || ""

    document.getElementById(
        "produto_servico"
    ).value =
        item.produto_servico || ""

    document.getElementById(
       "conta_gerencial"
    ).value =
        item.conta_gerencial || ""


    document.getElementById("valor").value =
        Number(item.valor || 0)
        .toLocaleString(
            'pt-BR',
            {
                minimumFractionDigits:2
            }
        )

    document.getElementById(
        "data_emissao"
    ).value =
        item.data_emissao
        ? item.data_emissao.split("T")[0]
        : ""

    document.getElementById(
        "vencimento"
    ).value =
        item.vencimento
        ? item.vencimento.split("T")[0]
        : ""

    document.getElementById(
        "nota_fiscal"
    ).value =
        item.nota_fiscal || ""

    document.getElementById(
        "observacao"
    ).value =
        item.observacao || ""


    document.querySelector(
        ".acoes button"
    ).innerText =
        "Atualizar Lançamento"


    window.scrollTo({
        top:0,
        behavior:"smooth"
    })

}

async function excluirBaixaParcial(){

    try{

        const ok = confirm(
            "Deseja excluir a baixa parcial?"
        )

        if(!ok) return


        await fetch(

            `${API}/financeiro/${lancamentoAtual}/anular-baixa`,

            {
               method:"PUT",

              headers: authHeaders()
            }

        )

        alert("Baixa parcial removida")


        fecharModalBaixa()

        carregarLancamentos()

    }

    catch(err){

        console.error(err)

        alert("Erro ao remover baixa")

    }

}

async function confirmarBaixa(){

    try{

        const banco =
            document.getElementById(
                "bancoBaixa"
            ).value

        const valorPago =
            Number(
                document.getElementById(
                    "valorPago"
                ).value
            )

        const dataPagamento =
            document.getElementById(
                "dataPagamento"
            ).value


        if(!banco){

            alert("Selecione o banco")

            return

        }


        const restante =
            valorDocumento - valorJaPago


        if(valorPago <= 0){

            alert("Valor inválido")

            return

        }


        if(valorPago > restante){

            alert(
                "Valor maior que o saldo restante"
            )

            return

        }


        await fetch(

            `${API}/financeiro/${lancamentoAtual}/baixa`,

            {

                method:"PUT",

                headers: authHeaders({
                     "Content-Type":"application/json"
                }),

                body:JSON.stringify({

                    valor_pago:valorPago,

                    banco_pagamento:banco,

                    data_pagamento:dataPagamento

                })

            }

        )


        alert("Baixa realizada")

        fecharModalBaixa()

        carregarLancamentos()

    }

    catch(err){

        console.error(err)

        alert("Erro na baixa")

    }

}

async function carregarLancamentos(){

    try{

        const response =
         await fetch(
            `${API}/financeiro`,
        {
            headers: authHeaders()
        }
    )

        const dados =
            await response.json()

        const tbody =
            document.getElementById(
                "tbodyLancamentos"
            )

        
        tbody.innerHTML = ""


        /* =========================================
           FILTROS
        ========================================= */

        const filtroTipo =
            document.getElementById(
               "filtroTipo"
        ).value

        const filtroParceiro =
            document.getElementById(
              "filtroParceiro"
        )
            .value
            .toLowerCase()
            .trim()

        const emissaoInicial =
            document.getElementById(
                "filtroEmissaoInicial"
            ).value


        const emissaoFinal =
            document.getElementById(
                "filtroEmissaoFinal"
            ).value


        const vencInicial =
            document.getElementById(
                "filtroVencInicial"
            ).value


        const vencFinal =
            document.getElementById(
                "filtroVencFinal"
            ).value

     
        const filtroNota =
            document.getElementById(
                "filtroNota"
            )
            .value
            .toLowerCase()


               



        /* =========================================
           FILTRAR
        ========================================= */

        const filtrados = dados.filter(item=>{

            /* OCULTAR CONTAS TOTALMENTE BAIXADAS */

            const valorDoc =
                Number(item.valor || 0)

            const valorPagoDoc =
                Number(item.valor_pago || 0)

            if (
                item.status === "PAGO" ||
                (
                    valorDoc > 0 &&
                    valorPagoDoc >= valorDoc
                )
            ) {
                return false
            }

         
            /* TIPO */

            const okTipo =

              !filtroTipo ||

              item.tipo === filtroTipo


        
            /* PARCEIRO */

           const okParceiro =

                !filtroParceiro ||

                (item.parceiro || "")
                .toLowerCase()
                .trim() === filtroParceiro


            const okNota =

                !filtroNota ||

                (item.nota_fiscal || "")
                .toLowerCase()
                .includes(filtroNota)



            /* EMISSÃO */

            let okEmissao = true

            if(item.data_emissao){

                const emissao =

                    item.data_emissao
                    .split("T")[0]


                if(
                    emissaoInicial &&
                    emissao < emissaoInicial
                ){
                    okEmissao = false
                }


                if(
                    emissaoFinal &&
                    emissao > emissaoFinal
                ){
                    okEmissao = false
                }

            }



            /* VENCIMENTO */

            let okVencimento = true

            if(item.vencimento){

                const venc =

                    item.vencimento
                    .split("T")[0]


                if(
                    vencInicial &&
                    venc < vencInicial
                ){
                    okVencimento = false
                }


                if(
                    vencFinal &&
                    venc > vencFinal
                ){
                    okVencimento = false
                }

            }



            return (

                 okTipo &&
                 okParceiro &&
                 okEmissao &&
                 okNota &&
                 okVencimento
            )

        })



        /* =========================================
           TABELA
        ========================================= */

        filtrados.forEach(item=>{


            const valor =
                Number(item.valor || 0)

            const valorPago =
                Number(item.valor_pago || 0)

            const saldo =
                valor - valorPago


                const hoje = new Date()

            const vencimentoData = item.vencimento
                ? new Date(item.vencimento)
                : null

            const diffDias = vencimentoData
                ? Math.ceil(
                (vencimentoData - hoje)
                / (1000 * 60 * 60 * 24)
            )
                : null

            let corVencimento = "#111827"


            /* VENCIDO */

            if(
                vencimentoData &&
                diffDias < 0 &&
                item.status !== "PAGO"
            ){

                corVencimento = "#dc2626"

            }


/* VENCE EM ATÉ 5 DIAS */

else if(
    vencimentoData &&
    diffDias >= 0 &&
    diffDias <= 5 &&
    item.status !== "PAGO"
){

    corVencimento = "#ca8a04"

}


            tbody.innerHTML += `

                <tr>

                    <td>${item.id}</td>


                    <td class="${
                        item.tipo === 'RECEBER'
                        ? 'receber'
                        : 'pagar'
                    }">

                        ${item.tipo}

                    </td>


                    <td>
                        ${item.parceiro || ''}
                    </td>

                    <td>
                       ${item.discriminacao_periodo || ''}
                    </td>


                    <td>
                       ${item.produto_servico || ''}
                    </td>

                    <td>
                       ${item.conta_gerencial || ''}
                    </td>

                    <td>
                       ${item.nota_fiscal || ''}
                    </td>

                    <td>

                         ${valor.toLocaleString(
                            'pt-BR',{

                            style:'currency',

                            currency:'BRL'

                        })}

                    </td>


                    <td>

                        ${valorPago.toLocaleString(
                            'pt-BR',{

                            style:'currency',

                            currency:'BRL'

                        })}

                    </td>


                    <td style="
                        font-weight:bold;
                        color:${saldo > 0 ? '#dc2626' : '#15803d'};
                    ">

                        ${saldo.toLocaleString(
                    'pt-BR',{

                        style:'currency',

                        currency:'BRL'

                    })}

                    </td>

                    <td>

                        ${item.data_emissao
                            ? item.data_emissao
                            .split("T")[0]
                            .split("-")
                            .reverse()
                            .join("/")
                        : ''}

                    </td>


                    <td style="
                        font-weight:bold;
                        color:${corVencimento};
                     ">

                        ${item.vencimento
                            ? new Date(
                                item.vencimento
                              ).toLocaleDateString('pt-BR')
                            : ''}

                    </td>


                  <td class="acoes-celula">

                     <button
                        onclick="abrirBaixa(
                            ${item.id},
                            ${valor},
                            ${valorPago}
                        )"
                     >
                         Baixar
                    </button>


                    <button
                         class="btnEditar"
                         onclick='editarLancamento(${JSON.stringify(item)})'
                     >
                         Editar
                     </button>


                    <button
                          class="btnExcluir"
                          onclick="excluirLancamento(${item.id})"
                     >
                          Excluir
                     </button>


                   </td>
                    

                </tr>

            `

        })

    }

    catch(err){

        console.error(err)

    }

}

document.getElementById(
    "data_emissao"
).value =
    new Date()
    .toISOString()
    .split("T")[0]
