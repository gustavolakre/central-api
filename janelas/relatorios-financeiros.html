<script>

    async function validarLogin() {

    const token =
        localStorage.getItem("token");

    if (!token) {

        window.location.href =
            "/login";

        return;
    }

    try {

        const resposta =
            await fetch(
                "/validar-token",
                {
                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );

        if (!resposta.ok) {

            localStorage.removeItem(
                "token"
            );

            window.location.href =
                "/login";
        }

    } catch {

        window.location.href =
            "/login";
    }

}

validarLogin();

const API =
    "https://api-production-6670.up.railway.app"



function authHeaders(extra = {}){

    return {

        ...extra,

        Authorization:
            `Bearer ${
                localStorage.getItem("token")
            }`

    };

}


function voltarInicio() {

    window.location.href =
        "/janelas/inicial.html";

}


function limparFiltros(){

    document
        .querySelectorAll(
            ".checkTipo,.checkStatus,.checkParceiro"
        )
        .forEach(el=>el.checked = false)

    document.getElementById(
        "filtroEmissaoInicial"
    ).value = ""

    document.getElementById(
        "filtroEmissaoFinal"
    ).value = ""

    document.getElementById(
        "filtroVencInicial"
    ).value = ""

    document.getElementById(
        "filtroVencFinal"
    ).value = ""

    carregarRelatorio()

}


async function carregarRelatorio(){

    try{

        const response =
            await fetch(
              `${API}/financeiro`,
        {
             headers: authHeaders()
        }
    )

        const dados =
            await response.json()

        const tbody =
            document.getElementById(
                "tbodyRelatorio"
            )

        tbody.innerHTML = ""


        /* =========================================
           FILTROS
        ========================================= */

        const filtroTipo = Array.from(

            document.querySelectorAll(
                ".checkTipo:checked"
            )

        ).map(el=>el.value)


        const filtroStatus = Array.from(

            document.querySelectorAll(
                ".checkStatus:checked"
            )

        ).map(el=>el.value)


        const filtroParceiro = Array.from(

            document.querySelectorAll(
                ".checkParceiro:checked"
            )

        ).map(el=>el.value.toLowerCase())


        const emissaoInicial =
            document.getElementById(
                "filtroEmissaoInicial"
            ).value


        const emissaoFinal =
            document.getElementById(
                "filtroEmissaoFinal"
            ).value


        const vencInicial =
            document.getElementById(
                "filtroVencInicial"
            ).value


        const vencFinal =
            document.getElementById(
                "filtroVencFinal"
            ).value



        /* =========================================
           FILTRAR
        ========================================= */

        const filtrados = dados.filter(item=>{


            const okTipo =

                filtroTipo.length === 0 ||

                filtroTipo.includes(item.tipo)



            const okStatus =

                filtroStatus.length === 0 ||

                filtroStatus.includes(
                    item.status || "PENDENTE"
                )



            const okParceiro =

                filtroParceiro.length === 0 ||

                filtroParceiro.includes(
                    (item.parceiro || "")
                    .toLowerCase()
                )



            let okEmissao = true

            if(item.data_emissao){

                const emissao =

                    item.data_emissao
                    .split("T")[0]


                if(
                    emissaoInicial &&
                    emissao < emissaoInicial
                ){
                    okEmissao = false
                }


                if(
                    emissaoFinal &&
                    emissao > emissaoFinal
                ){
                    okEmissao = false
                }

            }



            let okVencimento = true

            if(item.vencimento){

                const venc =

                    item.vencimento
                    .split("T")[0]


                if(
                    vencInicial &&
                    venc < vencInicial
                ){
                    okVencimento = false
                }


                if(
                    vencFinal &&
                    venc > vencFinal
                ){
                    okVencimento = false
                }

            }



            return (

                okTipo &&
                okStatus &&
                okParceiro &&
                okEmissao &&
                okVencimento

            )

        })



        /* =========================================
           TOTALIZADORES
        ========================================= */

        let totalReceber = 0
        let totalPagar = 0
        let totalPago = 0

        filtrados.forEach(item=>{

            const valor =
                Number(item.valor || 0)

            const valorPago =
                Number(item.valor_pago || 0)


            if(item.tipo === "RECEBER"){

                totalReceber += valor

            }else{

                totalPagar += valor

            }

            totalPago += valorPago

        })


        const saldo =
            totalReceber - totalPagar


        document.getElementById(
            "totalReceber"
        ).innerText =

            totalReceber.toLocaleString(
                'pt-BR',
                {
                    style:'currency',
                    currency:'BRL'
                }
            )


        document.getElementById(
            "totalPagar"
        ).innerText =

            totalPagar.toLocaleString(
                'pt-BR',
                {
                    style:'currency',
                    currency:'BRL'
                }
            )


        document.getElementById(
            "totalPago"
        ).innerText =

            totalPago.toLocaleString(
                'pt-BR',
                {
                    style:'currency',
                    currency:'BRL'
                }
            )


        document.getElementById(
            "saldoFinal"
        ).innerText =

            saldo.toLocaleString(
                'pt-BR',
                {
                    style:'currency',
                    currency:'BRL'
                }
            )



        /* =========================================
           TABELA
        ========================================= */

        filtrados.forEach(item=>{

            const valor =
                Number(item.valor || 0)

            const valorPago =
                Number(item.valor_pago || 0)

            const saldo =
                valor - valorPago


            tbody.innerHTML += `

                <tr>

                    <td>${item.id}</td>

                    <td>${item.tipo || ''}</td>

                    <td>${item.parceiro || ''}</td>

                    <td>
                        ${item.discriminacao_periodo || ''}
                    </td>

                    <td>
                        ${item.produto_servico || ''}
                    </td>

                    <td>
                        ${item.conta_gerencial || ''}
                    </td>

                    <td>

                        ${valor.toLocaleString(
                            'pt-BR',
                            {
                                style:'currency',
                                currency:'BRL'
                            }
                        )}

                    </td>

                    <td>

                        ${valorPago.toLocaleString(
                            'pt-BR',
                            {
                                style:'currency',
                                currency:'BRL'
                            }
                        )}

                    </td>

                    <td
                        style="
                            font-weight:bold;
                            color:${saldo > 0 ? '#dc2626' : '#15803d'};
                        "
                    >

                        ${saldo.toLocaleString(
                            'pt-BR',
                            {
                                style:'currency',
                                currency:'BRL'
                            }
                        )}

                    </td>

                    <td>

                        ${item.data_emissao
                            ? item.data_emissao
                                .split("T")[0]
                                .split("-")
                                .reverse()
                                .join("/")
                            : ''
                        }

                    </td>

                    <td>

                        ${item.vencimento
                            ? item.vencimento
                                .split("T")[0]
                                .split("-")
                                .reverse()
                                .join("/")
                            : ''
                        }

                    </td>

                    <td>
                        ${item.status || ''}
                    </td>

                </tr>

            `

        })

    }

    catch(err){

        console.error(err)

    }

}

async function exportarBackupFinanceiro(){

    try{

        const response =
            await fetch(
              `${API}/financeiro`,
           {
               headers: authHeaders()
           }
       )

        const dados =
            await response.json()


        /* =========================================
           PLANILHA 1
           TODOS LANÇAMENTOS
        ========================================= */

        const wsLancamentos =
            XLSX.utils.json_to_sheet(dados)


        /* =========================================
           PLANILHA 2
           FLUXO DE CAIXA
        ========================================= */

        const bancos = [

            ...new Set(

                dados.map(item=>
                    item.banco_pagamento
                ).filter(Boolean)

            )

        ]


        const fluxo = dados.map(item=>{

            const linha = {

                ID:item.id,

                Tipo:item.tipo,

                Parceiro:item.parceiro,

                Conta:item.conta_gerencial,

                Valor:Number(item.valor || 0),

                Pago:Number(item.valor_pago || 0),

                Status:item.status,

                Banco:item.banco_pagamento || "",

                DataPagamento:
                    item.data_pagamento || ""

            }


            bancos.forEach(banco=>{

                linha[banco] =

                    item.banco_pagamento === banco

                    ? Number(item.valor_pago || 0)

                    : 0

            })


            return linha

        })


        const wsFluxo =
            XLSX.utils.json_to_sheet(fluxo)


        /* =========================================
           PLANILHA 3
           BACKUP COMPLETO
        ========================================= */

        const backupCompleto = dados.map(item=>({

            ...item,

            saldo:

                Number(item.valor || 0)

                -

                Number(item.valor_pago || 0)

        }))


        const wsBackup =
            XLSX.utils.json_to_sheet(
                backupCompleto
            )


        /* =========================================
           WORKBOOK
        ========================================= */

        const wb = XLSX.utils.book_new()


        XLSX.utils.book_append_sheet(

            wb,
            wsLancamentos,
            "Lancamentos"

        )


        XLSX.utils.book_append_sheet(

            wb,
            wsFluxo,
            "FluxoCaixa"

        )


        XLSX.utils.book_append_sheet(

            wb,
            wsBackup,
            "BackupCompleto"

        )


        /* =========================================
           EXPORTAR
        ========================================= */

        XLSX.writeFile(

            wb,

            `backup_financeiro_${
                new Date()
                .toISOString()
                .split("T")[0]
            }.xlsx`

        )

    }

    catch(err){

        console.error(err)

        alert(
            "Erro ao gerar backup"
        )

    }

}


async function carregarParceiros(){

    try{
        

        const response =
            await fetch(
           `${API}/buscarParceiros`,
            {
            headers: authHeaders()
         }
        )

        const parceiros =
            await response.json()

        const div =
            document.getElementById(
                "listaParceiros"
            )

        div.innerHTML = ""


        parceiros.forEach(parceiro=>{

            div.innerHTML += `

                <label>

                    <input
                        type="checkbox"
                        value="${parceiro.nome_usual}"
                        class="checkParceiro"
                        onchange="carregarRelatorio()"
                    >

                    ${parceiro.nome_usual}

                </label>

            `

        })

    }

    catch(err){

        console.error(err)

    }

}


(async()=>{

    carregarParceiros();

    carregarRelatorio();

})();

</script>
