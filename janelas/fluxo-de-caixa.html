<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fluxo de Caixa</title>

    <link rel="stylesheet" href="/janelas/financeiro-theme.css">

    <script src="/janelas/auth.js"></script>

</head>

<body>

<div class="topbar-dashboard">

    <div class="topbar-left">

        <button class="btnVoltar" onclick="voltarInicio()">
            ⬅ Voltar ao início
        </button>

        <span class="topbar-modulo">Financeiro</span>

    </div>

    <div class="topbar-right">

        <a href="/janelas/lancamentos-de-contas.html">
            Lançamento de Contas
        </a>

        <a href="/janelas/fluxo-de-caixa.html" class="ativo">
            Fluxo de Caixa
        </a>

        <a href="/janelas/relatorios-financeiros.html">
            Relatórios
        </a>

    </div>

</div>

<div class="page-content">

<h2 class="pagina-titulo">Fluxo de Caixa</h2>




<div class="cards">

    <div class="card">

        <h3>Saldo</h3>

        <div
            class="valor saldo"
            id="saldoFinal"
        >

            R$ 0,00

        </div>

    </div>

</div>


<div class="filtros filtros-flex">

    <div class="campo">

        <label>Banco</label>

        <select
            id="filtroBancoPrincipal"
            onchange="carregarFluxo()"
        >

            <option value="">
                Todos Bancos
            </option>

        </select>

    </div>
    



    <div class="campo">

        <label>Data Inicial</label>

        <input
            type="date"
            id="dataInicial"
            onchange="carregarFluxo()"
        >

    </div>



    <div class="campo">

        <label>Data Final</label>

        <input
            type="date"
            id="dataFinal"
            onchange="carregarFluxo()"
        >

    </div>

     <button
          class="btnLimpar"
          onclick="limparFiltros()"
     >

            Limpar Filtros

     </button>

</div>



<div class="tabela">

    <table>

        <thead>

            <tr>

            
                <th>Parceiro</th>

                <th>Produto</th>

                <th>Saídas</th>

                <th>Entradas</th>

                <th>Documento</th>

                <th>Data Pagamento</th>

                <th>Conta Gerencial</th>

                <th>Ações</th>

            </tr>

        </thead>

        <tbody id="tbodyFluxo"></tbody>

    </table>

    

</div>



<script>

    async function validarLogin() {

    const token =
        localStorage.getItem("token");

    if (!token) {

        window.location.href =
            "/login";

        return;
    }

    try {

        const resposta =
            await fetch(
                "/validar-token",
                {
                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );

        if (!resposta.ok) {

            localStorage.removeItem(
                "token"
            );

            window.location.href =
                "/login";
        }

    } catch {

        window.location.href =
            "/login";
    }

}

validarLogin();


function voltarInicio() {

    window.location.href =
        "/janelas/inicial.html";

}


const API =
    "https://api-production-6670.up.railway.app"



async function carregarBancos(){

    try{

        const response =
            await fetch(
                `${API}/bancos`,
            {
                  headers:{
                  Authorization:
                    `Bearer ${
                       localStorage.getItem("token")
                  }`
              }
           }
    )

        const bancos =
            await response.json()

        const select =
            document.getElementById(
                "filtroBancoPrincipal"
            )

        bancos.forEach(banco=>{

            select.innerHTML += `

                <option value="${banco.nome}">
                    ${banco.nome}
                </option>

            `

        })

    }

    catch(err){

        console.error(err)

    }

}


async function anularBaixa(id){

    try{

        const ok = confirm(
            "Deseja anular esta baixa?"
        )

        if(!ok) return

        await fetch(

             `${API}/financeiro/${id}/anular-baixa`,

        {
              method:"PUT",

           headers:{
               Authorization:
                  `Bearer ${
                      localStorage.getItem("token")
                 }`
          }
       }

    )

        alert("Baixa anulada")

        carregarFluxo()

    }

    catch(err){

        console.error(err)

        alert("Erro ao anular baixa")

    }

}


function limparFiltros(){

    document.getElementById(
        "filtroBancoPrincipal"
    ).value = ""

    document.getElementById(
        "dataInicial"
    ).value = ""

    document.getElementById(
        "dataFinal"
    ).value = ""

    carregarFluxo()

}


async function carregarFluxo(){

    try{

        const response =
            await fetch(
              `${API}/financeiro/fluxo`,
            {
               headers:{
               Authorization:
                `Bearer ${
                    localStorage.getItem("token")
                }`
             }
          }
       )
            

        const dados =
            await response.json()

        const tbody =
            document.getElementById(
                "tbodyFluxo"
            )

        tbody.innerHTML = ""


        const filtroBanco =
            document.getElementById(
                "filtroBancoPrincipal"
            ).value


        const dataInicial =
            document.getElementById(
                "dataInicial"
            ).value


        const dataFinal =
            document.getElementById(
                "dataFinal"
            ).value


        let saldo = 0


        const filtrados = dados.filter(item=>{


            /* SOMENTE MOVIMENTOS PAGOS */

            if(!item.data_pagamento){

                return false

            }


            /* BANCO */

            const okBanco =

                !filtroBanco ||

                item.banco_pagamento === filtroBanco



            /* DATA */

            let okData = true

            const dataPagamento =

                item.data_pagamento
                .split("T")[0]


            if(
                dataInicial &&
                dataPagamento < dataInicial
            ){

                okData = false

            }


            if(
                dataFinal &&
                dataPagamento > dataFinal
            ){

                okData = false

            }


            return (

                okBanco &&
                okData

            )

        })



        filtrados.forEach(item=>{


            const valor =
                Number(item.valor_pago || 0)


            let valorPago = 0

            let valorRecebido = 0

            let total = 0



            if(item.tipo === "PAGAR"){

                valorPago = valor

                total = valor * -1

                saldo -= valor

            }

            else{

                valorRecebido = valor

                total = valor

                saldo += valor

            }



          tbody.innerHTML += `

    <tr>

        <td>
            ${item.parceiro || ''}
        </td>

        <td>
            ${item.produto_servico || ''}
        </td>

        <!-- SAÍDAS -->

        <td style="
            color:#dc2626;
            font-weight:bold;
        ">

            ${
                item.tipo === "PAGAR"

                ? Number(item.valor_pago || 0)
                    .toLocaleString('pt-BR',{

                        style:'currency',
                        currency:'BRL'

                    })

                : "R$ 0,00"
            }

        </td>


        <!-- ENTRADAS -->

        <td style="
            color:#15803d;
            font-weight:bold;
        ">

            ${
                item.tipo === "RECEBER"

                ? Number(item.valor_pago || 0)
                    .toLocaleString('pt-BR',{

                        style:'currency',
                        currency:'BRL'

                    })

                : "R$ 0,00"
            }

        </td>


        <!-- NOTA -->

        <td>
            ${item.nota_fiscal || ''}
        </td>


        <!-- DATA PAGAMENTO -->

        <td>

            ${item.data_pagamento

                ? new Date(item.data_pagamento)
                    .toLocaleDateString('pt-BR')

                : ''
            }

        </td>

        <td>
              ${item.conta_gerencial || ''}
        </td>


        <!-- AÇÕES -->

        <td>

            <button
                onclick="anularBaixa(${item.id})"
            >

                Anular Baixa

            </button>

        </td>

    </tr>

`

        })



        document.getElementById(
            "saldoFinal"
        ).innerText =

            saldo.toLocaleString(
                'pt-BR',{

                style:'currency',

                currency:'BRL'

            })

    }

    catch(err){

        console.error(err)

    }

}



(async()=>{

    carregarBancos();

    carregarFluxo();

})();

</script>

</div>

</body>

</html>
