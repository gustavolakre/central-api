<!DOCTYPE html>
<html>
<body>

<input
    id="usuario"
    placeholder="Usuário"
>

<input
    id="senha"
    type="password"
    placeholder="Senha"
>

<button onclick="entrar()">
    Entrar
</button>

<script>


if(localStorage.getItem("token")){

    const destino =
        localStorage.getItem("paginaDestino")
        || "/janelas/dashboard.html";

    localStorage.removeItem(
        "paginaDestino"
    );

    window.location.href =
        destino;

}

async function entrar(){

   const API =
    "https://api-production-6670.up.railway.app";

   const resposta =
      await fetch(
        `${API}/login`,
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                usuario:
                    document.getElementById("usuario").value,
                senha:
                    document.getElementById("senha").value
            })
        }
    );

    const dados =
        await resposta.json();

   
    if(dados.token){

        localStorage.setItem(
          "token",
          dados.token
      );

      const destino =
        localStorage.getItem("paginaDestino")
          || "/janelas/dashboard.html";

       localStorage.removeItem(
          "paginaDestino"
     );

      window.location.href =
        destino;
     }else{

        alert(
            JSON.stringify(dados)
        );

    }

}

</script>

</body>
</html>
