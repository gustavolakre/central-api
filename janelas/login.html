<!DOCTYPE html>
<html>
<body>

<input
    id="usuario"
    placeholder="Usuário"
>

<input
    id="senha"
    type="password"
    placeholder="Senha"
>

<button onclick="entrar()">
    Entrar
</button>

<script>


if(localStorage.getItem("token")){

    window.location.href =
         "/janelas/dashboard.html";

}

async function entrar(){

   const API =
    "https://api-production-6670.up.railway.app";

   const resposta =
      await fetch(
        `${API}/login`,
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                usuario:
                    document.getElementById("usuario").value,
                senha:
                    document.getElementById("senha").value
            })
        }
    );

    const dados =
        await resposta.json();

   
    if(dados.token){

        localStorage.setItem(
            "token",
            dados.token
         );
         console.log(
             "TOKEN SALVO:",
              localStorage.getItem("token")
          );

        window.location.href =
         "/janelas/dashboard.html";

    }else{

        alert(
            JSON.stringify(dados)
        );

    }

}

</script>

</body>
</html>
