<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login — Faturamento</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI", Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 55%,#3b82f6 100%);
}

.card-login{
    width:100%;
    max-width:400px;
    background:#ffffff;
    border-radius:20px;
    padding:40px 36px;
    box-shadow:0 20px 60px rgba(15,23,42,0.35);
}

.brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    margin-bottom:28px;
}

.brand-logo{
    height:88px;
    max-width:220px;
    object-fit:contain;
    margin-bottom:18px;
}

.brand h1{
    font-size:24px;
    font-weight:700;
    color:#0f172a;
}

.brand p{
    margin-top:6px;
    font-size:14px;
    color:#64748b;
}

.campo{
    margin-bottom:16px;
}

.campo label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:#475569;
    margin-bottom:6px;
}

.campo input{
    width:100%;
    height:48px;
    padding:0 14px;
    background:#f8fafc;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
    color:#1e293b;
    transition:0.15s;
}

.campo input::placeholder{
    color:#94a3b8;
}

.campo input:focus{
    outline:none;
    background:#ffffff;
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,0.15);
}

.btn-entrar{
    width:100%;
    height:48px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#ffffff;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:0.15s;
    box-shadow:0 6px 16px rgba(37,99,235,0.35);
}

.btn-entrar:hover{
    background:#1d4ed8;
    transform:translateY(-1px);
}

.btn-entrar:active{
    transform:translateY(0);
}

.btn-entrar:disabled{
    opacity:0.7;
    cursor:not-allowed;
    transform:none;
}

.erro-login{
    margin-top:14px;
    padding:10px 12px;
    background:#fef2f2;
    border:1px solid #fecaca;
    color:#b91c1c;
    border-radius:8px;
    font-size:13px;
    text-align:center;
    display:none;
}

.rodape{
    margin-top:22px;
    text-align:center;
    color:#94a3b8;
    font-size:12px;
}

</style>

</head>

<body>

<div class="card-login">

    <div class="brand">

        <img
            class="brand-logo"
            src="/janelas/imagens/usuarios/logo%20lakre.png"
            alt="Lakre"
        >

        <h1>Login</h1>

        <p>Acesse sua conta para continuar</p>

    </div>

    <div class="campo">
        <label for="usuario">Usuário</label>
        <input
            id="usuario"
            placeholder="seu@email.com"
            autocomplete="username"
        >
    </div>

    <div class="campo">
        <label for="senha">Senha</label>
        <input
            id="senha"
            type="password"
            placeholder="••••••••"
            autocomplete="current-password"
        >
    </div>

    <button
        class="btn-entrar"
        id="btnEntrar"
        onclick="entrar()"
    >
        Entrar
    </button>

    <div id="erroLogin" class="erro-login"></div>

    <div class="rodape">
        Sistema de Faturamento
    </div>

</div>

<script>


if(localStorage.getItem("token")){

    const destino =
        localStorage.getItem("paginaDestino")
        || "/janelas/inicial.html";

    localStorage.removeItem(
        "paginaDestino"
    );

    window.location.href =
        destino;

}

async function entrar(){

   const API =
    "https://api-production-6670.up.railway.app";

   const btn =
        document.getElementById("btnEntrar");

   const erro =
        document.getElementById("erroLogin");

   erro.style.display = "none";

   btn.disabled = true;
   btn.textContent = "Entrando...";

   try {

       const resposta =
          await fetch(
            `${API}/login`,
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    usuario:
                        document.getElementById("usuario").value,
                    senha:
                        document.getElementById("senha").value
                })
            }
        );

        const dados =
            await resposta.json();

        if(dados.token){

            localStorage.setItem(
              "token",
              dados.token
          );

          const destino =
            localStorage.getItem("paginaDestino")
              || "/janelas/inicial.html";

           localStorage.removeItem(
              "paginaDestino"
         );

          window.location.href =
            destino;

         }else{

            erro.textContent =
                dados.erro || "Usuário ou senha inválidos.";

            erro.style.display = "block";

            btn.disabled = false;
            btn.textContent = "Entrar";

        }

   } catch(e) {

        erro.textContent =
            "Erro de conexão. Tente novamente.";

        erro.style.display = "block";

        btn.disabled = false;
        btn.textContent = "Entrar";

   }

}

document.addEventListener("keydown", (e) => {
    if(e.key === "Enter"){
        entrar();
    }
});

</script>

</body>
</html>
